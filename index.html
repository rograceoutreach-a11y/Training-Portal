ling. Tyndale.<\/p><\/li>\n<li><p>Coe, J. H., &amp; Hall, T. W. (2010). Psychology in the Spirit: Contours of a Transformational Psychology. IVP Academic.<\/p><\/li>\n<li><p>Crabb, L. (1977). Effective Biblical Counseling. Zondervan.<\/p><\/li>\n<li><p>Collins, G. R. (2007). Christian Counseling: A Comprehensive Guide (3rd ed.). Thomas Nelson.<\/p><\/li>\n<\/ul>\n<h3 id=\"psychological-theory-and-theology\">Psychological Theory and Theology<\/h3>\n<ul>\n<li><p>Moriarty, G. L., &amp; Hoffman, L. (2007). God Image Handbook for Spiritual Counseling and Psychotherapy. Haworth Press.<\/p><\/li>\n<li><p>Clinton, T., &amp; Ohlschlager, G. (2002). Competent Christian Counseling. WaterBrook Press.<\/p><\/li>\n<li><p>Brown, W. S., &amp; Strawn, B. D. (2012). The Physical Nature of Christian Life: Neuroscience, Psychology, and the Church. Cambridge.<\/p><\/li>\n<li><p>Benner, D. G. (2003). Strategic Pastoral Counseling: A Short-Term Structured Model (2nd ed.). Baker Academic.<\/p><\/li>\n<li><p>Tan, S. Y. (2011). Counseling and Psychotherapy: A Christian Perspective. Baker Academic.<\/p><\/li>\n<\/ul>\n<h3 id=\"spiritual-formation-and-soul-care\">Spiritual Formation and Soul Care<\/h3>\n<ul>\n<li><p>Foster, R. (1988). Celebration of Discipline. HarperOne.<\/p><\/li>\n<li><p>Willard, D. (1988). The Spirit of the Disciplines. HarperOne.<\/p><\/li>\n<li><p>Boa, K. (2001). Conformed to His Image. Zondervan.<\/p><\/li>\n<li><p>Benner, D. G. (2002). Sacred Companions: The Gift of Spiritual Friendship and Direction. IVP Books.<\/p><\/li>\n<li><p>Pargament, K. I. (2007). Spiritually Integrated Psychotherapy. Guilford Press.<\/p><\/li>\n<\/ul>\n<h3 id=\"trauma-grief-and-suffering\">Trauma, Grief, and Suffering<\/h3>\n<ul>\n<li><p>van der Kolk, B. (2014). The Body Keeps the Score. Viking Penguin.<\/p><\/li>\n<li><p>Worden, J. W. (2018). Grief Counseling and Grief Therapy (5th ed.). Springer.<\/p><\/li>\n<li><p>Tedeschi, R. G., &amp; Calhoun, L. G. (2004). Posttraumatic Growth: Conceptual Foundations and Empirical Evidence. Psychology Press.<\/p><\/li>\n<li><p>Vroegop, M. (2019). Dark Clouds, Deep Mercy: Discovering the Grace of Lament. Crossway.<\/p><\/li>\n<li><p>Langberg, D. (2015). Suffering and the Heart of God: How Trauma Destroys and Christ Restores. New Growth Press.<\/p><\/li>\n<\/ul>\n<h3 id=\"specialized-populations-and-practice\">Specialized Populations and Practice<\/h3>\n<ul>\n<li><p>Clinton, T., &amp; Trent, J. (2009). The Quick-Reference Guide to Marriage and Family Counseling. Baker Books.<\/p><\/li>\n<li><p>Sell, C. M. (1995). Family Ministry (2nd ed.). Zondervan.<\/p><\/li>\n<li><p>London, H. B., &amp; Wiseman, N. B. (2003). Pastors at Greater Risk. Regal Books.<\/p><\/li>\n<li><p>Sue, D. W., &amp; Sue, D. (2015). Counseling the Culturally Diverse (7th ed.). Wiley.<\/p><\/li>\n<li><p>Fowler, J. W. (1981). Stages of Faith. HarperOne.<\/p><\/li>\n<\/ul>\n<h3 id=\"journals-and-periodicals\">Journals and Periodicals<\/h3>\n<ul>\n<li><p>Journal of Psychology and Theology (Biola University)<\/p><\/li>\n<li><p>Journal of Psychology and Christianity (CAPS)<\/p><\/li>\n<li><p>Mental Health, Religion &amp; Culture (Taylor &amp; Francis)<\/p><\/li>\n<li><p>Edification: The Transdisciplinary Journal of Christian Psychology<\/p><\/li>\n<li><p>Christian Counseling Today (AACC)<\/p><\/li>\n<\/ul>\n<h3 id=\"professional-associations-and-online-resources\">Professional Associations and Online Resources<\/h3>\n<ul>\n<li><p>American Association of Christian Counselors (AACC) — aacc.net<\/p><\/li>\n<li><p>Christian Association for Psychological Studies (CAPS) — caps.net<\/p><\/li>\n<li><p>Biola University Center for Christian Thought — cct.biola.edu<\/p><\/li>\n<li><p>Redeemer Counseling Services (RCS) — redeemercounseling.com<\/p><\/li>\n<li><p>CCEF (Christian Counseling &amp; Educational Foundation) — ccef.org<\/p><\/li>\n<li><p>Psychology Today Therapist Finder — psychologytoday.com<\/p><\/li>\n<li><p>PubMed / PsycINFO — for peer-reviewed research<\/p><\/li>\n<\/ul>\n<h3 id=\"program-completion-requirements\">Program Completion Requirements<\/h3>\n<p>To earn the Integrated Christian Counseling Completion Letter, students must:<\/p>\n<ul>\n<li><p>Complete all five modules and achieve a minimum of 75% in each<\/p><\/li>\n<li><p>Submit all practicum requirements and receive supervisor sign-off<\/p><\/li>\n<li><p>Complete the Module 5 Capstone Case Presentation with a minimum grade of Proficient<\/p><\/li>\n<li><p>Submit the Integration Paper (Module 5) demonstrating synthesis across all five modules<\/p><\/li>\n<li><p>Participate meaningfully in at least 80% of discussion forums and webinars<\/p><\/li>\n<\/ul>\n<p><em>\"For we are God's handiwork, created in Christ Jesus to do good works, which God prepared in advance for us to do.\"<\/em><\/p>\n<p><strong>Ephesians 2:10<\/strong><\/p>\n", "track": false}, "p4-intro": {"title": "Introduction — Now Is the Time to Believe", "group": "p4", "html": "<p><strong>Format:<\/strong> 12 units in four movements — HOPE (Units 1–4), FAITH (Units 5–6), PEACE (Units 7–11), GRACE (Unit 12) — closing with the Salvation Invitation. Weekly, 60–75 minutes.<\/p>\n<p><strong>Primary text:<\/strong> <em>Now Is the Time to Believe<\/em> by Thomas E. Walker (2015). Assign the corresponding chapter as pre-reading for each unit.<\/p>\n<p><em>\"Many are the afflictions of the righteous, but the Lord delivers him out of them all.\" — Psalm 34:19 (NKJV)<\/em><\/p>\n<p>Phase IV is the inspirational heart of the training pathway. Where Phase I taught doctrine, Phase II ministered to wounds, and Phase III formed counselors, Phase IV forms the <strong>believing witness<\/strong> — the student who can testify from personal experience that God is real, that grace is sufficient, and that <em>now<\/em> is the acceptable time.<\/p>\n<p>Built on the author's own testimony of God's love and faithfulness, this phase walks students through the same journey the book walks its readers: from the invitation of hope, through the surrender of the will, into the strength and peace of a living relationship with Christ, and finally to the great distinction that closes the book — Christianity is <em>not about a religion; it's about a relationship<\/em>.<\/p>\n<p>Mankind was created with free will and a choice to voluntarily worship God — worship that is heartfelt, never forced. Sin drove us from that purpose, but God's grace — unmerited favor that cannot be paid for or earned — is extended to everyone who truly wants and needs Him to be Lord of their lives. Each unit pairs the chapter's anchor scriptures with teaching points drawn from the book, discussion threads for the group, and a personal reflection assignment, because this phase is not merely studied — it is <em>experienced<\/em>. The central challenge of every unit is the book's own: <strong>\"There is nothing too hard for God.\" Do you believe it?<\/strong><\/p>\n<h3 id=\"how-to-facilitate-this-phase\">How to Facilitate This Phase<\/h3>\n<ol type=\"1\">\n<li>Open each unit with the anchor scripture read aloud, then invite one student to share where their week met the unit's theme.<\/li>\n<li>Teach from the summary and teaching points, weaving in the author's testimony from the chapter and your own.<\/li>\n<li>Give the discussion threads most of the meeting time — this phase moves at the speed of testimony.<\/li>\n<li>Close in prayer around the unit's theme, and assign the reflection plus next unit's chapter.<\/li>\n<li>At the end of Unit 12, hold the Salvation Invitation gathering — an open evening built on the book's Salvation Prayer, for students to bring friends and family.<\/li>\n<\/ol>\n", "track": false}, "p4-u1": {"title": "Unit 1: Now Is the Acceptable Time (HOPE)", "group": "p4", "html": "<p><strong>Movement: HOPE — \"My People\"<\/strong> · Book chapter 1 · Anchor: 2 Corinthians 6:1–10<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Paul pleads with the Corinthians \"not to receive the grace of God in vain,\" declaring: \"Behold, now is the accepted time; behold, now is the day of salvation.\" This opening unit confronts the oldest delay in the human heart — <em>later<\/em>. Students examine what Christianity actually is (not a culture we grew up in, not our surroundings, but a living response to Christ), recall their own first spiritual encounters, and hear the unit's central announcement: salvation is not a someday decision. The door God opens is marked <strong>now<\/strong>.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Corinthians 6:1–10 — now is the accepted time; the marks of a genuine ministry<\/li>\n<li>Isaiah 49:8 — \"In an acceptable time I have heard you\"<\/li>\n<li>Psalm 34:19 — many are the afflictions of the righteous, but the Lord delivers<\/li>\n<li>Hebrews 3:15 — \"Today, if you will hear His voice, do not harden your hearts\"<\/li>\n<li>2 Peter 3:9 — God is not willing that any should perish<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Christianity is not inherited, assumed, or absorbed from environment — it begins with a personal, remembered encounter with the living God.<\/li>\n<li>Grace received \"in vain\" is grace admired but never acted upon; the acceptable time collapses when we postpone response.<\/li>\n<li>Paul's catalogue of hardships (tribulations, needs, distresses) proves that receiving grace is not the end of affliction but the beginning of deliverance through it.<\/li>\n<li>Hope is the first movement of belief: before faith can stand or peace can settle, hope must announce that change is possible <em>today<\/em>.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Can you remember when you first understood what being a Christian really meant — not culturally, but personally? What changed?<\/li>\n<li>What does it mean, practically, to \"receive the grace of God in vain\"? Where do people do that today?<\/li>\n<li>Why do we say \"someday I'll get serious with God\"? What is the heart actually protecting when it delays?<\/li>\n<li>Paul lists hardships and graces side by side (v. 4–10). How does that list correct the idea that believers are promised ease?<\/li>\n<li>If now is the acceptable time, what is the \"now\" decision God is placing before you this week?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write one page: your earliest genuine spiritual encounter — where you were, what you understood, and what you did with it. Close with one sentence naming the decision you have been postponing, and bring it (sealed, private) to the Unit 3 surrender night.<\/p>\n", "track": true}, "p4-u2": {"title": "Unit 2: I Lift My Hands (HOPE)", "group": "p4", "html": "<p><strong>Movement: HOPE<\/strong> · Book chapter 2 · Anchor: Psalm 116:12–17<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"What shall I return to the Lord for all his goodness to me? I will lift up the cup of salvation and call on the name of the Lord.\" Drawing on the author's testimony of being called to the altar as a teenager — the organ playing, the pastor asking \"Do you believe?\", and those four words, <em>LIFT UP YOUR HANDS<\/em> — this unit studies the posture of worship. Raised hands feel vulnerable and exposed because they are: they announce publicly that the will is surrendering. Students explore why God asks for visible, embodied, willing worship rather than private, protected assent.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Psalm 116:12–17 — lifting the cup of salvation; fulfilling vows before all His people<\/li>\n<li>Psalm 63:4 — \"I will lift up my hands in Your name\"<\/li>\n<li>Psalm 134:2 — lift up your hands in the sanctuary and bless the Lord<\/li>\n<li>1 Timothy 2:8 — lifting holy hands, without wrath and doubting<\/li>\n<li>Romans 12:1 — present your bodies a living sacrifice<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Lifting hands is the body's confession before the mouth speaks: vulnerability chosen on purpose, surrender made visible.<\/li>\n<li>Worship that costs nothing — no exposure, no humility, no public identification with Christ — returns nothing to the Lord for His goodness.<\/li>\n<li>The altar moment is not emotionalism; it is covenant: vows fulfilled \"in the presence of all his people\" (Ps 116:14).<\/li>\n<li>Free-will worship is the purpose we were created for; God refuses forced praise because love coerced is not love.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Why does raising our hands feel so exposing? What does that discomfort reveal about what worship actually asks of us?<\/li>\n<li>\"What shall I return to the Lord?\" — how would you answer the psalmist's question this season of your life?<\/li>\n<li>Where have you seen the difference between worship as performance, worship as routine, and worship as surrender?<\/li>\n<li>Does God care about our bodies in worship — posture, voice, presence — or only our hearts? Defend from scripture.<\/li>\n<li>What is one act of visible, public identification with Christ you have been avoiding?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>This week, in private devotion, physically lift your hands as you pray each day — and journal what resists it and what changes by day seven.<\/p>\n", "track": true}, "p4-u3": {"title": "Unit 3: I Surrender All (HOPE)", "group": "p4", "html": "<p><strong>Movement: HOPE<\/strong> · Book chapter 3 · Anchor: Psalm 51:1–10<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>David's great prayer of repentance — \"Create in me a pure heart, O God, and renew a steadfast spirit within me\" — anchors the unit on surrender. Surrender is a process for anyone, regardless of background, lifestyle, race, or belief; a free-willed person does not easily allow someone else to shape and redirect their life. The book presses past the moment of \"praying the sinner's prayer\" to the deeper matter many new Christians never learn: the surrendering of the <em>personal will<\/em> and <em>emotional will<\/em> to be renewed to the spirit and will of Christ.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Psalm 51:1–10 — mercy, cleansing, and the clean heart<\/li>\n<li>Luke 9:23 — deny yourself, take up your cross daily<\/li>\n<li>Proverbs 3:5–6 — trust in the Lord with all your heart; lean not on your own understanding<\/li>\n<li>Galatians 2:20 — crucified with Christ; nevertheless I live<\/li>\n<li>Romans 12:2 — transformed by the renewing of the mind<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Salvation is received in a moment; surrender is learned in a lifetime — conversion begins the process, it does not complete it.<\/li>\n<li>The will and the emotions are the last territories to fly the white flag: many surrender their Sundays long before they surrender their decisions, their money, their relationships, or their reactions.<\/li>\n<li>David's prayer models the anatomy of surrender: honest confession (\"my sin is always before me\"), acceptance of God's verdict, plea for cleansing, and request for a <em>created<\/em> — not self-improved — clean heart.<\/li>\n<li>A surrendered life is not a diminished life; it is a redirected one, steered at last by hands stronger and kinder than our own.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Which is harder for you to surrender — behavior, will, or emotions? Why do they surrender on different timetables?<\/li>\n<li>What did surrender cost you when you first came to Christ? What is it asking of you now?<\/li>\n<li>Why do we teach new believers to pray a prayer but so rarely teach them to surrender a will?<\/li>\n<li>David says \"Against you, you only, have I sinned.\" How does seeing sin as against <em>God<\/em> (not just consequences) change repentance?<\/li>\n<li>What would your closest friend say is the one area you still hold back from God?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Memorize Psalm 51:10. Hold the surrender night: each student brings the sealed sentence from Unit 1 and lays it on the altar during prayer — a physical act of releasing the postponed decision to God.<\/p>\n", "track": true}, "p4-u4": {"title": "Unit 4: Jesus Breaks Every Chain (HOPE)", "group": "p4", "html": "<p><strong>Movement: HOPE<\/strong> · Book chapter 4 · Anchor: 2 Corinthians 3:17; Luke 4:18<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom.\" This unit names the chains — including some forged inside religion itself. The shackles of political correctness, legalism, and traditionalism can keep believers from shouting that there is liberty in Christ. History records countless self-appointed experts on the \"perfect will of God\" who used indulgences, guidelines, and man-made specifications to hold believers in bondage to <em>their interpretations<\/em> of grace. Jesus announced His mission from Isaiah: freedom for the prisoners, sight for the blind, liberty for the oppressed — and He has never amended it.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Corinthians 3:17 — where the Spirit of the Lord is, there is freedom<\/li>\n<li>Luke 4:18–19 — anointed to proclaim liberty to the captives<\/li>\n<li>Galatians 5:1 — stand fast in the liberty by which Christ has made us free<\/li>\n<li>John 8:36 — whom the Son sets free is free indeed<\/li>\n<li>Isaiah 61:1–2 — the year of the Lord's favor<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Chains come in two metals: the iron of sin and the gold of religion — Christ breaks both.<\/li>\n<li>Legalism is bondage with a Bible verse attached; it keeps believers enslaved to human interpretations rather than free in Christ's finished work.<\/li>\n<li>Freedom is obtained through prayer and consecration — deliberately allowing Christ to become <em>Lord<\/em>, not merely Savior, of our lives.<\/li>\n<li>Liberty in Christ is not license (that lesson returns in every phase of this program); it is release <em>from<\/em> bondage <em>for<\/em> love.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>What chains did Christ break in your life — and which links took the longest to fall?<\/li>\n<li>Where have you seen religious tradition function as a chain rather than a channel of grace?<\/li>\n<li>How do we honor godly tradition without letting traditionalism enslave the next generation?<\/li>\n<li>Why are believers sometimes afraid of the very freedom Christ purchased for them?<\/li>\n<li>Who in your circle is still bound — and what would proclaiming liberty to them actually look like this month?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Identify one \"chain\" of legalism, fear, or tradition you have accepted as normal. Research what scripture actually says about it, write a half-page comparison, and share your finding with the group.<\/p>\n", "track": true}, "p4-u5": {"title": "Unit 5: Speak to My Heart, Lord (FAITH)", "group": "p4", "html": "<p><strong>Movement: FAITH — \"Grace, the Blood &amp; His Blessings\"<\/strong> · Book chapter 5 · Anchor: 1 Samuel 16:7; Romans 10:9–10<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"Man looks on the outward appearance, but the Lord looks on the heart.\" The FAITH movement opens where faith actually lives — the heart. Mankind was created for worship, and God desires worship that is supernatural and honest, offered in reverence, fear, and submission to His presence. Jesus Himself modeled it: knowing the full cost of His mission, He still prayed \"Not my will, but thy will be done.\" Students learn that faith is not first spoken from the mouth but believed in the heart — and that a heart God can speak <em>to<\/em> is a heart that has been surrendered <em>to Him<\/em>.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>1 Samuel 16:7 — the Lord looks on the heart<\/li>\n<li>Romans 10:9–10 — believe in the heart, confess with the mouth<\/li>\n<li>Luke 22:42 — not my will, but Yours be done<\/li>\n<li>Philippians 2:9–11 — at the name of Jesus every knee shall bow<\/li>\n<li>Psalm 95:6–7 — come, let us worship and bow down<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>God's evaluation runs opposite to man's: He passes over stature and appearance to weigh the heart — so heart-preparation is the believer's first discipline.<\/li>\n<li>Faith has an anatomy in Romans 10: the heart believes unto righteousness; the mouth confesses unto salvation. Reversing the order produces words without life.<\/li>\n<li>Reverence is not fear of harm but awe of holiness; a generation unfamiliar with reverence must be <em>taught<\/em> to enter God's presence.<\/li>\n<li>Jesus in Gethsemane is the pattern of the listening heart: full disclosure of desire, full surrender of will.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>When has God \"spoken to your heart\"? How did you distinguish His voice from your own thoughts?<\/li>\n<li>Why does God insist on examining hearts rather than résumés? How should that change how we evaluate others?<\/li>\n<li>What conditions make a heart hard for God to speak to — and which of them is present in your life right now?<\/li>\n<li>Is reverence disappearing from modern worship? What would restore it without becoming mere formality?<\/li>\n<li>\"Not my will, but thy will be done\" — where are those words currently being tested in you?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Keep a five-day listening journal: fifteen minutes daily of silence with an open Bible, recording what scripture, impression, or conviction the Lord brings. Bring one entry to share.<\/p>\n", "track": true}, "p4-u6": {"title": "Unit 6: God, Give Me Strength (FAITH)", "group": "p4", "html": "<p><strong>Movement: FAITH<\/strong> · Book chapter 6 · Anchor: 2 Timothy 1:7; Philippians 4:13; Romans 8:37<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"God has not given us a spirit of fear, but of power and of love and of a sound mind.\" Rededication has an aftermath the church rarely warns about: the enemy hears the cry of repentance and comes to \"re-claim\" what he lost. Drawing from the author's testimony of the battles that followed his return to Christ, this unit teaches students to stand — relying on the indwelling Holy Spirit for strength, refusing fear, and remaining confident that nothing can steal the joy and peace we have in Christ. \"I can do all things through Christ who strengthens me\" is not a slogan; it is survival equipment.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Timothy 1:7 — power, love, and a sound mind<\/li>\n<li>Philippians 4:13 — I can do all things through Christ<\/li>\n<li>Romans 8:37 — more than conquerors through Him who loved us<\/li>\n<li>Deuteronomy 31:6 — He will never leave you nor forsake you<\/li>\n<li>Ephesians 6:10–18 — the whole armor of God<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Expect the counterattack: renewed commitment provokes renewed opposition — this is evidence of new life, not evidence of failure.<\/li>\n<li>The Spirit's provision is threefold and complete: <em>power<\/em> for the fight, <em>love<\/em> for the wounded, a <em>sound mind<\/em> against the enemy's chief weapon, fear.<\/li>\n<li>Strength is not self-generated; it is Christ's strength operating through dependence — \"through Christ,\" never \"through willpower.\"<\/li>\n<li>More than conquerors: the believer does not fight <em>for<\/em> victory but <em>from<\/em> it.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>What happened in the weeks after your strongest recommitment to Christ? Did anyone warn you?<\/li>\n<li>How does fear disguise itself in a believer's life — worry, control, silence, avoidance? Which costume does it wear in yours?<\/li>\n<li>What is the difference between asking God for strength and presuming on your own?<\/li>\n<li>Which piece of the armor of God (Eph 6) is most neglected in your daily walk, and what would putting it on look like?<\/li>\n<li>Share a time when you were weakest and Christ proved strongest. What did that season teach you about His faithfulness?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write out 2 Timothy 1:7 and post it where you face your most recurring fear. Each time fear rises this week, speak the verse aloud and journal the outcome.<\/p>\n", "track": true}, "p4-u7": {"title": "Unit 7: Love Lifted Me (PEACE)", "group": "p4", "html": "<p><strong>Movement: PEACE — \"Now You See Me\"<\/strong> · Book chapter 7 · Anchor: John 3:16; John 15:13; Galatians 5:22–23<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>The PEACE movement opens by exposing the counterfeit: self-help culture promises that greatness and fulfillment come through motivation, status, and success. A person can be superficially happy with wealth and prestige — and still, deep down, carry complacency and loneliness, discovering that some people love what they have rather than who they are. Against this the unit sets the love that actually lifts: \"Greater love hath no man than this, that a man lay down his life for his friends.\" Real peace begins when we are loved by Someone who has nothing to gain from us and gave everything for us.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>John 3:16 — God so loved the world that He gave<\/li>\n<li>John 15:13 — greater love hath no man than this<\/li>\n<li>Galatians 5:22–23 — the fruit of the Spirit<\/li>\n<li>Romans 5:8 — while we were yet sinners, Christ died for us<\/li>\n<li>1 John 4:19 — we love Him because He first loved us<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Self-help can improve circumstances; only sacrificial love can heal a soul — the two must never be confused in our teaching or counseling.<\/li>\n<li>Wealth and status can insulate a life from struggle while starving it of love; the loneliest rooms are sometimes the most expensive.<\/li>\n<li>God's love is measured by cost, not sentiment: \"He gave His only begotten Son.\"<\/li>\n<li>The fruit of the Spirit begins with love because every other fruit grows on its branch.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Where has self-help culture crept into the church's message? How do we tell encouragement from counterfeit gospel?<\/li>\n<li>Have you ever achieved something you thought would satisfy you — and found loneliness on the other side? What did that teach you?<\/li>\n<li>How do you know when someone loves <em>you<\/em> versus what you provide? How does God's love differ on exactly that point?<\/li>\n<li>\"Love lifted me\" — from what, specifically, did God's love lift you?<\/li>\n<li>Which fruit of the Spirit grows most naturally in you, and which requires the most deliberate abiding?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write your \"lifted\" testimony in one page — what you were sinking in, how God's love reached you, and where you stand now. These testimonies seed the Salvation Invitation gathering after Unit 12.<\/p>\n", "track": true}, "p4-u8": {"title": "Unit 8: So Glad I Made It (PEACE)", "group": "p4", "html": "<p><strong>Movement: PEACE<\/strong> · Book chapter 8 · Anchor: 2 Corinthians 12:9–11; Isaiah 43:19<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"My grace is sufficient for you, for my strength is made perfect in weakness.\" This is the wilderness unit. The author testifies of his own desert — the desire to be the best father, the costly gamble of seeking a helper his own way, and the slow drift from the blessings of obedience into the curses of disobedience: cursed finances, cursed home, family stricken with illness. Restoration did not come by trying harder; it came by repenting deeply, humbling himself under 2 Chronicles 7:14, and asking God to create a clean heart. And then the promise of Isaiah: \"Behold, I will do a new thing... I will even make a way in the wilderness, and rivers in the desert.\"<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Corinthians 12:9–11 — grace sufficient; strength perfected in weakness<\/li>\n<li>Isaiah 43:19 — a new thing; rivers in the desert<\/li>\n<li>2 Chronicles 7:14 — if my people humble themselves, and pray<\/li>\n<li>Deuteronomy 28 — the blessings of obedience and curses of disobedience<\/li>\n<li>Psalm 51:10 — create in me a clean heart<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Some deserts we are led into; others we wander into — recognizing which one you are in determines the way out.<\/li>\n<li>Disobedience has an ecosystem: it rarely curses one area of life while sparing the rest.<\/li>\n<li>The road out of the wilderness always passes through 2 Chronicles 7:14 — humbling, praying, seeking, turning — never around it.<\/li>\n<li>Testimony transforms scars into signposts: \"so glad I made it\" is worship that only survivors can offer.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Describe your wilderness season. Looking back, was it a leading, a wandering, or both?<\/li>\n<li>How did disobedience in one area of your life spread to others before you recognized it?<\/li>\n<li>Why is boasting in weakness (Paul's phrase) so contrary to our instincts — and what does it accomplish that hiding weakness cannot?<\/li>\n<li>What \"new thing\" did God do that you could never have engineered yourself?<\/li>\n<li>Who needs to hear your \"so glad I made it\" testimony — and what is stopping you from telling them?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Map your wilderness on paper: entry point, lowest point, turning point (where 2 Chron 7:14 met you), and exit. Note the scripture God used at each stage. Volunteers share at the next meeting.<\/p>\n", "track": true}, "p4-u9": {"title": "Unit 9: Love Is the Reason (PEACE)", "group": "p4", "html": "<p><strong>Movement: PEACE<\/strong> · Book chapter 9 · Anchor: 1 Peter 4:7–11<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"As each one has received a gift, minister it to one another, as good stewards of the manifold grace of God.\" Every believer carries a spark — a gift that draws people, a gleam that reveals divine purpose. This unit teaches students to identify their gifts, to steward them for God's glory rather than self-promotion, and to understand <em>why<\/em> the gifts were given: fervent love for one another, because \"love will cover a multitude of sins.\" When we sing, serve, counsel, lead, or give, and then acknowledge the Giver, our gifts become worship.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>1 Peter 4:7–11 — stewards of the manifold grace of God<\/li>\n<li>Romans 12:4–8 — gifts differing according to grace<\/li>\n<li>1 Corinthians 13:1–3 — gifts without love profit nothing<\/li>\n<li>Matthew 5:16 — let your light shine, that they may glorify your Father<\/li>\n<li>James 1:17 — every good and perfect gift is from above<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Gifts are distributed, not achieved: they arrive with our creation and are activated by our consecration.<\/li>\n<li>The test of a gift's stewardship is its trajectory — does it draw attention and glory toward God, or terminate on the gifted?<\/li>\n<li>Love is the operating system of every gift; unplugged from love, the most impressive gift becomes noise (1 Cor 13:1).<\/li>\n<li>People already come to you for something — comfort, counsel, laughter, help. That pattern is a clue to your calling.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>What do people consistently come to you for? What might that reveal about your God-given gifts?<\/li>\n<li>Have you ever watched a genuine gift be corrupted by self-promotion? What were the warning signs?<\/li>\n<li>Why does Peter tie gift-stewardship to fervent love and hospitality \"without grumbling\"? Which of those is your growth edge?<\/li>\n<li>What gift are you currently burying — and what is the fear underneath the burial?<\/li>\n<li>How can this group deploy its combined gifts to bless the wider congregation before this phase ends?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Complete a simple gifts inventory: list three things people seek you out for, three activities that give you joy in serving, and one way you will minister that gift inside the church within two weeks. Report back.<\/p>\n", "track": true}, "p4-u10": {"title": "Unit 10: Leading Once You Are Called (PEACE)", "group": "p4", "html": "<p><strong>Movement: PEACE<\/strong> · Book chapter 10 · Anchor: Isaiah 6:8; 2 Timothy 1:7<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"Whom shall I send? And who will go for us?\" — \"Here am I. Send me!\" Drawing on the author's enlistment in the U.S. Army — the aptitude testing, the job placement, and above all the <em>All-Volunteer<\/em> principle — this unit studies the call to lead. No disciple was drafted; Jesus said \"Follow Me,\" and each willingly committed to a cause greater than himself. And the great parallel: Jesus did not recruit followers to remain followers — He trained each disciple to become a leader. Every believer has the ability to lead once they answer the call.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Isaiah 6:8 — here am I, send me<\/li>\n<li>Matthew 4:18–22 — \"Follow Me,\" and they immediately left their nets<\/li>\n<li>2 Timothy 1:7 — power, love, and a sound mind (courage for the called)<\/li>\n<li>Matthew 28:18–20 — the Great Commission: go and make disciples<\/li>\n<li>Exodus 3–4 — Moses' call and his objections<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>God's army is all-volunteer: calling is issued by God but enlistment is signed by us — reluctance is answered, but never coerced.<\/li>\n<li>Aptitude and assignment: as the military places soldiers where they best serve the mission, the Spirit distributes callings that match the gifts studied in Unit 9.<\/li>\n<li>Discipleship is leadership development — Jesus' three-year training program turned fishermen into apostles; every follower is a leader in formation.<\/li>\n<li>Objections to calling (Moses' \"who am I?\", \"they won't believe me\", \"I can't speak\") are ancient, predictable, and every one of them answered by God's presence, not our adequacy.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>What is the difference between volunteering for God and being volunteered by others? Have you experienced both?<\/li>\n<li>Which of Moses' objections is your objection? How does God's answer to him answer you?<\/li>\n<li>Where is the line between waiting on God's timing and hiding behind it?<\/li>\n<li>Jesus trained followers to become leaders. Who is training you — and who are you training?<\/li>\n<li>If God asked \"Whom shall I send?\" about a need in your congregation this month, what would \"Here am I\" cost you?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Identify one leadership assignment within your reach (teach a class, lead a prayer group, mentor one person, serve a ministry team). Take one concrete enlistment step this week and report the result.<\/p>\n", "track": true}, "p4-u11": {"title": "Unit 11: Standing the Pull While God Pulls You Through (GRACE)", "group": "p4", "html": "<p><strong>Movement: GRACE<\/strong> · Book chapter 11 · Anchor: 2 Corinthians 12:9–10; Matthew 11:28–29<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"My grace is sufficient for you, for My strength is made perfect in weakness.\" Religion can organize people around a belief — but a person can become a servant to the belief and miss the <em>message<\/em>. This unit teaches endurance in the tension: standing the pull of trials, opposition, and weariness while God pulls you through to the other side. The invitation of Christ stands at the center: \"Come to me, all you who are burdened down... Take my yoke upon you and learn from me... and you will find rest for your souls.\" His yoke is the message of love and freedom from the law — it leads, it does not crush.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Corinthians 12:9–10 — when I am weak, then I am strong<\/li>\n<li>Matthew 11:28–29 — come to me, all who labor; my yoke is easy<\/li>\n<li>Galatians 5:1 — the yoke of bondage versus the liberty of Christ<\/li>\n<li>James 1:2–4 — the testing of faith produces patience<\/li>\n<li>Hebrews 12:1–2 — run with endurance, looking unto Jesus<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>There are two pulls in every trial: the pull that would drag you under and the pull of God drawing you through — endurance is choosing which grip to trust.<\/li>\n<li>Serving the <em>belief<\/em> (religion) produces exhaustion; believing the <em>message<\/em> (Christ Himself, who thinks, loves, and wept) produces rest.<\/li>\n<li>Grace is sufficient means grace is <em>enough<\/em> — not comfortable, not explanatory, but enough for today's weight.<\/li>\n<li>The yoke of Christ is still a yoke — there is work, direction, submission — but it is fitted, shared, and it leads to rest, not bondage.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Describe a season when you were \"standing the pull.\" What kept your grip — and what nearly broke it?<\/li>\n<li>How can a person serve the belief and miss the message? Have you seen it — or lived it?<\/li>\n<li>\"My grace is sufficient\" was God's answer to a prayer for removal. How do you worship when God says no to relief and yes to grace?<\/li>\n<li>What is the practical difference between Christ's yoke and religion's yoke in a believer's weekly life?<\/li>\n<li>Who around you is barely holding on right now — and how will you help them stand the pull this week?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write a letter to a believer in a trial (real or future you), teaching them from this unit how to stand the pull. Include three of the unit's scriptures. Volunteers read theirs aloud.<\/p>\n", "track": true}, "p4-u12": {"title": "Unit 12: It's Not About a Religion — It's About a Relationship (GRACE)", "group": "p4", "html": "<p><strong>Movement: GRACE<\/strong> · Book chapter 12 · Anchor: Ephesians 2:8–9<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, lest anyone should boast.\" The closing unit sets the book's thesis against its historical backdrop: the early believers of a Roman world — where Christians were persecuted as radicals, where Judaism's laws governed a nation within an empire — and the revolution Christ brought: not a new system of rules, but reconciliation with God Himself. Religion asks \"have I done enough?\"; relationship answers \"it is finished.\" Students leave this phase able to articulate the difference — and to live it.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Ephesians 2:8–9 — by grace through faith, not of works<\/li>\n<li>John 17:3 — this is eternal life, that they may <em>know<\/em> You<\/li>\n<li>Romans 5:1–2 — justified by faith, we have peace with God<\/li>\n<li>Galatians 2:16 — not justified by the works of the law<\/li>\n<li>Revelation 3:20 — I stand at the door and knock<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>History's lesson: systems of law — Roman, Jewish, or modern religious — organize behavior; only grace transforms hearts.<\/li>\n<li>Religion is man reaching up; the gospel is God reaching down — the direction of the reach changes everything.<\/li>\n<li>Relationship has the marks religion cannot fake: conversation (prayer), listening (the Word), presence (worship), trust (faith), and love that outlasts failure.<\/li>\n<li>Grace excludes boasting and therefore excludes comparison: at the foot of the cross, the ground is level.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>In your own words: what is the difference between having a religion and having a relationship with Christ? When did you learn it?<\/li>\n<li>Why is \"not of works, lest anyone should boast\" offensive to human nature — and liberating to the humble?<\/li>\n<li>What practices in your life are relationship, and which have quietly hardened into religion? How can the hardened ones be revived?<\/li>\n<li>The early Christians were persecuted for a Person, not a philosophy. Would the evidence in your life convict you of knowing Him?<\/li>\n<li>As this phase closes: what do you believe now that you did not truly believe twelve units ago?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Prepare your three-minute \"relationship testimony\" for the Salvation Invitation gathering — how you moved from religion (or nothing) to relationship. Every student presents; the group selects several for the public evening.<\/p>\n", "track": true}, "p4-salvation": {"title": "The Salvation Invitation — Prayer & Scriptures", "group": "p4", "html": "<p>The book closes — and this phase closes — with an open door. Use this page for the Salvation Invitation gathering, for altar moments in class, and for any student ready to move from believing <em>about<\/em> Christ to believing <em>in<\/em> Him. <strong>Now is the acceptable time.<\/strong><\/p>\n<h3 id=\"the-invitation\">The Invitation<\/h3>\n<p>Salvation and deliverance are accepted of God and Christ <strong>by faith, through grace<\/strong> — allowing the burden of pride and self-will to be lifted from our hearts so we can leave every situation at the feet of Jesus and trust Him to handle whatever comes. If you are ready, pray from the heart — in the spirit of the book's Salvation Prayer — confessing that Jesus is Lord, believing that God raised Him from the dead, asking forgiveness of sin, and inviting Him to be Lord of your life from this day forward.<\/p>\n<h3 id=\"scriptures-to-understand-salvation\">Scriptures to Understand Salvation<\/h3>\n<ul>\n<li><strong>John 3:16<\/strong> — God so loved the world that He gave His only begotten Son<\/li>\n<li><strong>Romans 3:23<\/strong> — all have sinned and come short of the glory of God<\/li>\n<li><strong>Romans 6:23<\/strong> — the wages of sin is death, but the gift of God is eternal life<\/li>\n<li><strong>Romans 5:8<\/strong> — while we were yet sinners, Christ died for us<\/li>\n<li><strong>Psalm 103:12<\/strong> — as far as the east is from the west, so far has He removed our transgressions<\/li>\n<li><strong>Acts 4:12<\/strong> — neither is there salvation in any other<\/li>\n<li><strong>Mark 1:15<\/strong> — repent, and believe the gospel<\/li>\n<li><strong>John 3:17<\/strong> — God sent His Son not to condemn the world, but to save it<\/li>\n<li><strong>Revelation 3:20<\/strong> — behold, I stand at the door and knock<\/li>\n<li><strong>John 10:9<\/strong> — I am the door; by me if any man enter in, he shall be saved<\/li>\n<li><strong>Mark 16:16<\/strong> — he that believes and is baptized shall be saved<\/li>\n<li><strong>Romans 6:4<\/strong> — buried with Him by baptism, raised to walk in newness of life<\/li>\n<li><strong>Romans 5:9–10<\/strong> — justified by His blood; reconciled by His death; saved by His life<\/li>\n<li><strong>Romans 10:9–10, 13<\/strong> — confess and believe; whosoever shall call upon the name of the Lord shall be saved<\/li>\n<\/ul>\n<h3 id=\"for-the-facilitator\">For the Facilitator<\/h3>\n<ol type=\"1\">\n<li>Hold the gathering as an open evening — students bring family and friends; selected \"relationship testimonies\" from Unit 12 are shared.<\/li>\n<li>Present the scriptures above simply and in order: the love of God, the problem of sin, the gift of grace, the response of faith.<\/li>\n<li>Extend the invitation without pressure — free-will worship is the purpose we were created for, and love coerced is not love.<\/li>\n<li>Connect every new believer immediately to Phase I, Module 1 (<em>Getting to Know Jesus<\/em>) — the pathway begins again with them.<\/li>\n<\/ol>\n", "track": false}, "p5-intro": {"title": "Introduction — The Church, and How the Saga Began", "group": "p5", "html": "<p><strong>Format:<\/strong> Orientation plus 9 discernment units and a closing charge — weekly, 75 minutes. Advanced track; students should complete Phase I (especially Module 5, <em>It Shouldn't Be in the Church<\/em>) before enrolling.<\/p>\n<p><strong>Primary text:<\/strong> <em>It Shouldn't Be in the Church: The Saga Continues<\/em> by Thomas E. Walker (2020). Assign the corresponding chapter before each unit.<\/p>\n<p><em>\"Stand fast therefore in the liberty by which Christ has made us free, and do not be entangled again with the yoke of bondage.\" — Galatians 5:1<\/em><\/p>\n<p>Phase V continues what Phase I, Module 5 began. The church — <em>ekklesia<\/em>, \"the called-out ones\" — was born of Peter's confession at Caesarea Philippi: \"You are the Christ, the Son of the living God.\" Jesus answered, \"On this rock I will build My church, and the gates of Hades shall not prevail against it.\" Yet from the beginning, things crept in that should not be there — and the saga continues.<\/p>\n<p>The book traces the saga to its roots: Saul of Tarsus, the zealous Pharisee; the <em>chaberim<\/em> of 135 B.C. — the \"companions and brothers\" who believed perfecting the Law would perfect the people; the collaboration of Roman and Jewish leadership; and the traditions that Jesus' own teachings incited and exposed. Against that backdrop, the book names nine modern \"ITs\" — denominationalism, false teachings, ungodliness and paganistic character, complacency, entitlement to sin, self-pride, the spirit of witchcraft, and the twin spirits of fear that hurt the church and fail to reverence God's Spirit.<\/p>\n<p>Phase V forms the <strong>watchful shepherd<\/strong>: a student equipped to recognize each \"IT\" in scripture, in history, and — most searchingly — in their own heart and congregation, and to respond with truth spoken in love, repentance, and restoration. This is not a phase for critics; it is a phase for lovers of the church who refuse to let her be less than the Bride Christ is coming for.<\/p>\n<h3 id=\"how-to-facilitate-this-phase\">How to Facilitate This Phase<\/h3>\n<ol type=\"1\">\n<li>Open every unit at the same fixed point: Matthew 16:16–18 — the confession, and whose church this is.<\/li>\n<li>Teach the \"IT\" historically first (where it entered), biblically second (what scripture says), and personally last (where it lives now).<\/li>\n<li>Enforce the house rule: <strong>no naming of congregations or leaders<\/strong> in discussion — the saga is examined to heal the church, never to gossip about her.<\/li>\n<li>Every unit ends in prayer of repentance and intercession for the church, because discernment without intercession curdles into judgment.<\/li>\n<\/ol>\n", "track": false}, "p5-u1": {"title": "Unit 1: IT — Denominationalism", "group": "p5", "html": "<p><strong>Anchor:<\/strong> John 5:39–47; 1 Corinthians 1:10–13<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>As Roman and Jewish leadership consolidated rule, factions multiplied — and Jesus confronted men who searched the Scriptures yet refused to come to Him for life, who received glory from one another rather than seeking the glory of God. This unit examines how the same spirit built modern denominationalism: real convictions hardening into rival camps, until believers identify by tribe (\"I am of Paul; I am of Apollos\") more readily than by Christ. Students learn to distinguish healthy distinctives from divisive denominationalism — and to test every tradition against the One the Scriptures testify about.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>John 5:39–44 — searching the Scriptures yet refusing the Savior; glory from men<\/li>\n<li>1 Corinthians 1:10–13 — is Christ divided?<\/li>\n<li>1 Corinthians 3:3–9 — \"I planted, Apollos watered, but God gave the increase\"<\/li>\n<li>John 17:20–23 — that they all may be one, so the world may believe<\/li>\n<li>Ephesians 4:3–6 — one body, one Spirit, one Lord, one faith, one baptism<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Denominations began as convictions and became identities; the danger point is where loyalty to the camp outranks obedience to Christ.<\/li>\n<li>It is possible to master the Scriptures and miss the Savior (John 5:39–40) — doctrine that does not lead to Christ has become an idol of the mind.<\/li>\n<li>\"Glory from one another\" (v. 44) is the engine of party spirit — platforms, titles, and tribal approval.<\/li>\n<li>Christ's prayer for unity (John 17) makes the church's oneness an <em>evangelistic<\/em> matter: division preaches unbelief to the watching world.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>What denominational identity shaped you — and where did it help your faith, and where did it hinder it?<\/li>\n<li>How can a believer hold real doctrinal convictions without catching the spirit of \"I am of Paul\"?<\/li>\n<li>Where do churches today seek \"glory from one another\" — and what would seeking only God's glory change?<\/li>\n<li>Is all division sin? When is separation biblical (truth) and when is it carnal (tribe)?<\/li>\n<li>What is one concrete act of Christ-centered unity your congregation could extend to another fellowship this season?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Trace your own church tradition's history in one page: what conviction birthed it, what good it preserved, and where tribe may have crept past truth. Close with a prayer of thanksgiving and repentance.<\/p>\n", "track": true}, "p5-u2": {"title": "Unit 2: IT — False Teachings", "group": "p5", "html": "<p><strong>Anchor:<\/strong> The parables of Jesus; Matthew 7:15–20<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Jesus was called \"teacher\" some sixty times in the Gospels, and He taught in parables — simple stories carrying moral and spiritual weight that remain ageless: the Great Banquet (Luke 14), the Rich Man and Lazarus (Luke 16), the Lost Son (Luke 15). This unit contrasts the Teacher's method and message with the false teachings that infiltrate the church: distortions of grace, gospels of gain, and doctrines that flatter rather than free. Students learn Jesus' own detection test — \"by their fruits you will know them\" — and practice examining teaching against the whole counsel of God.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Luke 14:15–24; 15:11–32; 16:19–31 — the Banquet, the Lost Son, the Rich Man and Lazarus<\/li>\n<li>Matthew 7:15–20 — false prophets known by their fruits<\/li>\n<li>2 Peter 2:1–3 — destructive heresies, secretly brought in<\/li>\n<li>2 Timothy 4:3–4 — itching ears and teachers heaped up to suit desires<\/li>\n<li>Acts 17:11 — the Bereans searched the Scriptures daily to verify Paul<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Jesus' parables always aimed at repentance, hope, and the heart of God; teaching that consistently aims elsewhere — at wallets, at flattery, at fear — fails the pattern of the Master Teacher.<\/li>\n<li>False teaching rarely announces itself; Peter says it is \"secretly brought in,\" wrapped in familiar vocabulary.<\/li>\n<li>The consumer dynamic of 2 Timothy 4:3 is a two-way corruption: itching ears <em>recruit<\/em> the teachers who scratch them.<\/li>\n<li>The Berean posture — eager reception plus daily verification — is the church's immune system; discernment is every member's job, not only the pulpit's.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Which parable of Jesus has corrected your theology most deeply, and how?<\/li>\n<li>What false teachings have you personally encountered? What made them attractive — and what exposed them?<\/li>\n<li>How do we correct error in the church without becoming self-appointed heresy hunters?<\/li>\n<li>\"By their fruits\" — what fruits should we examine in a teacher: results, character, doctrine, or all three? How?<\/li>\n<li>Are we training our congregations to be Bereans, or to be audiences? What would change that?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Choose one popular teaching circulating today. Test it Berean-style against at least five scriptures in context, and write a one-page verdict: sound, distorted, or false — with your evidence.<\/p>\n", "track": true}, "p5-u3": {"title": "Unit 3: IT — Ungodliness and Paganistic Character", "group": "p5", "html": "<p><strong>Anchor:<\/strong> Deuteronomy 7:2–4; 2 Corinthians 6:14–15<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"Do not be unequally yoked together with unbelievers. For what fellowship has righteousness with lawlessness? And what communion has light with darkness?\" From Israel's commanded separation from the nations to the New Testament's call to holiness, this unit traces the long saga of ungodliness — one repetitious human characteristic: sin — and the paganistic character that seeps into God's people when the boundary between worship of God and the ways of the world dissolves. The lesson is not isolation but consecration: in the world, never of it.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Deuteronomy 7:2–4 — no covenant with the nations, lest they turn your children to other gods<\/li>\n<li>2 Corinthians 6:14–18 — unequally yoked; come out and be separate<\/li>\n<li>Romans 12:2 — do not be conformed to this world<\/li>\n<li>1 John 2:15–17 — love not the world, neither the things in the world<\/li>\n<li>1 Peter 1:14–16 — be holy, for I am holy<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>God's severity toward Canaanite alliance was protective, not arbitrary: covenant with darkness always converts the children first (Deut 7:4).<\/li>\n<li>Paganistic character enters the church not by invasion but by absorption — practices, values, and appetites adopted without examination.<\/li>\n<li>\"Unequally yoked\" is broader than marriage: partnerships, dependencies, and alliances that harness the church to the world's plow.<\/li>\n<li>Separation in scripture is always <em>unto<\/em> God before it is <em>from<\/em> the world; holiness without love becomes the Pharisaism this book's saga began with.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Where has the church absorbed the world's character while keeping Christian vocabulary? Name patterns, not congregations.<\/li>\n<li>What is the difference between engaging culture for the gospel and being yoked to it?<\/li>\n<li>Deuteronomy warns that compromise converts the children. Where do you see that generational mechanism today?<\/li>\n<li>Which \"acceptable\" ungodliness is hardest to confront in church life — and why is it tolerated?<\/li>\n<li>What does \"come out from among them and be separate\" look like for a believer with a secular job, school, and neighborhood?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Conduct a personal consecration audit: media, money, alliances, and habits. Identify one yoke to break or boundary to redraw this week, and tell one accountability partner in the group.<\/p>\n", "track": true}, "p5-u4": {"title": "Unit 4: IT — Complacency versus Contentment", "group": "p5", "html": "<p><strong>Anchor:<\/strong> Revelation 3:14–22; Philippians 4:11–13<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Complacency and contentment look alike and lead opposite directions. Many believers assume that receiving Christ, attending faithfully, paying tithes, and joining an auxiliary fulfills their obligation — but complacency is discouraged throughout scripture. This unit teaches the balance the book calls for: a walk with the Lord that prays and rests in faith <em>without<\/em> using faith as an excuse to sit still. Contentment is satisfaction in God amid any circumstance; complacency is satisfaction with self despite God's call to grow, serve, and go.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Revelation 3:14–22 — Laodicea: lukewarm, and unaware of its poverty<\/li>\n<li>Philippians 4:11–13 — I have learned, in whatsoever state I am, to be content<\/li>\n<li>Zephaniah 1:12 — judgment on those settled in complacency, saying \"the Lord will do nothing\"<\/li>\n<li>Matthew 25:14–30 — the servant who buried his talent<\/li>\n<li>2 Peter 1:5–8 — add to your faith, that you be neither barren nor unfruitful<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Contentment is learned in Christ (Phil 4:11); complacency is drifted into without Him — one is a discipline, the other a decay.<\/li>\n<li>Laodicea's tragedy was self-assessment: \"rich, and in need of nothing,\" while Christ stood outside knocking.<\/li>\n<li>Church activity can be complacency's best disguise: attendance, offerings, and auxiliary membership can substitute for obedience, witness, and growth.<\/li>\n<li>The buried talent teaches that safe unfaithfulness is still unfaithfulness — the Master audits growth, not just preservation.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>In your own words, distinguish contentment from complacency. Where does each live in your current walk?<\/li>\n<li>Why is \"faithful church attendance\" so easily mistaken for a completed Christian life? Who taught us that?<\/li>\n<li>Read Laodicea's letter aloud. Which of Christ's counsels there (gold, garments, eye salve) does today's church most need?<\/li>\n<li>Where has \"praying about it\" become an excuse for doing nothing about it — in you or around you?<\/li>\n<li>What is one buried talent in this group, and how will we unearth it before Phase V ends?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write two columns for your life — \"Content in Christ\" and \"Complacent in routine\" — with honest entries in each. Choose one complacency and replace it with a concrete act of growth or service within ten days.<\/p>\n", "track": true}, "p5-u5": {"title": "Unit 5: IT — Feelings of Entitlement to Sin", "group": "p5", "html": "<p><strong>Anchor:<\/strong> Joshua 17:14–18; Romans 6:1–2<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Entitlement is \"the feeling that you have the right to have what you want without having to work for it or deserve it — just because of who you are.\" The book shows the pattern in Israel itself: the children of Joseph — Manasseh and Ephraim — demanding more land on the strength of their parentage. Scripture exposes how even chosen people came to believe their bloodline or position with God entitled them to blessing — and, more dangerously, how believers come to feel entitled to <em>sin<\/em>: presuming on grace, position, or past service. The unit answers with Paul: \"Shall we continue in sin that grace may abound? Certainly not!\"<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Joshua 17:14–18 — the children of Joseph demand a greater portion<\/li>\n<li>Romans 6:1–2, 15 — shall we continue in sin that grace may abound?<\/li>\n<li>Luke 3:8 — do not say \"we have Abraham as our father\"<\/li>\n<li>1 Corinthians 10:1–12 — Israel's privileges did not exempt Israel's sins; let him who stands take heed<\/li>\n<li>Galatians 6:7 — God is not mocked; whatever a man sows, he reaps<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Entitlement inverts grace: grace says \"I deserved nothing and received everything\"; entitlement says \"I deserve everything and owe nothing.\"<\/li>\n<li>Pedigree is not permission — neither Joseph's sons' lineage nor \"Abraham as our father\" nor years of church service exempts anyone from obedience.<\/li>\n<li>\"Entitlement to sin\" is grace weaponized against holiness: the quiet belief that my position, my gifting, or God's love guarantees impunity.<\/li>\n<li>1 Corinthians 10 is the standing cure: the privileged generation fell in the wilderness — \"let him who thinks he stands take heed lest he fall.\"<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Where have you seen spiritual pedigree — family, title, tenure — used to claim exemption from accountability?<\/li>\n<li>How does \"God knows my heart\" function as an entitlement phrase? What does God's Word actually say about the heart?<\/li>\n<li>Why are the gifted and the senior often the most vulnerable to entitlement? How should churches guard them — and be guarded?<\/li>\n<li>What is the difference between resting in assurance of salvation and presuming entitlement to sin?<\/li>\n<li>Joshua told Joseph's sons to clear their own forest (17:15–18). What \"forest-clearing\" is God assigning you instead of the extra portion you wanted?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Search your own vocabulary for entitlement phrases (\"I've earned...\", \"after all I've done...\", \"God understands my...\"). Journal where each came from, and write its Romans 6 replacement.<\/p>\n", "track": true}, "p5-u6": {"title": "Unit 6: IT — Self-Pride with Intentions to Do Harm", "group": "p5", "html": "<p><strong>Anchor:<\/strong> 1 Corinthians 15:8–12; Proverbs 16:18<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Pride takes many forms once a heart becomes receptive to it — and its most dangerous form intends harm. The book holds up Paul as pride's great reversal: the persecutor who once harmed the church out of zealous self-righteousness, later confessing, \"I am the least of the apostles... but by the grace of God I am what I am.\" When pride rules a heart, entitlement follows and harm is rationalized as righteousness — the very engine that drove Saul of Tarsus. This unit trains students to detect pride's manifestations in scripture, in church conflict, and in the mirror — and to answer them with grace-formed humility.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>1 Corinthians 15:8–10 — \"by the grace of God I am what I am\"<\/li>\n<li>Proverbs 16:18 — pride goes before destruction<\/li>\n<li>Acts 8:1–3; 9:1–6 — Saul ravaging the church; Saul meeting Christ<\/li>\n<li>James 4:6 — God resists the proud but gives grace to the humble<\/li>\n<li>Philippians 2:3–8 — let nothing be done through selfish ambition; the mind of Christ<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>The most destructive pride is <em>religious<\/em> pride — harm done with a clear conscience, in God's name, as Saul did.<\/li>\n<li>Pride manifests visibly: entitlement, contention, retaliation, the need to win — the heart's rulership shows in the life's fruit.<\/li>\n<li>Grace is pride's only cure because grace removes the ground pride stands on: \"by the grace of God I am what I am.\"<\/li>\n<li>Humility is not thinking little of yourself but thinking rightly of yourself before God — Paul kept both his apostleship and his history.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Saul harmed the church convinced he served God. How do sincere people become dangerous — and how would we recognize it in ourselves?<\/li>\n<li>Where does pride hide inside spiritual excellence: strong doctrine, strong gifting, strong standards?<\/li>\n<li>Paul never erased his past (\"I persecuted the church\") yet never wallowed in it. What does grace-formed memory look like?<\/li>\n<li>How should a congregation respond to a leader whose pride is harming people — biblically, orderly, and redemptively?<\/li>\n<li>Which manifestation of pride is your besetting one — and who has permission to tell you when it appears?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Write your own \"by the grace of God I am what I am\" paragraph: what you were, what grace did, and what boasting is now excluded. Share in pairs and pray James 4:6 over each other.<\/p>\n", "track": true}, "p5-u7": {"title": "Unit 7: IT — The Spirit of Witchcraft", "group": "p5", "html": "<p><strong>Anchor:<\/strong> Daniel 2:26–29; 1 Samuel 15:23<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>Witchcraft is not what television and folklore portray. The book observes, provocatively, that many who practice witchcraft follow a code of ethics more consistently than many Christians — and then exposes the real issue: the <em>spirit<\/em> of witchcraft is the pursuit of knowledge, power, and control from any source other than God. Daniel before Nebuchadnezzar draws the line forever: the astrologers, magicians, and soothsayers could not reveal the secret — \"but there is a God in heaven who reveals secrets.\" In the church, this spirit appears as manipulation, control, divination-curiosity, and rebellion — which Samuel equates with the sin of witchcraft.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Daniel 2:26–29 — there is a God in heaven who reveals secrets<\/li>\n<li>1 Samuel 15:23 — rebellion is as the sin of witchcraft<\/li>\n<li>Deuteronomy 18:9–14 — the forbidden arts; you shall be blameless before the Lord<\/li>\n<li>Acts 16:16–18; 19:18–20 — the spirit of divination; the burning of the books at Ephesus<\/li>\n<li>Galatians 5:19–21 — sorcery listed among the works of the flesh<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>The essence of witchcraft is unauthorized access: seeking revelation, power, or outcomes apart from the God of heaven.<\/li>\n<li>Samuel's equation is the unit's sharpest edge: <em>rebellion<\/em> — self-will against God's revealed word — is the same spirit in church clothes.<\/li>\n<li>Control and manipulation of people (\"prophetic\" pressure, spiritual intimidation, guilt-leverage) are witchcraft's ecclesiastical dialect.<\/li>\n<li>Ephesus models the clean break: confession, renunciation, and the public bonfire — deliverance is decisive, not gradual accommodation.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Why is the church often naive about the occult in culture — horoscopes, mediums, manifestation teaching — while alarmed by its costume versions?<\/li>\n<li>\"Rebellion is as the sin of witchcraft.\" How does that verse reframe stubbornness, church splits, and defiance of godly authority?<\/li>\n<li>Where does manipulation masquerade as ministry? How do we tell spiritual authority from spiritual control?<\/li>\n<li>What \"Ephesus bonfire\" — practices, objects, media, dependencies — might God be calling you or your house to?<\/li>\n<li>How should the church minister to someone coming out of occult involvement — with what truth, and what tenderness?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Inventory your sources of guidance for major decisions this past year. Anything consulted in God's place — renounce it in prayer, remove it, and replace it with a scripture-and-prayer decision practice.<\/p>\n", "track": true}, "p5-u8": {"title": "Unit 8: IT — The Spirit of Fear: Hurting the Church", "group": "p5", "html": "<p><strong>Anchor:<\/strong> 2 Timothy 1:7; Proverbs 9:10<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>\"God has not given us a spirit of fear, but of power and of love and of a sound mind.\" Yet a spirit of fear operates inside congregations — and it wounds them. This unit distinguishes the <em>fear of the Lord<\/em> — the beginning of wisdom, grounded in knowing the Creator as holy, jealous for His people, and yet Father — from the <em>spirit of fear<\/em> that silences witness, hoards control, resists change, and drives believers to protect institutions instead of obeying God. As the book argues from Genesis onward, God's \"jealous, vengeful, and angry\" descriptions are the protective passions of a Father — not grounds for the paralyzing dread that harms His house.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>2 Timothy 1:7 — not a spirit of fear, but power, love, and a sound mind<\/li>\n<li>Proverbs 9:10 — the fear of the Lord is the beginning of wisdom<\/li>\n<li>Genesis 1–3 — the Father-Creator and the first fear: \"I was afraid... and I hid\"<\/li>\n<li>1 John 4:18 — perfect love casts out fear<\/li>\n<li>Matthew 25:24–25 — \"I was afraid, and went and hid your talent\"<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Two fears, opposite fruits: the fear of the Lord produces wisdom, worship, and courage; the spirit of fear produces hiding, hoarding, and harm.<\/li>\n<li>God's jealousy and anger are parental passions — the same fierceness a father has for endangered children — and misreading them breeds either terror or contempt.<\/li>\n<li>Fear hurts the church corporately: fear of man mutes the pulpit, fear of loss resists God's new thing, fear of exposure conceals sin until it devastates.<\/li>\n<li>Adam's instinct — \"I was afraid, and I hid\" — remains the church's instinct; grace re-teaches us to run <em>toward<\/em> the voice of God.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Untangle them in your own words: the fear of the Lord versus the spirit of fear. Where did you learn each?<\/li>\n<li>How has fear of people — members, donors, critics — shaped decisions in churches you've known? What did it cost?<\/li>\n<li>Does presenting God as Father soften His holiness or explain it? Use the parental analogy carefully from scripture.<\/li>\n<li>Where does fear currently mute <em>your<\/em> witness, generosity, or obedience?<\/li>\n<li>\"Perfect love casts out fear\" — how, practically, does a congregation grow in love until fear loses its grip?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Name the one obedience you have postponed out of fear. Write 2 Timothy 1:7 beside it, take the first step within seven days, and report to your accountability partner.<\/p>\n", "track": true}, "p5-u9": {"title": "Unit 9: IT — The Spirit of Fear: Not Reverencing God's Spirit", "group": "p5", "html": "<p><strong>Anchor:<\/strong> 1 Peter 1:13–18; Acts 1:8<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>The gospel went from Jerusalem to \"the uttermost parts of the earth,\" exactly as Jesus said before His ascension — and the message of redemption never encouraged elitism or classism. Yet doctrines have been built that personify Christianity as a faith for a certain type of person, a specific ethnicity, a favored class. This final \"IT\" unit confronts the failure to reverence God's Spirit: quenching His work, despising His gifts, and — gravest of all — restricting whom He may save and use. God was specific in accepting the Gentiles into the redemptive path; Christianity is not built on classism, and a church that reverences the Spirit welcomes everyone the Spirit calls.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>1 Peter 1:13–18 — be holy in all conduct; redeemed not with corruptible things<\/li>\n<li>Acts 1:8 — witnesses to the uttermost part of the earth<\/li>\n<li>Acts 10:34–35, 44–48 — God shows no partiality; the Spirit falls on the Gentiles<\/li>\n<li>1 Thessalonians 5:19–21 — do not quench the Spirit; do not despise prophecies; test all things<\/li>\n<li>Galatians 3:26–29 — neither Jew nor Greek; all one in Christ Jesus<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>Reverencing the Spirit means receiving whom the Spirit receives: Peter's Caesarea lesson — \"God shows no partiality\" — ended the church's first classism crisis and must end every one since.<\/li>\n<li>Elitism and ethnic gatekeeping are not merely social sins; they are irreverence toward the Spirit who fell on \"unqualified\" Gentiles while Peter was still preaching.<\/li>\n<li>Quenching the Spirit takes quiet forms: unbelief toward His gifts, control of His moving, contempt for vessels He chooses.<\/li>\n<li>The balance of 1 Thessalonians 5 protects both directions: do not quench, <em>and<\/em> test all things — reverence is neither gullibility nor suppression.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Where has the church built walls the Spirit never built — class, ethnicity, income, education, past? Which wall have you benefited from?<\/li>\n<li>What did it cost Peter to enter Cornelius's house? What would the equivalent crossing cost your congregation?<\/li>\n<li>How does a church quench the Spirit while singing about Him? Name the quiet mechanisms.<\/li>\n<li>How do we hold \"do not quench\" and \"test all things\" together without losing either?<\/li>\n<li>Who is the Spirit sending to your church that the church is not ready to receive — and what must change first?<\/li>\n<\/ol>\n<h3 id=\"reflection--application\">Reflection &amp; Application<\/h3>\n<p>Study Acts 10 in full. Write one page: the partiality God dismantled in Peter, and the partiality He is dismantling in you. Conclude with a prayer of consecration to reverence the Spirit's choices.<\/p>\n", "track": true}, "p5-final": {"title": "Final Thoughts: The Church Within", "group": "p5", "html": "<p><strong>Anchor:<\/strong> Matthew 16:16–18; 1 Corinthians 6:19–20<\/p>\n<h3 id=\"unit-summary\">Unit Summary<\/h3>\n<p>The church should be a state of being — an everyday sacrifice of praise and worship that draws people from hopelessness to hope and joy. Every church should hold within its walls the secrets of eternal life and peace. But the book's closing question presses further: what if the structure isn't the whole answer? The Bible promises that if we seek God, we will find Him. The church is a community of believers united in worship, fellowship, praise, and personal commitment to Christ — never a place of spiritual bondage, enslavement, or endless taking. And the church is <em>within us<\/em>: body, soul, and spirit connected in the liberty of faith, free to love God because of the enormous sacrifice of His Son.<\/p>\n<h3 id=\"key-scriptures\">Key Scriptures<\/h3>\n<ul>\n<li>Matthew 16:16–18 — the confession on which the church is built<\/li>\n<li>1 Corinthians 6:19–20 — your body is the temple of the Holy Spirit<\/li>\n<li>Jeremiah 29:13 — you will seek Me and find Me, when you search with all your heart<\/li>\n<li>Hebrews 10:24–25 — consider one another; do not forsake the assembling<\/li>\n<li>Galatians 5:1 — stand fast in liberty (the verse where the saga's answer began)<\/li>\n<\/ul>\n<h3 id=\"teaching-points\">Teaching Points<\/h3>\n<ul>\n<li>The nine \"ITs\" share one address: the human heart — which is why the reformation of the church begins with the temple <em>within<\/em>.<\/li>\n<li>Structure serves the state of being, never replaces it: buildings, services, and systems are scaffolding around living stones.<\/li>\n<li>Liberty is the saga's resolution: a church free from bondage, entitlement, pride, fear, and control is a church the gates of Hades cannot prevail against.<\/li>\n<li>The watchful shepherd's final posture is love: we confront what shouldn't be in the church because we cherish what the church is — the Bride of Christ.<\/li>\n<\/ul>\n<h3 id=\"discussion-threads\">Discussion Threads<\/h3>\n<ol type=\"1\">\n<li>Review all nine \"ITs.\" Which one most threatens the church in this generation — and which most threatened <em>you<\/em> before this phase?<\/li>\n<li>\"The church is within us\" — how do we honor that truth without abandoning the assembly (Heb 10:25)? Hold both.<\/li>\n<li>What has this phase changed about how you will speak about the church — her flaws and her glory?<\/li>\n<li>What does a congregation look like when liberty (Gal 5:1) is its atmosphere? Describe it concretely.<\/li>\n<li>As watchful shepherds: what will each of us now watch for, pray against, and build up in God's house?<\/li>\n<\/ol>\n<h3 id=\"final-assignment--the-shepherds-charge\">Final Assignment — The Shepherd's Charge<\/h3>\n<p>Write your personal Shepherd's Charge (one page): the \"IT\" you take responsibility to watch against, the scriptures you will stand on, the manner (truth in love, order, restoration) in which you will act, and the prayer you will keep praying for the church. Charges are read aloud at the phase's closing service — and the pathway that began with <em>Getting to Know Jesus<\/em> ends where the church began: \"You are the Christ, the Son of the living God.\"<\/p>\n", "track": true}, "res-db": {"title": "Resource Database", "group": "res", "html": "\n<p class=\"lede\">Search every journal, article, book, podcast, organization, and key scripture across all five phases. Select the resources you need, then generate a Word-document report — or jump straight to online and video results.<\/p>\n<div id=\"rdb\">\n  <div class=\"rdb-bar\">\n    <input id=\"rdb-q\" type=\"search\" placeholder=\"Search the resource database… (e.g. trauma, Galatians, attachment, grace)\" aria-label=\"Search resources\">\n    <button class=\"rdb-btn gold\" id=\"rdb-word\">⬇ Word Report (<span id=\"rdb-count\">0<\/span>)<\/button>\n    <button class=\"rdb-btn\" id=\"rdb-video\">▶ Video Results<\/button>\n  <\/div>\n  <div class=\"rdb-filters\" id=\"rdb-types\"><\/div>\n  <div class=\"rdb-filters\" id=\"rdb-phases\"><\/div>\n  <div id=\"rdb-meta\"><\/div>\n  <div id=\"rdb-results\"><\/div>\n<\/div>\n", "track": false}, "res-a1": {"title": "A.1 — The Vacuum Effect: Recommended Reading & Resources", "group": "res", "html": "<h3 id=\"how-to-use-this-resource-list\">How to Use This Resource List<\/h3>\n<p>This reading list supports instructors and students engaged in the 12-unit Teaching Curriculum based on The Vacuum Effect by Thomas E. Walker. Resources are organized into four sections:<\/p>\n<ul>\n<li><p>Section 1: Peer-Reviewed Journals — Ongoing scholarly sources for pastoral counseling and Biblical integrated psychology<\/p><\/li>\n<li><p>Section 2: Free Online Articles &amp; Dissertations — Open-access reading assignable at no cost<\/p><\/li>\n<li><p>Section 3: Recommended Books — Key texts cited in or closely aligned with the curriculum<\/p><\/li>\n<li><p>Section 4: Professional Organizations — Websites, podcasts, and free member resources<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<tbody>\n<tr class=\"odd\">\n<td><p><strong>Library Access Tip<\/strong><\/p>\n<p>Students and faculty affiliated with Liberty University (where Pastor Walker completed his graduate studies) have access to the ATLA Religion Database, PsycINFO, and EBSCO through Liberty's online library. The ATLA Religion Database includes full-text articles from the Journal of Pastoral Care and Counseling from 1947 onward and covers multiple journals in past
