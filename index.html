ian canon)", "Book of Giants 4Q203/4Q531 (DSS)", "Jude 6; 2 Peter 2:4 (Biblical)"]}, {"t": "The Son of Man: Daniel, Enoch, and the Gospels", "s": "Daniel 7's cloud-riding figure who receives everlasting dominion is developed in 1 Enoch's Similitudes into a pre-existent, enthroned judge 'named before the sun and stars.' When Jesus answers the high priest with Daniel 7's exact imagery (Mark 14:62), he steps into a title whose royal, heavenly weight two corpora had already established — which is precisely why the court called it blasphemy.", "w": ["Daniel 7:13–14 (Biblical)", "1 Enoch 46–48; 62 (Ethiopian canon)", "Mark 14:61–64 (Biblical)"]}, {"t": "Melchizedek from Salem to Qumran to Hebrews", "s": "Three verses in Genesis, one in Psalm 110 — yet Qumran's 11Q13 makes Melchizedek a heavenly deliverer proclaiming Isaiah 61's Jubilee and executing judgment, and Hebrews 7 builds Christ's eternal priesthood on his order. The scroll proves the epistle's argument engaged a live Jewish expectation, not an invented curiosity.", "w": ["Genesis 14:18–20; Psalm 110:4 (Biblical)", "11Q13 Melchizedek (DSS)", "Hebrews 5–7 (Biblical)"]}, {"t": "Law Codes: Moses and Hammurabi", "s": "Hammurabi's stele (c. 1754 BCE) predates Sinai and shares casuistic form ('if a man...') and subjects — oxen, injury, restitution. The covenant code's distinctives: law bound to redemption ('I brought you out of Egypt'), equal personhood over class-graded penalties, and holiness extending to the heart. Comparison illuminates both the shared legal culture and Sinai's revolution.", "w": ["Exodus 20–23; Deuteronomy (Biblical)", "Code of Hammurabi (Akkadian tradition)"]}, {"t": "Two Spirits, Light and Darkness", "s": "Qumran's Community Rule teaches that God set two spirits — truth and perversity, light and darkness — over humanity until the end. The Johannine writings breathe similar air (light/darkness, children of God/children of the devil), while parting decisively at free grace for those in darkness. A masterclass in reading the New Testament inside its Jewish world.", "w": ["Community Rule 1QS III–IV (DSS)", "John 1; 3; 1 John 1–3 (Biblical)"]}, {"t": "Rewritten Eden: the Gnostic Inversion", "s": "Nag Hammadi's Apocryphon of John and Hypostasis of the Archons retell Genesis with the creator as ignorant Yaldabaoth and the serpent as enlightener. Set beside the canonical text, the inversion displays exactly what Phase V's false-teachings unit trains students to detect: familiar vocabulary carrying a reversed theology.", "w": ["Genesis 1–3 (Biblical)", "Apocryphon of John; Hypostasis of the Archons (Nag Hammadi)", "1 Timothy 6:20 (Biblical caution)"]}, {"t": "External Witnesses to the New Testament Era", "s": "Josephus documents John the Baptist's ministry and execution, James' death by stoning, Pilate's governorship, and — in the disputed but core-authentic Testimonium — Jesus' execution under Pilate. Together with the Pilate Stone inscription, the historian supplies the classic external corroboration set for the Gospels' stage and cast.", "w": ["Antiquities 18; 20; The Jewish War (Josephus)", "Gospels & Acts (Biblical)", "Pilate Stone (archaeology)"]}, {"t": "The Harrowing of Hell", "s": "The Gospel of Nicodemus dramatizes Christ's descent — gates of brass broken, Adam and the patriarchs led out — elaborating hints in 1 Peter 3:19 and Ephesians 4:8–9 into the medieval imagination's most vivid scene. A study in how apocrypha amplify canonical seeds, and how to weigh tradition against scripture.", "w": ["1 Peter 3:18–20; Ephesians 4:8–10 (Biblical)", "Gospel of Nicodemus (NT Apocrypha)"]}]}</script>
<script>
const LOGO = document.getElementById('logo-src').textContent.trim();
const DATA = JSON.parse(document.getElementById('data').textContent);
const CONTENT = DATA.content, NAV = DATA.nav, ORDER = DATA.order;
const GROUP_OF = {}; ORDER.forEach(id => { if (CONTENT[id]) GROUP_OF[id] = CONTENT[id].group; });
const PHASE_META = {
  p1:{name:'Phase I', pc:'#1F3864', title:'Biblical Foundations & Discipleship', desc:'Bible Study Training Curriculum — 5 modules, ~23 sessions. Builds the disciple.', first:'p1-overview'},
  p2:{name:'Phase II', pc:'#4A6FA5', title:'Applied Ministry & Healing', desc:'The Vacuum Effect — 12 units through Pastoral Counseling and Biblical Integrated Psychology. Builds the minister of healing.', first:'p2-intro'},
  p3:{name:'Phase III', pc:'#8B6914', title:'Professional Formation', desc:'Integrated Christian Counseling Training — 6 modules, 36 lessons, 18 weeks. Builds the counselor.', first:'p3-overview'},
  p4:{name:'Phase IV', pc:'#A0455E', title:'Now Is the Time to Believe', desc:'Inspirational faith formation — 12 units through HOPE, FAITH, PEACE & GRACE, closing with the Salvation Invitation. Builds the believing witness.', first:'p4-intro'},
  p5:{name:'Phase V', pc:'#7A4E8E', title:'The Saga Continues', desc:'It Shouldn’t Be in the Church — nine "IT" discernment units and the closing charge. Builds the watchful shepherd.', first:'p5-intro'},
  p6:{name:'Phase VI', pc:'#2F6B5E', title:'Generation X & the Church', desc:'Generation X Left the Church, Now All Hell Broke Loose — 6 lessons on generational religious decline and restoring the church-hurt. Builds the generational restorer.', first:'p6-intro'}
};

/* ---- safe progress store (works locally; falls back to memory) ---- */
const mem = {};
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('rogom-progress')||'{}'); } catch(e){ return mem; } },
  set(v){ try { localStorage.setItem('rogom-progress', JSON.stringify(v)); } catch(e){ Object.assign(mem, v); } }
};
let progress = store.get();

function phasePct(gid){
  const items = NAV.find(g=>g.id===gid).items.filter(i=>i.track);
  if(!items.length) return 0;
  const done = items.filter(i=>progress[i.id]).length;
  return Math.round(100*done/items.length);
}

/* ---- sidebar ---- */
function buildNav(){
  const el = document.getElementById('navscroll'); el.innerHTML='';
  NAV.forEach(g=>{
    const det=document.createElement('details'); det.className='navgroup'; det.open=true; det.id='grp-'+g.id;
    const sum=document.createElement('summary');
    sum.innerHTML='<span class="gname">'+g.name+'</span>'+(g.items.some(i=>i.track)?'<span class="gpct" id="pct-'+g.id+'"></span>':'');
    det.appendChild(sum);
    if(g.items.some(i=>i.track)){
      const bar=document.createElement('div'); bar.className='gbar'; bar.innerHTML='<i id="bar-'+g.id+'"></i>'; det.appendChild(bar);
    }
    const rail=document.createElement('div'); rail.className='rail';
    g.items.forEach(it=>{
      const a=document.createElement('a'); a.className='navitem'; a.id='nav-'+it.id; a.dataset.label=it.nav.toLowerCase();
      if(it.ext){ a.href=it.ext; a.target='_blank'; a.rel='noopener';
        a.innerHTML='<span class="node"></span><span>'+it.nav+' ↗</span>'; }
      else { a.href='#/'+it.id;
        a.innerHTML='<span class="node"></span><span>'+it.nav+'</span><span class="lockicon">🔒</span><span class="check">✓</span>'; }
      rail.appendChild(a);
    });
    det.appendChild(rail); el.appendChild(det);
  });
  refreshNavState();
}
function refreshNavState(){
  Object.keys(CONTENT).forEach(id=>{
    const n=document.getElementById('nav-'+id); if(!n) return;
    n.classList.toggle('done', !!progress[id]);
  });
  ['p1','p2','p3','p4','p5','p6'].forEach(gid=>{
    const pct=phasePct(gid);
    const p=document.getElementById('pct-'+gid); if(p) p.textContent=pct+'%';
    const b=document.getElementById('bar-'+gid); if(b) b.style.width=pct+'%';
    const hb=document.getElementById('hbar-'+gid); if(hb) hb.style.width=pct+'%';
    const hp=document.getElementById('hpct-'+gid); if(hp) hp.textContent=pct+'% complete';
  });
}

/* ---- routing ---- */
let current='home';
function go(id){ location.hash='#/'+id; }
function route(){
  const id=(location.hash||'#/home').slice(2)||'home';
  render(CONTENT[id]||id==='home'?id:'home');
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function render(id){
  current=id;
  const page=document.getElementById('page');
  const mark=document.getElementById('markbtn');
  document.querySelectorAll('.navitem.active').forEach(n=>n.classList.remove('active'));
  document.getElementById('sidebar').classList.remove('open');
  if(id==='home'){ page.innerHTML=homeHTML(); document.getElementById('crumb').textContent='Home'; mark.style.display='none'; refreshNavState(); window.scrollTo(0,0); return; }
  const c=CONTENT[id]; if(!c){ go('home'); return; }
  const nav=document.getElementById('nav-'+id); if(nav){nav.classList.add('active');
    const grp=nav.closest('details'); if(grp) grp.open=true;}
  const meta=PHASE_META[c.group];
  const eyebrow=meta?(meta.name+' · '+meta.title):(c.group==='res'?'Resource Library':'Master Training Curriculum');
  const locked=isLocked(id);
  page.innerHTML=(locked?lockScreenHTML(c):'<article class="content"><div class="titlebar"><div class="eyebrow">'+esc(eyebrow)+'</div><h1 class="pagetitle">'+esc(c.title)+'</h1></div>'+c.html+'</article>')+pagerHTML(id);
  document.getElementById('crumb').textContent=eyebrow;
  if(c.track&&!locked){ mark.style.display='inline-block'; setMarkBtn(); } else { mark.style.display='none'; }
  window.scrollTo(0,0);
  document.getElementById('page').querySelectorAll('img.logo-slot').forEach(i=>i.src=LOGO);
  if(id==='res-db') initResourceDB();
  if(id==='enroll') initEnroll();
  if(id==='aw-lib') initAWDB();
  if(!['enroll','res-db','aw-lib'].includes(id) && !locked) loadDiscussion(id, c.title);
  document.getElementById('page').querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
}
function pagerHTML(id){
  const i=ORDER.indexOf(id);
  const prev=ORDER[i-1], next=ORDER[i+1];
  const t=x=>x==='home'?'Home':(CONTENT[x]?CONTENT[x].title:'');
  return '<div id="pagenav">'+
    '<button class="pn" '+(prev?'onclick="go(\''+prev+'\')"':'disabled')+'><small>← Previous</small><span>'+esc(prev?t(prev):'')+'</span></button>'+
    '<button class="pn next" '+(next?'onclick="go(\''+next+'\')"':'disabled')+'><small>Next →</small><span>'+esc(next?t(next):'')+'</span></button></div>';
}
function setMarkBtn(){
  const b=document.getElementById('markbtn');
  const done=!!progress[current];
  b.textContent=done?'✓ Completed — tap to undo':'Mark complete';
  b.classList.toggle('done',done);
}
function toggleDone(){
  progress[current]=!progress[current]; if(!progress[current]) delete progress[current];
  store.set(progress); setMarkBtn(); refreshNavState();
}

/* ---- home ---- */
function homeHTML(){
  const cards=['p1','p2','p3','p4','p5','p6'].map(gid=>{
    const m=PHASE_META[gid];
    return '<div class="pcard" style="--pc:'+m.pc+'" role="button" tabindex="0" onclick="go(\''+m.first+'\')" onkeydown="if(event.key===\'Enter\')go(\''+m.first+'\')">'+
      '<span class="tag">'+m.name+'</span><h3>'+m.title+'</h3><p>'+m.desc+'</p>'+
      '<div class="meter"><i id="hbar-'+gid+'"></i></div><span class="pct" id="hpct-'+gid+'"></span></div>';
  }).join('');
  const dove='<svg class="dove DCLS" viewBox="0 0 64 44" aria-hidden="true"><path class="wing" d="M30 22 C24 8 12 2 2 4 C10 10 14 16 16 22 C10 21 5 22 1 25 C9 27 17 27 24 26 Z"/><path d="M24 26 C30 20 40 17 50 19 C56 20 61 24 63 29 C57 27 52 27 48 28 C50 31 50 34 48 38 C45 33 41 30 36 29 C31 28 27 27 24 26 Z"/><path class="wing" d="M36 29 C38 34 37 39 33 43 C32 38 30 33 27 30 Z"/></svg>';
  return '<div id="home"><div class="hero">'+
    '<div class="rays"></div><div class="glow"></div>'+
    dove.replace('DCLS','d1')+dove.replace('DCLS','d2')+dove.replace('DCLS','d3')+dove.replace('DCLS','d4')+
    '<div class="cloud cl1"></div><div class="cloud cl2"></div><div class="cloud cl3"></div>'+
    '<div class="logoplaque"><img src="'+LOGO+'" alt="Reflections of Grace"></div>'+
    '<div class="h-min">Outreach Ministries</div>'+
    '<h1>Master Training<br>Curriculum</h1>'+
    '<div class="h-sub">From Discipleship to Integrated Christian Counseling</div>'+
    '<div class="h-verse">"Study to shew thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth." — 2 Timothy 2:15</div>'+
    '<div class="h-author">Thomas E. Walker MDiv.</div>'+
    '<button class="begin" onclick="go(\'overview\')">Begin Training →</button> '+
    '<button class="begin" style="background:transparent;color:#4A2450;border:1.5px solid #B58F3E;margin-left:.6rem" onclick="go(\'enroll\')">✍ Enroll Now</button></div>'+
    '<div class="phasecards">'+cards+'</div></div>';
}



/* ---- donation-gated access ---- */
const UNLOCK_CODES={full:'GRACE-2214-FULL',p1:'GRACE-P1-1711',p2:'GRACE-P2-4319',p3:'GRACE-P3-3015',p4:'GRACE-P4-2610',p5:'GRACE-P5-5119',p6:'GRACE-P6-2206'};
const LOCK_EXEMPT=new Set(['p1-overview','p2-intro','p3-overview','p4-intro','p5-intro','p6-intro']);
const unlockStore={
  get(){ try{return JSON.parse(localStorage.getItem('rogom-unlocks')||'{}');}catch(e){return {};} },
  set(v){ try{localStorage.setItem('rogom-unlocks',JSON.stringify(v));}catch(e){} }
};
let unlocks=unlockStore.get();
function isLocked(id){
  const g=GROUP_OF[id];
  if(!g||!PHASE_META[g])return false;
  if(LOCK_EXEMPT.has(id))return false;
  return !(unlocks.full||unlocks[g]);
}
function tryUnlock(){
  const inp=document.getElementById('unlock-code'); if(!inp)return;
  const code=inp.value.trim().toUpperCase();
  const hit=Object.entries(UNLOCK_CODES).find(([k,v])=>v===code);
  const msg=document.getElementById('unlock-msg');
  if(!hit){ msg.style.color='#A0455E'; msg.textContent='That code was not recognized. Check your welcome email, or contact the ministry.'; return; }
  unlocks[hit[0]]=true; unlockStore.set(unlocks);
  msg.style.color='#2E7D32'; msg.textContent='✅ Unlocked! Opening your training now…';
  refreshLockIcons(); setTimeout(()=>render(current),600);
}
function refreshLockIcons(){
  Object.keys(GROUP_OF).forEach(id=>{
    const n=document.getElementById('nav-'+id); if(!n)return;
    n.classList.toggle('locked', isLocked(id));
  });
}
function lockScreenHTML(c){
  const meta=PHASE_META[c.group];
  return '<article class="content"><div class="titlebar"><div class="eyebrow">'+esc(meta.name+' · '+meta.title)+'</div>'+
    '<h1 class="pagetitle">🔒 '+esc(c.title)+'</h1></div>'+
    '<p class="lede">This lesson is part of enrolled access. Enrollment is by suggested donation — <b>$50.00 for Full Access</b> to all six phases, or <b>$10.00 for this phase</b>. After your donation, the ministry sends your unlock code by email; enter it below and this phase opens on your device.</p>'+
    '<p><button class="rdb-btn gold" style="font-size:.92rem;padding:.65rem 1.4rem" onclick="go(&quot;enroll&quot;)">✍ Enroll & Donate</button></p>'+
    '<div style="margin-top:1.4rem;background:var(--paper);border:1px solid var(--gold);border-radius:10px;padding:1rem 1.2rem;max-width:460px">'+
    '<div style="font-family:var(--ui);font-size:.8rem;font-weight:600;color:var(--navy);margin-bottom:.4rem">Already donated? Enter your unlock code:</div>'+
    '<div style="display:flex;gap:.5rem"><input id="unlock-code" style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:.5rem .7rem;font-family:var(--ui)" placeholder="e.g. GRACE-….."><button class="rdb-btn" onclick="tryUnlock()">Unlock</button></div>'+
    '<div id="unlock-msg" style="font-family:var(--ui);font-size:.78rem;margin-top:.45rem"></div></div>'+
    '<p style="font-size:.85rem;color:var(--muted);margin-top:1.3rem"><i>No one is turned away for lack of funds — mention it on the enrollment form and the ministry will respond with grace.</i></p>'+
    '</article>';
}

/* ---- class discussion (comments & replies) ---- */
const DISQUS_SHORTNAME='';  // paste your free Disqus shortname here to activate live comments
function loadDiscussion(id, title){
  const holder=document.createElement('div'); holder.id='discussion';
  holder.innerHTML='<h3>💬 Class Discussion</h3><div class="dnote">Students and the instructor can post comments and reply to one another below. Be gracious — Ephesians 4:29.</div><div id="disqus_thread"></div>';
  document.getElementById('page').appendChild(holder);
  if(!DISQUS_SHORTNAME){
    document.getElementById('disqus_thread').innerHTML='<div class="dpending"><b>Discussion is almost ready.</b> The ministry is activating the comment system — once live, this space becomes a threaded conversation for this lesson. In the meantime, bring your questions to your group meeting or the enrollment form’s message box.</div>';
    return;
  }
  window.disqus_config=function(){ this.page.identifier='rogom-'+id; this.page.url=location.origin+location.pathname+'#/'+id; this.page.title=title; };
  if(window.DISQUS){ window.DISQUS.reset({reload:true, config:window.disqus_config}); }
  else { const d=document.createElement('script'); d.src='https://'+DISQUS_SHORTNAME+'.disqus.com/embed.js'; d.setAttribute('data-timestamp',+new Date()); document.body.appendChild(d); }
}

/* ---- enrollment ---- */
const GIVING_URL='';  // paste the ministry's PayPal/giving link here to activate the Give button
function initEnroll(){
  const f=document.getElementById('enroll-form'); if(!f) return;
  const sel=document.getElementById('enroll-track');
  const upd=()=>{const o=sel.selectedOptions[0];const amt='$'+(+o.dataset.amt).toFixed(2);
    document.getElementById('enroll-amt').textContent=amt;
    document.getElementById('enroll-donation-field').value=amt+' ('+o.textContent.split(' —')[0]+')';
    const note=document.getElementById('enroll-give-note');
    if(GIVING_URL){note.innerHTML='<a href="'+GIVING_URL+'" target="_blank" rel="noopener" style="color:var(--slate);font-weight:600">Give your enrollment donation →</a>';}
  };
  sel.addEventListener('change',upd); upd();
  f.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const st=document.getElementById('enroll-status'); st.style.color='#2E7D32';
    const data=new URLSearchParams(new FormData(f)); data.append('form-name','enrollment');
    try{
      const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data.toString()});
      if(!r.ok) throw new Error(r.status);
      f.reset(); st.textContent='✓ Enrollment received! Once your donation is confirmed, the ministry will email your unlock code — enter it on any locked lesson to open your training.';
    }catch(e){
      st.style.color='#A0455E';
      st.textContent='Submission needs the live site (it won’t work from a file on your computer). If this is the live site and you see this, tell the ministry directly.';
    }
  });
}

/* ---- resource database ---- */
const RESDB = JSON.parse(document.getElementById('resdb-data').textContent);
const RTYPES = [['all','All'],['journal','Journals'],['article','Articles'],['book','Books'],['resource','Guides & Media'],['media','Video & Audio'],['organization','Organizations'],['primary','Primary Texts'],['scripture','Scriptures']];
const RPH = [['all','All Phases'],['p1','Phase I'],['p2','Phase II'],['p3','Phase III'],['p4','Phase IV'],['p5','Phase V'],['p6','Phase VI']];
const RCOLOR = {journal:'#4A6FA5',article:'#8B6914',book:'#1F3864',resource:'#6E8B3D',media:'#5E8B7E',organization:'#A0455E',primary:'#7A4E8E',scripture:'#B58F3E'};
let rdbState={q:'',type:'all',ph:'all',sel:new Set()};
function initResourceDB(){
  const chips=(list,key)=>list.map(([v,l])=>'<span class="chip'+((rdbState[key]===v)?' on':'')+'" data-k="'+key+'" data-v="'+v+'">'+l+'</span>').join('');
  document.getElementById('rdb-types').innerHTML=chips(RTYPES,'type');
  document.getElementById('rdb-phases').innerHTML=chips(RPH,'ph');
  const q=document.getElementById('rdb-q'); q.value=rdbState.q;
  q.addEventListener('input',e=>{rdbState.q=e.target.value;rdbRender();});
  document.getElementById('rdb').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(c){rdbState[c.dataset.k]=c.dataset.v;initResourceDB();return;}
    const s=e.target.closest('input[data-sel]'); if(s){s.checked?rdbState.sel.add(+s.dataset.sel):rdbState.sel.delete(+s.dataset.sel);document.getElementById('rdb-count').textContent=rdbState.sel.size;return;}
  });
  document.getElementById('rdb-word').onclick=rdbWord;
  document.getElementById('rdb-video').onclick=()=>{const term=rdbState.q||'Christian counseling training';window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(term),'_blank');};
  rdbRender();
}
function rdbMatch(e){
  if(rdbState.type!=='all'&&e.type!==rdbState.type)return false;
  if(rdbState.ph!=='all'&&!e.ph.includes(rdbState.ph))return false;
  if(!rdbState.q)return true;
  const q=rdbState.q.toLowerCase();
  return (e.t+' '+e.a+' '+e.d+' '+e.tg.join(' ')).toLowerCase().includes(q);
}
function rdbRender(){
  const hits=RESDB.map((e,i)=>[e,i]).filter(([e])=>rdbMatch(e));
  document.getElementById('rdb-meta').textContent=hits.length+' of '+RESDB.length+' resources'+(rdbState.q?' matching “'+rdbState.q+'”':'');
  document.getElementById('rdb-count').textContent=rdbState.sel.size;
  const phL=p=>({p1:'I',p2:'II',p3:'III',p4:'IV',p5:'V'})[p];
  document.getElementById('rdb-results').innerHTML=hits.map(([e,i])=>{
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(e.t+' '+(e.type==='scripture'?'sermon':'Christian'));
    const sch='https://scholar.google.com/scholar?q='+encodeURIComponent(e.t);
    return '<div class="rcard" style="--rc:'+(RCOLOR[e.type]||'#C9A24B')+'">'+
      '<h4>'+esc(e.t)+'</h4>'+
      '<div class="rmeta"><span class="rbadge">'+e.type+'</span>'+(e.a?esc(e.a)+' · ':'')+(e.ph.length?'Phase '+e.ph.map(phL).join(', '):'')+(e.acc?' · '+esc(e.acc):'')+'</div>'+
      (e.d?'<p>'+esc(e.d)+'</p>':'')+
      '<div class="racts">'+
        (e.url?'<a class="ract" href="'+e.url+'" target="_blank" rel="noopener">🔗 Open online</a>':'')+
        '<a class="ract" href="'+sch+'" target="_blank" rel="noopener">🎓 Scholar</a>'+
        '<a class="ract" href="'+yt+'" target="_blank" rel="noopener">▶ Videos</a>'+
        '<a class="ract" style="color:#7A4E8E" href="https://claude.ai/new?q='+encodeURIComponent(('I am a student in the Reflections of Grace Master Training Portal. Tell me more about this resource and how to use it in my ministry training: '+e.t+(e.a?' by '+e.a:'')+'. '+e.d).slice(0,1500))+'" target="_blank" rel="noopener">✨ Ask Claude</a>'+
        '<label class="rsel"><input type="checkbox" data-sel="'+i+'"'+(rdbState.sel.has(i)?' checked':'')+'> Add to report</label>'+
      '</div></div>';
  }).join('')||'<p><em>No resources match — try fewer filters or a broader term.</em></p>';
}
function rdbWord(){
  const picked=[...rdbState.sel].map(i=>RESDB[i]);
  const list=picked.length?picked:RESDB.filter(e=>rdbMatch(e));
  const rows=list.map(e=>'<h3 style="color:#1F3864;margin:14pt 0 2pt">'+esc(e.t)+'</h3>'+
    '<p style="margin:0;color:#8B6914;font-size:10pt"><b>'+e.type.toUpperCase()+'</b>'+(e.a?' — '+esc(e.a):'')+(e.acc?' — '+esc(e.acc):'')+'</p>'+
    (e.d?'<p style="margin:4pt 0">'+esc(e.d)+'</p>':'')+
    (e.url?'<p style="margin:0;font-size:10pt">Link: '+e.url+'</p>':'')).join('');
  const html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Resource Report</title></head>'+
    '<body style="font-family:Georgia,serif"><h1 style="color:#1F3864">Reflections of Grace — Resource Report</h1>'+
    '<p><i>Generated from the Master Training Portal Resource Database · '+new Date().toLocaleDateString()+
    (rdbState.q?' · Search: “'+esc(rdbState.q)+'”':'')+' · '+list.length+' resources</i></p><hr>'+rows+'</body></html>';
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ROGOM_Resource_Report.doc';a.click();URL.revokeObjectURL(a.href);
}


/* ---- ancient witness library ---- */
const AWDB = JSON.parse(document.getElementById('awdb-data').textContent);
const AWKINDS=[['all','All'],['corpus','Corpora & Texts'],['character','Characters'],['prophecy','Prophecies'],['theme','Comparative Themes']];
const AWCOLOR={corpus:'#1F3864',character:'#A0455E',prophecy:'#8B6914',theme:'#7A4E8E'};
let awState={q:'',kind:'all',sel:new Set()};
let AWALL=[];
(function(){
  AWDB.corpora.forEach(c=>AWALL.push({kind:'corpus',t:c.name,sub:c.trad+' · '+c.dates+' · '+c.langs,d:c.desc,
    extra:c.texts.map(x=>'<b>'+x.n+'</b> — '+x.d).join('<br>'),search:c.name+' '+c.trad+' '+c.desc+' '+c.texts.map(x=>x.n+' '+x.d).join(' ')}));
  AWDB.characters.forEach(c=>AWALL.push({kind:'character',t:c.n,sub:c.trad+' · '+c.refs,d:c.d,
    extra:c.par.map(p=>'<b>'+p.n+'</b> ('+p.src+') — '+p.rel+' <i>[Confidence: '+p.conf+']</i>').join('<br>'),
    search:c.n+' '+c.trad+' '+c.refs+' '+c.d+' '+c.par.map(p=>p.n+' '+p.src+' '+p.rel).join(' ')}));
  AWDB.prophecies.forEach(p=>AWALL.push({kind:'prophecy',t:p.t+' ('+p.ref+')',sub:p.cat+' · Given: '+p.given+' · Status: '+p.status,
    d:'<b>Prophecy:</b> '+p.p+'<br><b>Fulfillment:</b> '+p.f,extra:'<b>Witness corpora:</b> '+p.src,raw:1,
    search:p.t+' '+p.ref+' '+p.cat+' '+p.p+' '+p.f+' '+p.src}));
  AWDB.themes.forEach(th=>AWALL.push({kind:'theme',t:th.t,sub:'Comparative theme · '+th.w.length+' witnesses',d:th.s,
    extra:'<b>Witness texts:</b><br>'+th.w.join('<br>'),search:th.t+' '+th.s+' '+th.w.join(' ')}));
})();
function initAWDB(){
  document.getElementById('aw-kinds').innerHTML=AWKINDS.map(([v,l])=>'<span class="chip'+((awState.kind===v)?' on':'')+'" data-v="'+v+'">'+l+'</span>').join('');
  const q=document.getElementById('aw-q'); q.value=awState.q;
  q.addEventListener('input',e=>{awState.q=e.target.value;awRender();});
  document.getElementById('awdb').addEventListener('click',e=>{
    const c=e.target.closest('.chip'); if(c){awState.kind=c.dataset.v;initAWDB();return;}
    const s2=e.target.closest('input[data-awsel]'); if(s2){s2.checked?awState.sel.add(+s2.dataset.awsel):awState.sel.delete(+s2.dataset.awsel);document.getElementById('aw-count').textContent=awState.sel.size;return;}
  });
  document.getElementById('aw-word').onclick=awWord;
  awRender();
}
function askClaudeURL(topic,context){
  const prompt='I am a student in the Reflections of Grace Master Training Portal (a five-phase ministry training program). Help me research further: '+topic+'. Context from the portal’s Ancient Witness Research Library: '+context+' Please give me deeper background, the key scriptures and ancient texts to read, the main scholarly perspectives, and 3 discussion questions I could bring to my study group.';
  return 'https://claude.ai/new?q='+encodeURIComponent(prompt.slice(0,1800));
}
function awMatch(e){
  if(awState.kind!=='all'&&e.kind!==awState.kind)return false;
  if(!awState.q)return true;
  return e.search.toLowerCase().includes(awState.q.toLowerCase());
}
function awRender(){
  const hits=AWALL.map((e,i)=>[e,i]).filter(([e])=>awMatch(e));
  document.getElementById('aw-meta').textContent=hits.length+' of '+AWALL.length+' records'+(awState.q?' matching “'+awState.q+'”':'');
  document.getElementById('aw-count').textContent=awState.sel.size;
  document.getElementById('aw-results').innerHTML=hits.map(([e,i])=>{
    const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(e.t+' documentary');
    const sch='https://scholar.google.com/scholar?q='+encodeURIComponent(e.t.replace(/\(.*\)/,''));
    return '<div class="rcard" style="--rc:'+AWCOLOR[e.kind]+'">'+
      '<h4>'+esc(e.t)+'</h4><div class="rmeta"><span class="rbadge">'+e.kind+'</span>'+esc(e.sub)+'</div>'+
      '<p>'+(e.raw?e.d:esc(e.d))+'</p>'+(e.extra?'<p style="font-size:.8rem;color:#4A473C">'+e.extra+'</p>':'')+
      '<div class="racts">'+
        '<a class="ract" href="'+sch+'" target="_blank" rel="noopener">🎓 Scholar</a>'+
        '<a class="ract" href="'+yt+'" target="_blank" rel="noopener">▶ Documentaries</a>'+
        '<a class="ract" style="color:#7A4E8E" href="'+askClaudeURL(e.t, (e.sub+'. '+(e.raw?'':e.d)).slice(0,320))+'" target="_blank" rel="noopener">✨ Ask Claude</a>'+
        '<label class="rsel"><input type="checkbox" data-awsel="'+i+'"'+(awState.sel.has(i)?' checked':'')+'> Add to report</label>'+
      '</div></div>';
  }).join('')||'<p><em>No records match — try a broader term.</em></p>';
}
function awWord(){
  const picked=[...awState.sel].map(i=>AWALL[i]);
  const list=picked.length?picked:AWALL.filter(e=>awMatch(e));
  const rows=list.map(e=>'<h3 style="color:#1F3864;margin:14pt 0 2pt">'+esc(e.t)+'</h3>'+
    '<p style="margin:0;color:#8B6914;font-size:10pt"><b>'+e.kind.toUpperCase()+'</b> — '+esc(e.sub)+'</p>'+
    '<p style="margin:4pt 0">'+(e.raw?e.d:esc(e.d))+'</p>'+(e.extra?'<p style="margin:0 0 6pt;font-size:10pt">'+e.extra+'</p>':'')).join('');
  const html='<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Ancient Witness Report</title></head>'+
    '<body style="font-family:Georgia,serif"><h1 style="color:#1F3864">Reflections of Grace — Ancient Witness Research Report</h1>'+
    '<p><i>Generated from the Master Training Portal · '+new Date().toLocaleDateString()+
    (awState.q?' · Search: “'+esc(awState.q)+'”':'')+' · '+list.length+' records</i></p><hr>'+rows+'</body></html>';
  const blob=new Blob(['﻿'+html],{type:'application/msword'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ROGOM_Ancient_Witness_Report.doc';a.click();URL.revokeObjectURL(a.href);
}
