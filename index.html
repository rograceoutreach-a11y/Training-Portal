miscuity, lying, bullying, addictions, black-and-white thinking, and emotional tantrums in adults. Treatment includes reparative relational experiences and trauma-focused therapies<\/p><\/li>\n<li><p>Attachment disruption: Walker’s insight that a son needs his father as a ‘genetic mirror’ aligns with object relations theory: the father’s face becomes a developmental reference point for the child’s emerging identity<\/p><\/li>\n<li><p>Stinking Thinking / Cognitive distortions: Psychologically addressed through Cognitive Behavioral Therapy (CBT) and Acceptance and Commitment Therapy (ACT); biblically addressed through the renewing of the mind (Romans 12:2) and taking thoughts captive (2 Corinthians 10:5)<\/p><\/li>\n<li><p>Spiritual identity as psychological foundation: Biblical Integrated Psychology proposes that knowing one’s identity as God’s image-bearer provides the most stable psychological foundation for self-concept — unchanging, unconditional, and unearned<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker says that without a father, a son ‘has no mirror.’ How does this relate to both object relations theory and the Biblical concept of being made in God’s image (Genesis 1:27)? What implications does this have for how the Church serves fatherless children and youth?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Arrested Development can make adults appear childish, selfish, or irresponsible. How should a pastoral counselor balance accountability with compassion when working with someone whose emotional development was arrested by trauma?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker references stinking thinking as a pattern that keeps people bound to their past. How do you integrate the psychological practice of cognitive restructuring with the biblical call to ‘take every thought captive’ (2 Corinthians 10:5) in counseling practice?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>The text references Mark 5 and Acts 16 as biblical examples of healing from disordered thinking and behavior. How do you use miraculous healing narratives in Scripture in a clinical or pastoral setting without creating false expectations?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker says that God’s love is implanted in us at birth and that identity begins before sin takes root. How does this theological anthropology shape your approach to counseling someone who believes they are beyond help or fundamentally broken?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u5": {"title": "Unit 5: The Vacuum of Love", "group": "p2", "html": "<p><em>Chapter 4 — When Love Was Stolen and Must Be Restored<\/em><\/p>\n<p>Walker uses the stories of Eve, Cain, and Abel to illustrate how the vacuum of love begins when people feel excluded from God’s love or from the love they deserved in their family. Lust, jealousy, emotional attachment to broken people, and the danger of ‘hurt people hurting people’ are examined through 1 Corinthians 13, biblical parables, and Sandra Wilson’s work on hurt people.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>Lust vs. Love: Lust is emotional need masquerading as love; true love (1 Corinthians 13:4-7) is consistent, patient, and non-self-seeking<\/p>\n<p>Cain and Eve: Biblical case studies in how emotional exclusion produces jealousy, violence, and rebellion<\/p>\n<p>‘Hurt people hurt people’ (Sandra Wilson): Those who have not healed their own vacuum inevitably wound those they are drawn to<\/p>\n<p>Ecclesiastes 3: Seasons of life — there is a time for every relational experience, including loss, grieving, and new love<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The vacuum of love is perhaps the most common presenting issue in pastoral care. People seeking the pastor’s counsel are often carrying wounds from absent or abusive parents, failed relationships, and patterns of gravitating toward people who mirror their own brokenness. The pastoral counselor must hold two truths simultaneously: the person is worthy of love, and they must do their own healing work before healthy love is possible.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Validate the pain of lovelessness without reinforcing the narrative that the person is unlovable<\/p><\/li>\n<li><p>Use 1 Corinthians 13:4-7 not as a checklist but as a diagnostic: invite the person to identify where love was absent or distorted in their primary relationships<\/p><\/li>\n<li><p>Address the ‘baggage of expectations’ (Mundargi): help the person see when they are asking one person to heal what many people wounded<\/p><\/li>\n<li><p>Normalize the need for professional help: Sandra Wilson’s point that Christians who seek human counsel are not faithless is a pastoral permission slip (Wilson, 2001)<\/p><\/li>\n<li><p>Introduce agape love as a healing practice: helping the person experience God’s unconditional love through community, prayer, and consistent pastoral presence<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “Above all, have fervent love for one another, for love covers a multitude of sins.” — 1 Peter 4:8<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The vacuum of love is addressed psychologically through attachment disruption, limerence (the compulsive, obsessive form of romantic longing born from unmet childhood needs), and codependency. Walker’s description of being drawn to people who share your trauma because they ‘understand you’ is clinically known as trauma bonding.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Trauma bonding: When early relational wounds are not healed, individuals are unconsciously drawn to partners whose patterns feel familiar, even if those patterns are harmful. Clinically, this mirrors Walker’s description of the baggage of expectations and gravitating toward those who share our vacuum<\/p><\/li>\n<li><p>Lust as psychological defense: From a Biblical Integrated Psychology perspective, lust (as Walker defines it — a strong psychological desire, not only sexual) is the emotional vacuum’s attempt to fill itself with whatever is available — a short-term substitute for love<\/p><\/li>\n<li><p>Cain and Eve as case studies in emotional regulation failure: Both chose emotional response over rational obedience. Neuroscience calls this amygdala hijacking; Scripture calls it allowing the heart to override the Spirit<\/p><\/li>\n<li><p>Agape love as corrective emotional experience: In therapy, a corrective emotional experience is a new relational encounter that challenges old wounds. In Biblical Integrated Psychology, God’s agape love — experienced through community, Scripture, and the therapeutic relationship — provides this corrective experience<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker draws a parallel between the story of Eve and Cain and modern individuals who fill the vacuum of love with jealousy, lust, or rebellion. How do you use biblical narrative therapeutically without making counselees feel judged or compared to sinful characters?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Sandra Wilson writes that Christians who seek human comfort when hurting are not faithless or backsliding. How does this statement address a real barrier to care in the Church? What messages have you heard — or given — that discourage people from seeking help?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker describes ‘hurt people hurting people’ as a dynamic where those seeking love unavoidably wound each other. How do you address this cycle pastorally without the person feeling blamed for their own wounding?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>How do the seasons described in Ecclesiastes 3 apply to the healing of the vacuum of love? What does it look like to counsel someone to wait for ‘the right season’ when they are in acute relational pain?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>From a Biblical Integrated Psychology standpoint, how do you help a person distinguish between healthy love, codependency, and trauma bonding — especially when all three may feel like ‘real love’ to the person experiencing them?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u6": {"title": "Unit 6: The Vacuum of Joy", "group": "p2", "html": "<p><em>Chapter 5 — Pseudo Joy vs. True Joy: The Spiritual Difference<\/em><\/p>\n<p>Walker distinguishes between happiness (sensory, temporary, externally derived) and joy (spiritual, internal, God-given). The vacuum of joy is created when the family structure fails to provide safety, stability, and celebration — leaving individuals pursuing pseudo-joy substitutes: superficial relationships, material things, and emotional highs. Attachment theory, the Fruit of the Spirit, and the Hebrew name of God (YHWH as love, desire, and passion) are integrated.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>Happiness vs. Joy: Happiness is circumstantial; Joy is the deep spiritual well-being that survives circumstances (Galatians 5:22-23)<\/p>\n<p>Pseudo-Joy: False joy — the emotional high from superficial relationships, experiences, or possessions that cannot sustain<\/p>\n<p>YHWH: The Hebrew name of God translated as love, desire, and passion — the original source of all true joy<\/p>\n<p>Attachment theory (Collins, 2007): Children separated from parents experience anxiety; adults seek attachment figures to fill the joy vacuum<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor is positioned uniquely to address the vacuum of joy because authentic joy is ultimately a spiritual category. While therapy addresses the symptom (depression, anhedonia, emotional numbness), pastoral counseling can point to the Source: YHWH, the God whose very name means love, desire, and passion. Joy is not something the person creates — it is something they receive as they open themselves to relationship with God.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Help the person name what they have substituted for joy: substances, relationships, social media validation, performance<\/p><\/li>\n<li><p>Distinguish grief from the vacuum of joy: grief is a healthy response to loss; the vacuum of joy is the long-term absence of a foundation for joy<\/p><\/li>\n<li><p>Use the Fruit of the Spirit (Galatians 5:22-23) as a pastoral assessment tool: which fruits are absent in the person’s life? Where did they first go missing?<\/p><\/li>\n<li><p>Introduce communal joy: Walker’s family stories of laughter, play, and togetherness remind us that joy is relational and can be restored through authentic community<\/p><\/li>\n<li><p>Address the spiritual lie that the vacuum planted: ‘Joy is not for people like me’ — counter with Isaiah 42:5-11 and God’s declaration of light and freedom<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “The fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness, gentleness, and self-control.” — Galatians 5:22-23<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>From a Biblical Integrated Psychology perspective, joy is both a neurological state and a spiritual posture. The absence of joy — clinical anhedonia — is correlated with depression, trauma, and disrupted attachment. Walker’s concept of pseudo-joy maps onto the psychological concept of hedonic adaptation: humans constantly adjust to pleasure, requiring increasingly intense stimuli to feel good, while true eudaimonic well-being (meaning-based flourishing) remains stable.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Positive Psychology and biblical joy: Seligman’s PERMA model (Positive emotion, Engagement, Relationships, Meaning, Accomplishment) parallels Walker’s description of joy as emerging from relationship, purpose, community, and faith<\/p><\/li>\n<li><p>Attachment and pseudo-joy: Collins (2007) notes that children who experience separation anxiety seek attachment figures anxiously in adulthood. Pseudo-joy is the emotional high of finally feeling ‘seen’ by such a figure — even when the figure is harmful<\/p><\/li>\n<li><p>Neurological joy and spiritual joy: Gratitude practices, mindfulness, and community engagement are clinically proven to elevate joy-related neurotransmitters. Biblical parallels: thanksgiving (Philippians 4:6), corporate worship, and the practice of remembrance all serve similar neurological and spiritual functions<\/p><\/li>\n<li><p>Walker’s lighthouse metaphor: ‘We are lighthouses of joy when we overcome our history of pain.’ This is the clinical concept of post-traumatic growth — the capacity to help others specifically because of what one has survived<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker distinguishes joy (spiritual, internal, lasting) from happiness (external, circumstantial, temporary). How does this distinction change how you counsel someone who says ‘I just want to be happy’? What would be a pastoral and psychological response?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Pseudo-joy is described as filling the vacuum with false substitutes. What are the most common pseudo-joy substitutes you encounter in ministry or counseling? How do you address these without shaming the person?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker says the name YHWH means love, desire, and passion. How does understanding God’s character as inherently relational change the way you frame spiritual formation and pastoral care for someone with a depleted joy capacity?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker identifies the vacuum of joy as rooted in family structure failure. What is the church’s responsibility in creating alternative family-like communities of joy for those who did not experience it at home?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>From a Biblical Integrated Psychology standpoint, what is the relationship between gratitude, joy, and trauma recovery? How can gratitude practices be used therapeutically without bypassing the reality of pain?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u7": {"title": "Unit 7: The Vacuum of Purpose", "group": "p2", "html": "<p><em>Chapter 6 — Dreams Deferred, Destiny Delayed, and Divine Providence<\/em><\/p>\n<p>Walker uses his own story — a boy who dreamed of being a forensic scientist and baseball player, whose dreams were dismantled by the vacuum of instability, domestic violence, and absence — to explore the vacuum of purpose. He introduces Jean Piaget’s Social Development Theory, the latchkey kid phenomenon, and the concept of divine intervention as purpose-restorer.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>Purpose vacuum: When trauma and instability dismantle the child’s dreams, replacing vision with complacency<\/p>\n<p>Latchkey kids: Children left home alone who miss critical social development opportunities (Piaget’s Social Development Theory)<\/p>\n<p>Divine intervention as purpose: God places angels and positive influences in the path of purposeless people<\/p>\n<p>Delay is not denial: Dreams are not dead because they are deferred; God’s purposes stand (Proverbs 19:21)<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>Pastoral counselors encounter the vacuum of purpose in people who have given up on dreams, who cannot envision a future, or who have settled into the comfortable numbness of purposelessness. Walker’s biology teacher who pulled him aside is a profound model of the pastoral counselor: present, invested, and willing to call forth purpose in someone who cannot yet see it.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Help the person name their original dreams: What did they want to be? What did they love before the vacuum silenced them?<\/p><\/li>\n<li><p>Challenge the complacency of purposelessness without shaming the person for surviving: complacency is a coping mechanism, not a character flaw<\/p><\/li>\n<li><p>Use Jeremiah 29:11 as a pastoral anchor: God’s plans for the person are for prosperity and hope, not for disaster — even when the present looks bleak<\/p><\/li>\n<li><p>Identify divine interventions in the person’s history: Who was placed in their path? What doors opened unexpectedly? What survived the vacuum?<\/p><\/li>\n<li><p>Introduce the concept of calling: purpose is not only about career or ambition but about the unique contribution God designed this person to make (Proverbs 18:16)<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “For I know the thoughts that I think toward you, says the Lord, thoughts of peace and not of evil, to give you a future and a hope.” — Jeremiah 29:11<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The vacuum of purpose is understood psychologically through Maslow’s hierarchy of needs (self-actualization as the pinnacle of human development), logotherapy (Viktor Frankl’s finding that meaning-making is the primary human motivation), and Piaget’s Social Development Theory. When children are denied safe environments for exploration and social learning, they fail to develop the cognitive and relational scaffolding needed to pursue purpose.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Logotherapy and biblical purpose: Frankl’s insight that those who had a reason to live survived the worst circumstances parallels Walker’s testimony that God’s plans (Jeremiah 29:11) sustained him through multiple losses. Purpose as meaning is both psychologically protective and spiritually grounding<\/p><\/li>\n<li><p>Piaget and latchkey kids: Social development requires active engagement with the physical world (Kelly et al., 2020). Latchkey kids denied this engagement show underdevelopment in conflict resolution, group dynamics, and social accountability — all essential for pursuing purpose in community<\/p><\/li>\n<li><p>Post-traumatic growth (PTG): Research shows that individuals who assign meaning to their suffering — who find a purpose larger than their pain — demonstrate greater resilience, stronger relationships, and deeper spiritual engagement. Walker’s own life and book are a model of PTG<\/p><\/li>\n<li><p>Dr. Myles Monroe’s gift principle: ‘Do what you were born to do.’ Integrated with psychology of strengths (Seligman’s VIA Character Strengths), this becomes a practical therapeutic tool for purpose discovery<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker says that without a purpose we become complacent, unable to envision our lives in the future. How does complacency function as a trauma response? How do you distinguish between someone who genuinely lacks direction and someone who has dissociated from their dreams as a protection?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker’s biology teacher is described as an ‘assigned angel’ — a divine intervention in his purpose journey. Can you identify a similar figure in your own story or in the stories of those you have counseled? What made that person’s intervention effective?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>How do you integrate the theological concept of calling with the psychological literature on meaning-making (logotherapy) in pastoral counseling? Are these frameworks compatible? Where do they create tension?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker rejected his biology teacher’s mentoring and ‘continued to spiral downward.’ How do you counsel someone who is actively resisting the help they need? What is the pastoral and psychological responsibility when someone refuses to receive purpose-restoring interventions?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker frames delay as not denial: purpose deferred is not purpose destroyed. How do you pastorally and psychologically address the emotional experience of long-delayed purpose — especially for someone in middle or later life who is grieving the time lost?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u8": {"title": "Unit 8: Swaddling, Security, and Early Attachment", "group": "p2", "html": "<p><em>Chapter 7 — The Security Blanket of God’s Love<\/em><\/p>\n<p>Using Luke 2:11-12 (the Christ child wrapped in swaddling clothes) as a central metaphor, Walker explores the critical role of early parental security in infant development. When parents carry their own unhealed vacuum into the parenting role, the child is deprived of the swaddling security they need. Postpartum depression, parental detachment, and God as the ultimate swaddling parent are examined.<\/p>\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor serving new parents, struggling parents, or adults carrying attachment wounds from infancy must operate with deep sensitivity and patience. Walker’s call for no shame in seeking help when parenting is overwhelming is a pastoral mandate — especially in communities where admitting parental struggle is seen as weakness or spiritual failure.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Create church cultures where parenting struggles are normalized, not shamed: the vacuum of early attachment often begins in silence<\/p><\/li>\n<li><p>Address postpartum struggles pastorally by connecting families to both clinical resources and spiritual community<\/p><\/li>\n<li><p>Use Luke 2:11-12 as a pastoral image: God wrapped the most vulnerable person in history in swaddling clothes — God’s posture toward the vulnerable is one of wrapping, covering, and protecting<\/p><\/li>\n<li><p>Help adults identify the swaddling deficits in their own early history: Where did early security fail? Who was supposed to be their safe haven?<\/p><\/li>\n<li><p>Introduce Newton’s Third Law as a pastoral frame: every parental action has an equal and opposite reaction in the child’s emotional development<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “You will find a Babe wrapped in swaddling clothes, lying in a manger.” — Luke 2:12<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>Early attachment is the cornerstone of developmental psychology. Bowlby’s Attachment Theory, Ainsworth’s Strange Situation research, and Winnicott’s concept of the ‘good enough mother’ all converge around Walker’s swaddling metaphor: children need consistent, responsive, safe parental presence to develop secure attachment.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Secure attachment as developmental prerequisite: Secure attachment in infancy predicts emotional regulation, relational trust, and identity stability in adulthood. The absence of swaddling security creates insecure or disorganized attachment — the psychological root of many adult presenting issues in counseling<\/p><\/li>\n<li><p>Intergenerational transmission of attachment: Parents who carry their own attachment wounds transmit them to their children through parenting style and emotional availability. Walker’s insight that the parent’s vacuum meets the child’s vacuum is precisely what attachment research calls the ‘ghosts in the nursery’ phenomenon<\/p><\/li>\n<li><p>God as Secure Attachment Figure: Biblical Integrated Psychology proposes that the therapeutic and pastoral experience of God as a consistently loving, responsive, attuned parent provides a corrective attachment experience for those with insecure attachment histories<\/p><\/li>\n<li><p>Third party intervention (Walker): Mental health providers and clergy counselors are the ‘third party’ that breaks the parent-child vacuum cycle by providing tools, modeling, and support<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker uses the image of Jesus in swaddling clothes to symbolize God’s posture toward vulnerability. How does this image reshape your understanding of pastoral care for people whose earliest experiences were characterized by abandonment or insecurity rather than wrapping and protection?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker notes that a parent who carries their own unhealed vacuum cannot fully provide the swaddling security the infant needs. How does this insight change how you approach pre-marital counseling, new parent ministry, or parenting classes in your context?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>What is the role of the church as a swaddling community? How can the body of Christ provide collective attachment experiences for those whose early family environments failed to offer safety and security?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>From a Biblical Integrated Psychology perspective, how do you help adult clients identify and grieve their early attachment wounds without falling into unproductive blame of parents who were also vacuum victims?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker writes: ‘We are defined not by our trauma but by our ability to survive and thrive after the pain.’ How does post-traumatic growth theory intersect with this statement? What role does the pastoral counselor play in that transition from surviving to thriving?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u9": {"title": "Unit 9: Time, Healing, and the Process of Recovery", "group": "p2", "html": "<p><em>Chapter 8 — The Milestones of Time and the Path to Wholeness<\/em><\/p>\n<p>Walker’s most personal chapter catalogs his own accumulated losses: three failed marriages, a miscarried child, a father who died without reconciling, 19-year military career ending in medical retirement, and multiple chronic conditions including PTSD, Major Depressive Disorder, and Traumatic Brain Injury. Through these losses, Walker articulates a theology of time: healing takes time, and time itself — surrendered to God — becomes a healing tool.<\/p>\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor must resist the temptation to rush healing. Walker’s testimony is a powerful corrective to ministry cultures that equate speed of recovery with strength of faith. Time is sacred in the healing process, and the pastoral counselor’s role is to be a consistent, patient, non-anxious presence across the long arc of someone’s healing journey.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Honor the timeline: No one can be told when they should be healed. The counselor’s role is accompaniment, not acceleration<\/p><\/li>\n<li><p>Use 2 Corinthians 10:4-5 as a framework for the spiritual warfare involved in healing: strongholds are dismantled thought by thought, memory by memory<\/p><\/li>\n<li><p>Help the person identify milestones: moments when they could think about a painful memory without being pulled back into the time and day it happened<\/p><\/li>\n<li><p>Address testimony as a healing tool: sharing one’s story of survival is not only evangelistic but therapeutic — it creates narrative coherence and meaning from chaos<\/p><\/li>\n<li><p>Hold hope for the person when they cannot hold it themselves: Psalm 27:13-14 (King David’s almost-lost hope restored by remembering God’s goodness)<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “I would have lost heart unless I had believed I would see the goodness of the Lord in the land of the living. Wait on the Lord; be of good courage.” — Psalm 27:13-14<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The psychology of time in healing is rooted in grief theory (Kubler-Ross, Worden), trauma processing models (EMDR, Prolonged Exposure), and the neuroscience of memory reconsolidation. Walker’s personal losses — military retirement, disability, failed marriages, loss of children — represent a cumulative grief burden that required integrated biological, psychological, social, and spiritual intervention.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Cumulative grief: Walker’s losses were not single events but a cascade. Research shows that cumulative grief compounds the healing timeline and often requires more intensive intervention. Biblical Integrated Psychology does not rush this process but provides a framework of hope for sustained engagement<\/p><\/li>\n<li><p>Time-based milestones: Walker’s concept of placing milestones in the timeline parallels the therapeutic concept of progress markers in trauma processing — moments when the traumatic memory no longer triggers the same physiological and emotional response<\/p><\/li>\n<li><p>2 Corinthians 10:4-5 and cognitive restructuring: The ‘weapons of our warfare’ include taking every thought captive. Clinically, this is the work of cognitive therapy: identifying and challenging the thought patterns that keep trauma alive<\/p><\/li>\n<li><p>Psalm 90:12 and wisdom: ‘Teach us to number our days that we may gain a heart of wisdom.’ In positive psychology, the practice of memento mori — awareness of mortality — is linked to greater present-moment meaning-making and purposeful living<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker lists an extraordinary accumulation of losses: multiple marriages, miscarriage, father’s death without reconciliation, medical retirement, and multiple chronic conditions. How do you counsel someone carrying cumulative grief without inadvertently minimizing one loss in light of another?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker describes alcohol and promiscuity as attempts to mask the pain of his losses. How do you pastorally address substance use and sexual behaviors as coping mechanisms without shaming the person while helping them see the harm these patterns cause?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>How does the concept of ‘surviving the shift’ speak to the difference between coping and thriving? What does the transition from survivor to thriver look like clinically and pastorally?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker says God’s help is not always tangible or visible — it is a feeling of not being alone. How do you help someone access this sense of divine presence when depression, trauma, or grief has made God feel absent?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker uses Psalm 90:12 (‘Teach us to number our days’) to invite time-wise living. How can this scripture be used in both pastoral care and clinical settings to help people make meaning of their suffering and invest wisely in their remaining days?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u10": {"title": "Unit 10: The Spiritual Vacuum — Faith in the Midst of Emptiness", "group": "p2", "html": "<p><em>Chapter 9 — When Prayer Goes Unanswered and Faith Wavers<\/em><\/p>\n<p>Walker addresses the vacuum of faith — the spiritual depletion that occurs when unanswered prayers, ongoing suffering, and a seemingly absent God create a crisis of belief. Drawing on King David’s near-loss of hope in Psalm 27, Paul’s testimony in 2 Corinthians 4:8-10, and Hebrews 11:6, Walker argues that faith is not the absence of doubt but the willingness to take the next step even without seeing the full staircase.<\/p>\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor is often the person someone turns to when their faith is in crisis. The vacuum of faith is particularly dangerous because it isolates the person from the very spiritual resources — prayer, community, Scripture — that could sustain them. The pastor must be willing to sit in the tension of unanswered prayer without offering easy answers.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Hold space for lament: The Psalms (Psalm 22, 27, 88) model honest cry to God without abandonment of faith. The pastor who invites lament rather than suppressing it does profound healing work<\/p><\/li>\n<li><p>Differentiate spiritual crisis from depression: The vacuum of faith may be a symptom of clinical depression; the pastoral counselor should be equipped to recognize this and refer when appropriate<\/p><\/li>\n<li><p>Offer the testimony of other survivors: King David’s nearly lost hope, restored by memory of God’s faithfulness, is a powerful pastoral narrative for those in spiritual vacuum<\/p><\/li>\n<li><p>Resist the theology of explanation: Do not try to explain why God allowed the person’s suffering. The pastoral role in the vacuum of faith is presence, not explanation<\/p><\/li>\n<li><p>Connect the person to a fruit-bearing community (Matthew 7:15-20): The quality of the spiritual community a person joins during faith crisis significantly affects their recovery<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “We are hard-pressed on every side, yet not crushed; perplexed, but not in despair; persecuted, but not forsaken; struck down, but not destroyed.” — 2 Corinthians 4:8-9<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The spiritual vacuum is addressed psychologically through the research on religious/spiritual struggle, deconversion, and the protective and risk factors of religious affiliation in mental health. Pargament’s research on positive and negative religious coping shows that those who feel abandoned or punished by God (negative religious coping) experience worse mental health outcomes.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Negative religious coping: When unanswered prayer leads to the belief that God is absent, punishing, or indifferent, it creates a spiritual-psychological crisis that deepens the vacuum of faith. Biblical Integrated Psychology addresses this by holding both the psychological experience of divine absence and the biblical testimony of God’s faithfulness<\/p><\/li>\n<li><p>Faith as developmental process: Walker’s testimony of ‘having faith in the action, not the process’ is a common developmental faith stage. Fowler’s Stages of Faith describe the movement from naive trust to mature, tested faith as a normal developmental arc — not a spiritual failure<\/p><\/li>\n<li><p>Hebrews 11:1 and the psychology of hope: ‘Faith is the substance of things hoped for, the evidence of things not seen.’ Positive psychology’s hope theory (Snyder, 2002) defines hope as a cognitive-motivational process with two components: agency (belief that goals can be achieved) and pathways (ability to find routes to those goals). Both are essential in the vacuum of faith<\/p><\/li>\n<li><p>Dr. King’s quote and therapeutic faith: ‘Faith is taking the first step even when you don’t see the whole staircase.’ This parallels Exposure Therapy’s approach to anxiety: taking action despite uncertainty, which gradually rebuilds trust in one’s own capacity and in a supportive environment<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker describes the vacuum of faith as beginning when prayers go unanswered and slowly consuming every area of life. How do you pastorally distinguish between a spiritual crisis of faith and clinical depression? What are the indicators that tell you each requires a different primary response?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker says the vacuum of faith fills the free space with anger, unbelief, and resentment toward God, the church, and Jesus. How do you counsel someone who is angry at God without either dismissing their anger or reinforcing a theology of divine punishment?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>King David almost lost hope but held on by remembering what God had done previously. How do you use the practice of ‘remembering God’s faithfulness’ therapeutically with someone in a deep faith crisis? What are the risks of this approach with someone in acute suffering?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker advocates for a personal reading of the Bible rather than through someone else’s interpretation. How does this principle connect with the biblical-psychological concept of internalization — moving from external religious authority to internal spiritual conviction?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>From a Biblical Integrated Psychology standpoint, how do you help someone whose faith was weaponized against them (through abuse, spiritual manipulation, or toxic religion) rebuild a healthy relationship with God and Scripture?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u11": {"title": "Unit 11: Remediation — Healing Pathways for Men, Women, and Children", "group": "p2", "html": "<p><em>Remediation Section — The Parents, The Children, Pathways to Wholeness<\/em><\/p>\n<p>Walker’s Remediation section addresses specific healing pathways for men, women, boys, and girls. He draws on Solomon’s wisdom literature, the stories of Ruth and Naomi, the father-son teaching in Proverbs 4, and the Proverbs 31 woman to offer differentiated counsel for each demographic. The need for Integrated Psychology, Psychotherapy, and support groups alongside spiritual guidance is explicitly recommended.<\/p>\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>Walker’s Remediation section is itself a pastoral document: he addresses men, women, boys, and girls directly, with pastoral authority and personal vulnerability. The pastoral counselor drawing from this section must be attentive to gender-specific presentations of the vacuum effect and offer differentiated pathways.<\/p>\n<p>For men and boys:<\/p>\n<ul>\n<li><p>Speak identity and purpose with consistent affirmation: Solomon’s fatherly instruction in Proverbs 4:1-6 is the model of pastoral fathering<\/p><\/li>\n<li><p>Challenge the vacuum of male role modeling: men who did not have fathers need safe same-gender mentoring relationships in the church<\/p><\/li>\n<li><p>Address male emotional suppression as a vacuum symptom: the inability to feel, name, and express emotions is not strength but injury<\/p><\/li>\n<\/ul>\n<p>For women and girls:<\/p>\n<ul>\n<li><p>Use the Ruth-Naomi model: women healing the vacuum need both mentorship from older women and permission to grieve what was lost<\/p><\/li>\n<li><p>Address the link between the father vacuum and adult relationship patterns: the girl who never had a father’s love is more vulnerable to predatory relationships<\/p><\/li>\n<li><p>Create women’s safe communities in the church where vulnerability is honored and not exploited<\/p><\/li>\n<\/ul>\n<p>For all:<\/p>\n<ul>\n<li>Walker explicitly recommends Board-Certified Psychologists, Certified Family Counselors, and degreed pastoral counselors. The pastoral counselor’s most important referral skill is knowing the limits of their own training<\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “Entreat me not to leave you... wherever you go, I will go.” — Ruth 1:16<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The Remediation section’s call for Integrated Psychology, Psychotherapy, and support groups alongside spiritual guidance is a direct affirmation of the Biblical Integrated Psychology model: no single modality is sufficient for the depth of the vacuum’s wounds. Healing requires the best of human knowledge and divine wisdom working together.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Gender-informed therapy: Men and women present the vacuum differently. Men more often externalize (anger, avoidance, substance use); women more often internalize (depression, self-blame, relational enmeshment). Pastoral care must be gender-sensitive without reinforcing harmful stereotypes<\/p><\/li>\n<li><p>Father hunger in boys: Research (Sarkadi et al., 2008) shows paternal engagement is a direct predictor of lower behavioral problems, higher cognitive competence, and greater social stability in sons. Walker’s description of the son as needing a genetic mirror is clinically supported<\/p><\/li>\n<li><p>The Ruth-Naomi model as therapeutic mentoring: Naomi’s role in Ruth’s life parallels the therapeutic concept of the ‘reparative relationship’ — a consistent, wise, boundaried, caring presence that demonstrates what healthy relationship looks like<\/p><\/li>\n<li><p>Support groups as healing community: Irvin Yalom’s therapeutic factors in group therapy include universality (you are not alone), instillation of hope, altruism, and the corrective recapitulation of the family of origin — all of which Walker’s remediation implicitly points toward<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker recommends Board-Certified Psychologists, Certified Family Counselors, and degreed Pastoral Counselors as primary resources for vacuum healing. How do you navigate the pastoral responsibility of referral in a cultural context where seeking professional help is still stigmatized?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>The Ruth-Naomi relationship is presented as a model of mentoring, not competition. What structures can the church create to replicate this dynamic for women (and men) who carry the vacuum of missing parental figures?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker addresses boys specifically: the son needs the father as a genetic mirror, a purpose-speaker, and a wisdom-passer. What is the church’s responsibility to fatherless boys in your community? What are you personally doing or can do to be a ‘Naomi’ or a ‘biology teacher’ for someone in your context?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker writes that his own children experienced the vacuum he imposed, and he apologizes for not knowing how to father differently. How do you help someone do the work of acknowledging harm they caused others — especially to their own children — without it collapsing into shame and hopelessness?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker’s remediation explicitly acknowledges that ‘there is no cookie-cutter process.’ How do you build individualized care plans in pastoral counseling that honor the uniqueness of each person’s vacuum while drawing on shared frameworks and resources?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u12": {"title": "Unit 12: Family, Friendship, and Breaking Generational Curses", "group": "p2", "html": "<p><em>The Family, Friends, and Final Thoughts — Three Strands Not Easily Broken<\/em><\/p>\n<p>Walker’s final sections address the family as a three-stranded cord — individual, community, and God — that when maintained, resists the vacuum’s destructive pull. He examines how friendships are both vulnerable to and healing for the vacuum effect, how the family must protect its most vulnerable members, and how the generational curse can finally be broken through forgiveness, accountability, and faith.<\/p>\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor working with families and friendship systems must operate as a systems thinker. The vacuum never affects only one person; it reverberates through families and social networks. Walker’s three-strand framework (Ecclesiastes 4) gives the pastoral counselor a structural image for healthy family and community: no one survives the vacuum alone.<\/p>\n<p>Pastoral approaches:<\/p>\n<ul>\n<li><p>Use Solomon’s three-strand rope (Ecclesiastes 4) as a pastoral framework for assessing the support systems of people in your care: Who are their one, two, and three strands?<\/p><\/li>\n<li><p>Address the church’s role as chosen family for those whose biological family is the source of the vacuum rather than the solution<\/p><\/li>\n<li><p>Teach discernment in friendship: not every person who enters the vacuum is sent to help; Walker’s teaching on ‘fruits’ (Matthew 7:15-20) is a pastoral friendship framework<\/p><\/li>\n<li><p>Make forgiveness the ultimate pastoral destination in generational curse work: forgiveness is not excusing the wrong but releasing the wound’s power over the present<\/p><\/li>\n<li><p>Equip families to tell their testimonies: testimony is the biblical mechanism for breaking generational silence and establishing a new family narrative<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “A three-stranded rope isn’t easily snapped.” — Ecclesiastes 4:12 (MSG)<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The family and friendship sections of Walker’s book represent a systems theory perspective: the vacuum does not operate in isolation but within relational systems that either amplify or absorb its impact. Family systems therapy, attachment network theory, and the psychology of forgiveness all intersect here.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Family Systems Theory (Bowen): Differentiation of self within the family system is the therapeutic goal — the capacity to remain oneself in the face of the family’s emotional process. Walker’s call to break the generational curse requires this kind of self-differentiation<\/p><\/li>\n<li><p>Yalom’s corrective recapitulation of the family of origin: In group therapy, members experience healthier relational dynamics than in their families of origin. The church community can function as this corrective family environment for those whose biological families perpetuated the vacuum<\/p><\/li>\n<li><p>Psychology of forgiveness (Worthington, Enright): Forgiveness research shows that choosing to forgive — not for the offender’s benefit but for one’s own healing — reduces anxiety, depression, and anger and promotes physical health. Walker’s ‘forgiveness is for your good’ is clinically supported<\/p><\/li>\n<li><p>Friendship and social support as mental health protective factors: Robust research shows that high-quality social support is one of the strongest protective factors against PTSD, depression, and anxiety. Walker’s ‘million little things’ of friendship (Paulo Coelho) is clinically captured in attachment network research<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker presents the family as a three-stranded cord — individual, community, and God. In your pastoral or counseling context, which of these strands is most often missing or weakened? What practical steps can the church take to strengthen the weakest strand?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker addresses the topic of LGBTQ+ family members with a call to love and empathy, acknowledging that their experience may be rooted in the vacuum effect. How do you navigate this pastorally in a way that honors both the person’s dignity and your theological framework?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker says that friendship is tested in the worst moments. In your experience — personally or clinically — what distinguishes friendships that survive the vacuum test from those that do not? What does that survival look like, and how can it be cultivated?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>The final chapter is Walker’s most personal — a full account of his own vacuum, its consequences, and his path toward forgiveness and healing. How does the pastoral counselor or Biblical integrated psychologist use self-disclosure appropriately to facilitate healing without shifting the focus from the counselee to themselves?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker closes with the Serenity Prayer and Jeremiah 29:11. As a practitioner, what is your personal integration of pastoral calling, psychological training, and lived experience in the work of helping others survive their shift? What have you learned about your own vacuum in this curriculum?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-appendix": {"title": "Appendix: Key Scriptures & Resources", "group": "p2", "html": "<h3 id=\"key-scriptures-referenced-in-this-curriculum\">Key Scriptures Referenced in This Curriculum<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Scripture<\/strong><\/th>\n<th><strong>Theme<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Matthew 7:7-8<\/strong><\/td>\n<td>Ask, Seek, Knock — Free Space &amp; The Acceptable Time<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>James 1:19-20<\/strong><\/td>\n<td>Quick to hear, slow to speak, slow to anger — Surviving bad situations<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>1 Peter 3:3-4<\/strong><\/td>\n<td>The incorruptible heart — The Deceitful Heart<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Romans 12:1-2<\/strong><\/td>\n<td>Renewing the mind — Identity<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>2 Corinthians 10:3-5<\/strong><\/td>\n<td>Taking every thought captive — Identity &amp; Time<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Mark 12:30-31<\/strong><\/td>\n<td>Love God and neighbor — The Vacuum of Love<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>1 Corinthians 13:4-7<\/strong><\/td>\n<td>The nature of true love — The Vacuum of Love<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Galatians 5:22-23<\/strong><\/td>\n<td>Fruit of the Spirit — The Vacuum of Joy<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Proverbs 19:21<\/strong><\/td>\n<td>God’s counsel stands — The Vacuum of Purpose<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Jeremiah 29:11<\/strong><\/td>\n<td>Plans for a future and a hope — Purpose, Time, Faith<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Luke 2:11-12<\/strong><\/td>\n<td>Swaddled in security — Swaddling &amp; Attachment<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Psalm 27:13-14<\/strong><\/td>\n<td>Wait on the Lord — Time &amp; Faith<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Hebrews 11:6<\/strong><\/td>\n<td>Without faith it is impossible — The Spiritual Vacuum<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2 Corinthians 4:8-10<\/strong><\/td>\n<td>Hard pressed but not crushed — Faith<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ruth 1:16-17<\/strong><\/td>\n<td>Wherever you go I will go — Remediation for Women<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Proverbs 4:1-6<\/strong><\/td>\n<td>Father’s instruction to son — Remediation for Men<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Ecclesiastes 4:12<\/strong><\/td>\n<td>Three-stranded cord — Family &amp; Friendship<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"recommended-resources\">Recommended Resources<\/h3>\n<p>Clinical &amp; Academic References cited in The Vacuum Effect:<\/p>\n<ul>\n<li><p>Wright, N. H. (2011). The Complete Guide to Crisis &amp; Trauma Counseling. Bethany House.<\/p><\/li>\n<li><p>Collins, G. R. (2007). Christian Counseling: A Comprehensive Guide (3rd ed.). Thomas Nelson.<\/p><\/li>\n<li><p>Johnson, B. W. &amp; Johnson, W. L. (2014). The Minister’s Guide to Psychological Disorders and Treatments. Routledge.<\/p><\/li>\n<li><p>Wilson, S. P. (2001). Hurt People, Hurt People: Hope and Healing for Yourself and Your Relationship. Discovery House.<\/p><\/li>\n<li><p>Floyd, S. (2008). Crisis Counseling: A Guide for Pastors and Professionals. Kregel Academic.<\/p><\/li>\n<li><p>Burland, J. (1994). Splitting as a Consequence of Severe Abuse in Childhood. Psychiatr Clin North Am.<\/p><\/li>\n<\/ul>\n<p>Additional Recommended Reading for Practitioners:<\/p>\n<ul>\n<li><p>Pettit, P. (2008). Foundations of Spiritual Formation. Kregel Academic.<\/p><\/li>\n<li><p>Kelly, K. K., Garbacz, S. A., &amp; Albers, C. A. (2020). Theories of School Psychology. Routledge.<\/p><\/li>\n<\/ul>\n<p><em>Curriculum prepared based on: The Vacuum Effect: Surviving the Shift When It Happens by Thomas E. Walker © 2022<\/em><\/p>\n<p><em>For educational and ministerial use | Reflections of Grace Outreach Ministries, Moreno Valley, CA<\/em><\/p>\n", "track": false}, "p3-overview": {"title": "Counseling Training Program Overview", "group": "p3", "html": "<p>This training program integrates evidence-based therapeutic practice with biblical principles, Christian theology, and spiritual formation to equip counselors for whole-person care. Students engage five progressive modules across fifteen weeks, combining video instruction, readings, clinical practicum, reflective journaling, and graded assessments.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>#<\/strong><\/th>\n<th><strong>Module Title<\/strong><\/th>\n<th><strong>Weeks<\/strong><\/th>\n<th><strong>Lessons<\/strong><\/th>\n<th><strong>Key Focus<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>01<\/strong><\/td>\n<td><strong>Foundations of Integrated Christian Counseling<\/strong><\/td>\n<td>3 Weeks<\/td>\n<td>6<\/td>\n<td>Theology, Psychology, and the Counseling Call<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>02<\/strong><\/td>\n<td><strong>Psychological Theory Through a Biblical Lens<\/strong><\/td>\n<td>3 Weeks<\/td>\n<td>6<\/td>\n<td>Engaging Major Therapeutic Frameworks with Scripture<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>03<\/strong><\/td>\n<td><strong>Spiritual Formation and the Therapeutic Process<\/strong><\/td>\n<td>3 Weeks<\/td>\n<td>6<\/td>\n<td>Prayer, Spiritual Disciplines, and Soul Care in Session<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>04<\/strong><\/td>\n<td><strong>Trauma, Grief, and Redemptive Suffering<\/strong><\/td>\n<td>3 Weeks<\/td>\n<td>6<\/td>\n<td>Healing the Whole Person After Pain and Loss<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>05<\/strong><\/td>\n<td><strong>Specialized Populations and Practicum Integration<\/strong><\/td>\n<td>3 Weeks<\/td>\n<td>6<\/td>\n<td>Applying Integrated Counseling Across Diverse Contexts<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": false}, "p3-assessment": {"title": "Assessment Framework, Rubric & Grading", "group": "p3", "html": "<p>All assessments in this program are evaluated using a consistent rubric that emphasizes the integration of theological depth, clinical competence, cultural sensitivity, reflective practice, and scholarly communication. The grading scale below applies to all modules.<\/p>\n<h3 id=\"master-grading-rubric\">Master Grading Rubric<\/h3>\n<p>The following rubric applies to all written assignments, case studies, and practicum submissions:<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Criterion<\/strong><\/th>\n<th><strong>Excellent (90–100%)<\/strong><\/th>\n<th><strong>Proficient (75–89%)<\/strong><\/th>\n<th><strong>Developing (60–74%)<\/strong><\/th>\n<th><strong>Beginning (&lt;60%)<\/strong><\/th>\n<th><strong>Weight<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Theological Integration<\/strong><\/td>\n<td>Seamlessly weaves biblical principles with clinical concepts; cites Scripture accurately and contextually<\/td>\n<td>Solid integration of theology and psychology with minor gaps in depth or accuracy<\/td>\n<td>Some attempt at integration; theology or psychology treated separately at times<\/td>\n<td>Little to no meaningful integration; one dimension largely absent<\/td>\n<td><strong>25%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Clinical Application<\/strong><\/td>\n<td>Demonstrates nuanced, evidence-based clinical reasoning; treatment recommendations are specific and appropriate<\/td>\n<td>Sound clinical reasoning with appropriate interventions; some detail lacking<\/td>\n<td>Basic clinical concepts present but reasoning incomplete or inconsistent<\/td>\n<td>Clinical application is missing, inaccurate, or inappropriate<\/td>\n<td><strong>25%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Cultural &amp; Ethical Sensitivity<\/strong><\/td>\n<td>Proactively addresses cultural, ethical, and diversity considerations; applies AACC/ACA codes accurately<\/td>\n<td>Addresses ethical considerations competently; some cultural nuance absent<\/td>\n<td>Acknowledges ethics and culture with minimal depth or some inaccuracies<\/td>\n<td>Ethical or cultural considerations largely ignored or mishandled<\/td>\n<td><strong>20%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Reflective Practice<\/strong><\/td>\n<td>Deep self-awareness; honestly examines countertransference, limits, and spiritual formation journey<\/td>\n<td>Good self-reflection with some depth; countertransference acknowledged<\/td>\n<td>Surface-level reflection; minimal engagement with personal biases or growth areas<\/td>\n<td>Little to no reflective content; primarily descriptive or superficial<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Scholarly Communication<\/strong><\/td>\n<td>Clear, well-organized writing; uses current APA/Turabian correctly; sources are peer-reviewed and credible<\/td>\n<td>Generally clear writing; minor APA errors; mostly credible sources<\/td>\n<td>Writing lacks clarity or organization; citation errors; some weak sources<\/td>\n<td>Poor organization and mechanics; minimal or missing citations<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"grading-scale\">Grading Scale<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Letter Grade<\/strong><\/th>\n<th><strong>Percentage<\/strong><\/th>\n<th><strong>GPA Points<\/strong><\/th>\n<th><strong>Descriptor<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>A<\/strong><\/td>\n<td><strong>93–100%<\/strong><\/td>\n<td><strong>4.0<\/strong><\/td>\n<td><strong>Exemplary — Professional, integrative excellence<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A-<\/td>\n<td>90–92%<\/td>\n<td>3.7<\/td>\n<td>Outstanding — Strong integration with minor areas to develop<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>B+<\/td>\n<td>87–89%<\/td>\n<td>3.3<\/td>\n<td>Above Average — Competent with solid integration<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>B<\/td>\n<td>83–86%<\/td>\n<td>3.0<\/td>\n<td>Proficient — Meets all learning outcomes satisfactorily<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>B-<\/td>\n<td>80–82%<\/td>\n<td>2.7<\/td>\n<td>Satisfactory — Most outcomes met; some gaps remain<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C+<\/td>\n<td>77–79%<\/td>\n<td>2.3<\/td>\n<td>Developing — Partial integration; additional support recommended<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>C<\/td>\n<td>73–76%<\/td>\n<td>2.0<\/td>\n<td>Minimal Pass — Basic competencies only; remediation may be required<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>F<\/td>\n<td>Below 73%<\/td>\n<td>0.0<\/td>\n<td>Not Passing — Learning outcomes not demonstrated<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"assessment-policies\">Assessment Policies<\/h3>\n<ul>\n<li><p>Late submissions: 10% deducted per day unless prior extension is granted by instructor.<\/p><\/li>\n<li><p>All written work must be submitted via the course learning management system (LMS) in .docx or .pdf format.<\/p><\/li>\n<li><p>Plagiarism — including AI-generated content submitted as original work — will result in a zero grade and possible program removal.<\/p><\/li>\n<li><p>Students must earn at least 75% in each module to progress to the next module.<\/p><\/li>\n<li><p>The capstone integration paper in Module 5 must receive a grade of Proficient or above to receive the completion letter.<\/p><\/li>\n<\/ul>\n", "track": false}, "p3-m1": {"title": "Module 01 — Foundations of Integrated Christian Counseling", "group": "p3", "html": "<p><em>Theology, Psychology, and the Counseling Call<\/em><\/p>\n<p>Duration: 3 Weeks | Lessons: 6<\/p>\n<p>This foundational module establishes the biblical, theological, and philosophical grounding for integrating Christian faith with professional counseling practice. Students explore major integration models and begin developing their own philosophy of care.<\/p>\n<p><strong>Lessons<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>#<\/strong><\/th>\n<th><strong>Lesson Title<\/strong><\/th>\n<th><strong>Format<\/strong><\/th>\n<th><strong>Duration<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1<\/strong><\/td>\n<td>What Is Integration? Scripture, Psychology, and Personhood<\/td>\n<td>Video Lecture + Reading<\/td>\n<td>90 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2<\/strong><\/td>\n<td>A Brief History of Christian Counseling Movements<\/td>\n<td>Video Lecture<\/td>\n<td>75 min<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>3<\/strong><\/td>\n<td>The Counselor's Identity: Vocation, Calling, and Self-Care<\/td>\n<td>Reflective Journal<\/td>\n<td>60 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>4<\/strong><\/td>\n<td>Ethics and Boundaries in Faith-Based Counseling<\/td>\n<td>Case Study + Discussion<\/td>\n<td>90 min<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>5<\/strong><\/td>\n<td>The Bio-Psycho-Social-Spiritual (BPSS) Model<\/td>\n<td>Video Lecture + Quiz<\/td>\n<td>75 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>6<\/strong><\/td>\n<td>Philosophy of Counseling: Developing Your Own Framework<\/td>\n<td>Written Assignment<\/td>\n<td>4–6 hrs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson Topics and Content<\/strong><\/p>\n<h3 id=\"lesson-1-what-is-integration-scripture-psychology-and-personhood\">Lesson 1: What Is Integration? Scripture, Psychology, and Personhood<\/h3>\n<p><em>Format: Video Lecture + Reading | Duration: 90 min<\/em><\/p>\n<ul>\n<li><p>Defining integration: levels of explanation vs. Christian psychology<\/p><\/li>\n<li><p>Human nature in Scripture: body, soul, spirit (trichotomy/dichotomy)<\/p><\/li>\n<li><p>Imago Dei as foundation for dignity and therapeutic respect<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-2-a-brief-history-of-christian-counseling-movements\">Lesson 2: A Brief History of Christian Counseling Movements<\/h3>\n<p><em>Format: Video Lecture | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Pastoral care through the centuries<\/p><\/li>\n<li><p>The rise of biblical counseling (Jay Adams, CCEF)<\/p><\/li>\n<li><p>Integrationist and Christian psychology movements (Crabb, McMinn, Johnson)<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-3-the-counselors-identity-vocation-calling-and-self-care\">Lesson 3: The Counselor's Identity: Vocation, Calling, and Self-Care<\/h3>\n<p><em>Format: Reflective Journal | Duration: 60 min<\/em><\/p>\n<ul>\n<li><p>Theology of vocation and calling in counseling<\/p><\/li>\n<li><p>Countertransference and spiritual formation<\/p><\/li>\n<li><p>Boundaries, burnout prevention, and the counselor's own soul<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-4-ethics-and-boundaries-in-faith-based-counseling\">Lesson 4: Ethics and Boundaries in Faith-Based Counseling<\/h3>\n<p><em>Format: Case Study + Discussion | Duration: 90 min<\/em><\/p>\n<ul>\n<li><p>ACA/AACC ethical codes in tension and harmony<\/p><\/li>\n<li><p>When faith and professional ethics conflict<\/p><\/li>\n<li><p>Dual relationships in church-based counseling settings<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-5-the-bio-psycho-social-spiritual-bpss-model\">Lesson 5: The Bio-Psycho-Social-Spiritual (BPSS) Model<\/h3>\n<p><em>Format: Video Lecture + Quiz | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Whole-person anthropology for clinical practice<\/p><\/li>\n<li><p>Assessing all four dimensions in intake<\/p><\/li>\n<li><p>Research base for spiritual variables in therapeutic outcomes<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-6-philosophy-of-counseling-developing-your-own-framework\">Lesson 6: Philosophy of Counseling: Developing Your Own Framework<\/h3>\n<p><em>Format: Written Assignment | Duration: 4–6 hrs<\/em><\/p>\n<ul>\n<li><p>Personal integration statement (graded essay)<\/p><\/li>\n<li><p>Peer review and instructor feedback<\/p><\/li>\n<li><p>Theological reflection on suffering, healing, and shalom<\/p><\/li>\n<\/ul>\n<h3 id=\"learning-outcomes\">Learning Outcomes<\/h3>\n<ul>\n<li><p>Articulate a coherent theology of counseling and human nature<\/p><\/li>\n<li><p>Distinguish major integration models (Levels of Explanation, Christian Psychology, Transformational Psychology)<\/p><\/li>\n<li><p>Identify personal values, biases, and potential countertransference in faith contexts<\/p><\/li>\n<li><p>Apply the BPSS model in holistic case conceptualization<\/p><\/li>\n<\/ul>\n<h3 id=\"module-assessments\">Module Assessments<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Assessment Task<\/strong><\/th>\n<th><strong>Weight<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Personal Integration Statement Essay<\/td>\n<td><strong>30%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ethics Case Study Analysis<\/td>\n<td><strong>25%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BPSS Assessment Practice<\/td>\n<td><strong>25%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Discussion Forum Participation<\/td>\n<td><strong>20%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p3-m2": {"title": "Module 02 — Psychological Theory Through a Biblical Lens", "group": "p3", "html": "<p><em>Engaging Major Therapeutic Frameworks with Scripture<\/em><\/p>\n<p>Duration: 3 Weeks | Lessons: 6<\/p>\n<p>Students engage five major therapeutic frameworks — cognitive-behavioral, attachment, psychodynamic, humanistic, and narrative — and critically evaluate each through theological and biblical lenses, learning to apply adapted techniques in clinical practice.<\/p>\n<p><strong> >When Scripture heals and when it harms<\/p><\/li>\n<li><p>Lament psalms, Wisdom literature, and epistles in session<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-4-spiritual-disciplines-as-therapeutic-interventions\">Lesson 4: Spiritual Disciplines as Therapeutic Interventions<\/h3>\n<p><em>Format: Video Lecture | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Contemplative prayer and mindfulness: comparison and integration<\/p><\/li>\n<li><p>Fasting, solitude, and Sabbath as clinical tools<\/p><\/li>\n<li><p>Spiritual direction as parallel and complementary practice<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-5-spiritual-warfare-evil-and-psychological-distress\">Lesson 5: Spiritual Warfare, Evil, and Psychological Distress<\/h3>\n<p><em>Format: Video + Discussion | Duration: 60 min<\/em><\/p>\n<ul>\n<li><p>Theology of spiritual warfare and demonic influence<\/p><\/li>\n<li><p>Differential diagnosis: spiritual crisis vs. mental illness<\/p><\/li>\n<li><p>Clinical response to spiritual oppression concerns<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-6-supervised-spiritual-assessment-practicum\">Lesson 6: Supervised Spiritual Assessment Practicum<\/h3>\n<p><em>Format: Practicum Assignment | Duration: 4–6 hrs<\/em><\/p>\n<ul>\n<li><p>Complete a full spiritual intake with a practice client (or peer)<\/p><\/li>\n<li><p>Written reflection on integration challenges encountered<\/p><\/li>\n<li><p>Supervisor feedback session (30 min)<\/p><\/li>\n<\/ul>\n<h3 id=\"learning-outcomes\">Learning Outcomes<\/h3>\n<ul>\n<li><p>Conduct a holistic spiritual assessment alongside clinical intake<\/p><\/li>\n<li><p>Navigate the ethics and clinical utility of prayer and Scripture in session<\/p><\/li>\n<li><p>Distinguish spiritually-informed counseling from pastoral ministry<\/p><\/li>\n<li><p>Adapt spiritual disciplines as evidence-sensitive therapeutic interventions<\/p><\/li>\n<\/ul>\n<h3 id=\"module-assessments\">Module Assessments<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Assessment Task<\/strong + Practicum<\/td>\n<td>90 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>6<\/strong><\/td>\n<td>Grief Group Design and Facilitation<\/td>\n<td>Group Project<\/td>\n<td>5–7 hrs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson Topics and Content<\/strong><\/p>\n<h3 id=\"lesson-1-trauma-informed-care-and-the-theology-of-suffering\">Lesson 1: Trauma-Informed Care and the Theology of Suffering<\/h3>\n<p><em>Format: Video Lecture | Duration: 90 min<\/em><\/p>\n<ul>\n<li><p>ACEs research and complex trauma (van der Kolk, Bessel)<\/p><\/li>\n<li><p>Why does God allow suffering? Key theodicy frameworks<\/p><\/li>\n<li><p>Integrating trauma theory with doctrines of providence and redemption<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-2-lament-as-a-clinical-and-spiritual-practice\">Lesson 2: Lament as a Clinical and Spiritual Practice<\/h3>\n<p><em>Format: Video + Journaling | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>The Psalms of lament: structure and therapeutic function<\/p><\/li>\n<li><p>Giving clients permission to grieve and protest<\/p><\/li>\n<li><p>Lament as a path toward trust, not away from it<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-3-grief-loss-and-the-hope-of-resurrection\">Lesson 3: Grief, Loss, and the Hope of Resurrection<\/h3>\n<p><em>Format: Case Study + Discussion | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Worden's tasks of mourning in a Christian context<\/p><\/li>\n<li><p>Complicated grief and spiritual desolation<\/p><\/li>\n<li><p>Resurrection hope as therapeutic anchor, not spiritual bypass<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-4-post-traumatic-growth-and-spiritual-transformation\">Lesson 4: Post-Traumatic Growth and Spiritual Transformation<\/h3>\n<p><em>Format: Video Lecture | Duration: 60 min<\/em><\/p>\n<ul>\n<li><p>Tedeschi and Calhoun's PTG framework<\/p><\/li>\n<li><p>Sanctification, cruciformity, and redemptive suffering (Rom 8:28)<\/p><\/li>\n<li><p>Supporting growth without minimizing pain<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-5-embodiment-somatic-healing-and-the-resurrection-body\">Lesson 5: Embodiment, Somatic Healing, and the Resurrection Body<\/h3>\n<p><em>Format: Video + Practicum | Duration: 90 min<\/em><\/p>\n<ul>\n<li><p>Somatic experiencing and body-based trauma approaches<\/p><\/li>\n<li><p>Christian theology of embodiment and the resurrection body<\/p><\/li>\n<li><p>Grounding, breath prayer, and mindful movement in session<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-6-grief-group-design-and-facilitation\">Lesson 6: Grief Group Design and Facilitation<\/h3>\n<p><em>Format: Group Project | Duration: 5–7 hrs<\/em><\/p>\n<ul>\n<li><p>Design a 6-session Christian grief support group<\/p><\/li>\n<li><p>Integrate clinical and spiritual content<\/p><\/li>\n<li><p>Present proposal to supervisor for feedback<\/p><\/li>\n<\/ul>\n<h3 id=\"learning-outcomes\">Learning Outcomes<\/h3>\n<ul>\n<li><p>Apply trauma-informed care principles within a Christian theological framework<\/p><\/li>\n<li><p>Guide clients in lament and grief using Psalms, theology, and evidence-based techniques<\/p><\/li>\n<li><p>Support post-traumatic growth as consonant with sanctification and resilience<\/p><\/li>\n<li><p>Utilize somatic and embodied approaches to trauma healing<\/p><\/li>\n<\/ul>\n<h3 id=\"module-assessments\">Module Assessments<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Assessment Task<\/strong><\/th>\n<th><strong>Weight<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Grief Group Curriculum Design<\/td>\n<td><strong>35%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Trauma Case Conceptualization<\/td>\n<td><strong>30%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lament Psalm Reflection Essay<\/td>\n<td><strong>20%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Discussion Forum<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p3-m5": {"title": "Module 05 — Specialized Populations and Practicum Integration", "group": "p3", "html": "<p><em>Applying Integrated Counseling Across Diverse Contexts<\/em><\/p>\n<p>Duration: 3 Weeks | Lessons: 6<\/p>\n<p>The capstone module applies integrated Christian counseling to specialized contexts: couples, families, children, clergy, and cross-cultural settings. Students complete a supervised case presentation and integration paper that synthesizes all five modules.<\/p>\n<p><strong>Lessons<\/strong><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>#<\/strong><\/th>\n<th><strong>Lesson Title<\/strong><\/th>\n<th><strong>Format<\/strong><\/th>\n<th><strong>Duration<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>1<\/strong><\/td>\n<td>Marriage and Family Counseling from a Covenant Perspective<\/td>\n<td>Video + Case Study<\/td>\n<td>90 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>2<\/strong><\/td>\n<td>Counseling Children and Adolescents in Church Contexts<\/td>\n<td>Video Lecture<\/td>\n<td>75 min<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>3<\/strong><\/td>\n<td>Pastoral Burnout, Clergy Care, and Ministry Stress<\/td>\n<td>Reading + Discussion<\/td>\n<td>60 min<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>4<\/strong><\/td>\n<td>Cultural Competency and the Global Church<\/td>\n<td>Video + Reflection<\/td>\n<td>75 min<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>5<\/strong><\/td>\n<td>Capstone: Supervised Case Presentation<\/td>\n<td>Practicum (Assessed)<\/td>\n<td>6–8 hrs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>6<\/strong><\/td>\n<td>Completion Letter Reflection and Next Steps<\/td>\n<td>Celebratory Webinar<\/td>\n<td>60 min<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lesson Topics and Content<\/strong><\/p>\n<h3 id=\"lesson-1-marriage-and-family-counseling-from-a-covenant-perspective\">Lesson 1: Marriage and Family Counseling from a Covenant Perspective<\/h3>\n<p><em>Format: Video + Case Study | Duration: 90 min<\/em><\/p>\n<ul>\n<li><p>Covenant theology applied to marital therapy<\/p><\/li>\n<li><p>EFT (Emotionally Focused Therapy) and trinitarian relational model<\/p><\/li>\n<li><p>Premarital counseling and marriage enrichment in the church<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-2-counseling-children-and-adolescents-in-church-contexts\">Lesson 2: Counseling Children and Adolescents in Church Contexts<\/h3>\n<p><em>Format: Video Lecture | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Developmental faith and identity formation (Fowler's stages)<\/p><\/li>\n<li><p>Play therapy techniques with Christian themes<\/p><\/li>\n<li><p>Mandated reporting and child protection in faith settings<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-3-pastoral-burnout-clergy-care-and-ministry-stress\">Lesson 3: Pastoral Burnout, Clergy Care, and Ministry Stress<\/h3>\n<p><em>Format: Reading + Discussion | Duration: 60 min<\/em><\/p>\n<ul>\n<li><p>Unique stressors and vulnerabilities of clergy<\/p><\/li>\n<li><p>Ministry family systems and secondary trauma<\/p><\/li>\n<li><p>Designing care structures for pastoral wellbeing<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-4-cultural-competency-and-the-global-church\">Lesson 4: Cultural Competency and the Global Church<\/h3>\n<p><em>Format: Video + Reflection | Duration: 75 min<\/em><\/p>\n<ul>\n<li><p>Cultural humility vs. cultural competency<\/p><\/li>\n<li><p>Collectivist vs. individualist frameworks and biblical anthropology<\/p><\/li>\n<li><p>Serving multicultural congregations and diaspora communities<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-5-capstone-supervised-case-presentation\">Lesson 5: Capstone: Supervised Case Presentation<\/h3>\n<p><em>Format: Practicum (Assessed) | Duration: 6–8 hrs<\/em><\/p>\n<ul>\n<li><p>Prepare a de-identified case using all 5 modules' frameworks<\/p><\/li>\n<li><p>15-minute live presentation to supervisor and peers<\/p><\/li>\n<li><p>Written integration paper (2,500–3,500 words)<\/p><\/li>\n<\/ul>\n<h3 id=\"lesson-6-completion letter-reflection-and-next-steps\">Lesson 6: Completion Letter Reflection and Next Steps<\/h3>\n<p><em>Format: Celebratory Webinar | Duration: 60 min<\/em><\/p>\n<ul>\n<li><p>Program synthesis and personal growth review<\/p><\/li>\n<li><p>Pathways to licensure, supervision, and credentialing<\/p><\/li>\n<li><p>Building a sustainable integrated Christian counseling practice<\/p><\/li>\n<\/ul>\n<h3 id=\"learning-outcomes\">Learning Outcomes<\/h3>\n<ul>\n<li><p>Adapt integrated approaches for couples, families, children, and clergy populations<\/p><\/li>\n<li><p>Demonstrate cultural humility and responsiveness within a Christian counseling context<\/p><\/li>\n<li><p>Present a supervised case using all five modules' integrated frameworks<\/p><\/li>\n<li><p>Articulate a personal model of integrated Christian counseling for professional practice<\/p><\/li>\n<\/ul>\n<h3 id=\"module-assessments\">Module Assessments<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Assessment Task<\/strong><\/th>\n<th><strong>Weight<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Capstone Case Presentation<\/td>\n<td><strong>35%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Integration Paper<\/td>\n<td><strong>35%<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cultural Reflection Paper<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Participation<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p3-reading": {"title": "Reading List, Databases & Completion Requirements", "group": "p3", "html": "<p>The following resources are organized by module theme. Core texts are required; supplemental resources are recommended for further study. All journal articles are available through institutional library databases or open-access repositories.<\/p>\n<h3 id=\"foundational-integration\">Foundational Integration<\/h3>\n<ul>\n<li><p>Johnson, E. L. (Ed.). (2010). Psychology and Christianity: Five Views. IVP Academic.<\/p><\/li>\n<li><p>McMinn, M. R. (2011). Psychology, Theology, and Spirituality in Christian Counse
