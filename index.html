hurch's failures and hopeful about reconciliation; writing is compelling and Spirit-led<\/td>\n<td>Good personal reflection; some prophetic edge; mostly balanced and constructive<\/td>\n<td>Primarily academic; limited personal voice; reflection feels obligatory<\/td>\n<td>No personal engagement; formulaic or detached from the phase's urgent pastoral concern<\/td>\n<td><strong>15%<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": false}, "p6-anchors": {"title": "Biblical & Theological Research Anchors", "group": "p6", "html": "<p>The following scriptural passages form the theological backbone of Phase VI. Each passage is connected to specific lessons and counseling applications, following Walker's integrative approach in the primary text.<\/p>\n<p><strong>Proverbs 22:6 NKJV — Lessons: L1, L4<\/strong><\/p>\n<p><em>\"Train up a child in the way he should go, and when he is old he will not depart from it.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Foundational text for generational faith transmission; Gen X's departure represents a break in this chain across three generations.<\/em><\/p>\n<p><strong>Ephesians 6:12 NKJV — Lessons: L3, L4<\/strong><\/p>\n<p><em>\"For we do not wrestle against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this age, against spiritual hosts of wickedness in the heavenly places.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Walker's primary theological lens for understanding cultural and spiritual forces that drove Gen X from the Church.<\/em><\/p>\n<p><strong>Judges 2:10 NKJV — Lessons: L4<\/strong><\/p>\n<p><em>\"Another generation arose after them who did not know the LORD nor the work which He had done for Israel.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Closest biblical parallel to Walker's central thesis: the Millennial/Gen Z generation as those who 'did not know the LORD' because the connection was severed.<\/em><\/p>\n<p><strong>Deuteronomy 6:4–9 NKJV — Lessons: L1, L4, L6<\/strong><\/p>\n<p><em>\"You shall teach them diligently to your children, and shall talk of them when you sit in your house, when you walk by the way, when you lie down, and when you rise up.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>The Shema: God's design for intergenerational faith transmission. Gen X's failure to teach this to their children is the pastoral wound this phase addresses.<\/em><\/p>\n<p><strong>1 Timothy 4:1–3 NKJV — Lessons: L2, L3<\/strong><\/p>\n<p><em>\"Now the Spirit expressly says that in latter times some will depart from the faith, giving heed to deceiving spirits and doctrines of demons.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Walker's chapter epigraph for 'Spirits Turned Loose.' Connects the historical falling away to eschatological biblical warning.<\/em><\/p>\n<p><strong>Romans 12:1–2 NASB — Lessons: L2, L5<\/strong><\/p>\n<p><em>\"Present your bodies as a living and holy sacrifice, acceptable to God... and do not be conformed to this world, but be transformed by the renewing of your mind.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Used by Walker to contrast the Charismatic Movement's call for submission to leaders versus the true call to surrender to God.<\/em><\/p>\n<p><strong>Galatians 5:19–23 NKJV — Lessons: L3, L5<\/strong><\/p>\n<p><em>\"The works of the flesh are: adultery, fornication, uncleanness, lasciviousness, idolatry, witchcraft... But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, meekness, temperance.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Paul's diagnostic framework for the works-of-flesh principalities that captivated Gen X; fruits of the Spirit as the counselor's goal for restored clients.<\/em><\/p>\n<p><strong>Isaiah 5:20 KJV — Lessons: L3, L4<\/strong><\/p>\n<p><em>\"Woe unto them that call evil good, and good evil; that put darkness for light, and light for darkness; that put bitter for sweet, and sweet for bitter!\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Walker cites this text — via John MacArthur's 2024 sermon — as the defining biblical description of the post-Gen X cultural moment in 2025.<\/em><\/p>\n<p><strong>Matthew 22:36–40 CEB — Lessons: L5, L6<\/strong><\/p>\n<p><em>\"You must love the Lord your God with all your heart, with all your being, and with all your mind... You must love your neighbor as you love yourself.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>The Great Commandment as the counseling mandate. Walker uses Agape Love as the relational foundation Gen X lacked and now needs to offer post-Gen X generations.<\/em><\/p>\n<p><strong>John 14:26 NKJV — Lessons: L5<\/strong><\/p>\n<p><em>\"The Helper, the Holy Spirit, whom the Father will send in My name, He will teach you all things, and bring to your remembrance all things that I said to you.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Key pastoral-clinical text: even for those who have left the Church, the Holy Spirit continues to bring the Word to remembrance. This is the hope Walker offers.<\/em><\/p>\n<p><strong>Ephesians 2:8–9 NIV — Lessons: L5, L6<\/strong><\/p>\n<p><em>\"For it is by grace you have been saved, through faith — and this is not from yourselves, it is the gift of God — not by works, so that no one can boast.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>Walker's counter to the Shepherding doctrine that leaving the Church = losing salvation. Salvation is by grace through faith, not through institutional submission.<\/em><\/p>\n<p><strong>Matthew 28:19–20 NKJV — Lessons: L6<\/strong><\/p>\n<p><em>\"Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all things that I have commanded you.\"<\/em><\/p>\n<p><strong>▶ Counseling application:<\/strong> <em>The Great Commission: the counselor's and minister's mandate to reengage disaffiliated generations with the Gospel through counseling, witness, and community.<\/em><\/p>\n", "track": false}, "p6-resources": {"title": "References, Media & Forum Prompts", "group": "p6", "html": "<h3 id=\"extra-biblical-and-scholarly-research-references\">Extra-Biblical and Scholarly Research References<\/h3>\n<p>The following scholarly, sociological, and journalistic sources ground the phase's content in verifiable empirical research, situating Walker's theological analysis within the broader academic conversation on religious decline, generational change, and counseling practice.<\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Author / Source<\/strong><\/th>\n<th><strong>Title &amp; Citation<\/strong><\/th>\n<th><strong>Type<\/strong><\/th>\n<th><strong>Module Link<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Walker, T. E. (2025)<\/strong><\/td>\n<td>Generation X Left the Church, Now All Hell Broke Loose. Reflections of Grace Outreach Ministries. ISBN: 978-0-9830162-8-1<\/td>\n<td>Primary Text / Manuscript<\/td>\n<td><strong>All Lessons<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Burge, R. (2021, Aug 30)<\/strong><\/td>\n<td>'OK Millennial: Don't Blame the Boomers for Decline of Religion in America.' Religion News Service.<\/td>\n<td>Journalism / Empirical<\/td>\n<td><strong>L2, L3, L4<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Pew Research Center (2023)<\/strong><\/td>\n<td>'Religious Landscape Study: Nones on the Rise.' pewresearch.org<\/td>\n<td>Sociological Survey<\/td>\n<td><strong>L4, L6<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Kroll, M. M. (2024, Nov 1)<\/strong><\/td>\n<td>'Generation X: The Forgotten Generation — The GEN Xperience.' University of New Hampshire.<\/td>\n<td>Academic Article<\/td>\n<td><strong>L1<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Collins, J. (2018)<\/strong><\/td>\n<td>'The History of Mass Incarceration.' Brennan Center for Justice.<\/td>\n<td>Policy Research<\/td>\n<td><strong>L1, L2<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>West's Encyclopedia of American Law (2026)<\/strong><\/td>\n<td>'Man-in-the-House Rule.' encyclopedia.com<\/td>\n<td>Legal Reference<\/td>\n<td><strong>L1<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Oakley, L. &amp; Kinmond, K. (2013)<\/strong><\/td>\n<td>Breaking the Silence on Spiritual Abuse. Palgrave Macmillan.<\/td>\n<td>Scholarly Book<\/td>\n<td><strong>L2, L5<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Doehring, C. (2015)<\/strong><\/td>\n<td>The Practice of Pastoral Care: A Postmodern Approach (Rev. ed.). Westminster John Knox.<\/td>\n<td>Counseling Text<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Langberg, D. (2015)<\/strong><\/td>\n<td>Suffering and the Heart of God: How Trauma Destroys and Christ Restores. New Growth Press.<\/td>\n<td>Christian Counseling<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>van der Kolk, B. (2014)<\/strong><\/td>\n<td>The Body Keeps the Score. Viking Penguin.<\/td>\n<td>Trauma / Clinical<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Griggs, B. (2018, May 18)<\/strong><\/td>\n<td>'The Most Turbulent Time in Modern American History (It's Not Now).' CNN.com.<\/td>\n<td>Journalism<\/td>\n<td><strong>L1, L2<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>MacArthur, J. (2024, Jun 23)<\/strong><\/td>\n<td>'The Coming Demonic Invasion.' Grace to You (sermon video). gracetoyou.org<\/td>\n<td>Sermon / Video<\/td>\n<td><strong>L3<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Hodgson, R. (2024)<\/strong><\/td>\n<td>'Faith in Flux: Understanding Christianity's Changing Role in American Society.' EEW Magazine Online.<\/td>\n<td>Cultural Analysis<\/td>\n<td><strong>L4<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Tedeschi &amp; Calhoun (2004)<\/strong><\/td>\n<td>Posttraumatic Growth: Conceptual Foundations and Empirical Evidence. Psychological Inquiry, 15(1).<\/td>\n<td>Peer-Reviewed<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Fowler, J. W. (1981)<\/strong><\/td>\n<td>Stages of Faith: The Psychology of Human Development. HarperOne.<\/td>\n<td>Faith Development<\/td>\n<td><strong>L4, L6<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Lefkovitz, A. D. (2011)<\/strong><\/td>\n<td>Men in the House: Race, Welfare, and the Regulation of Men's Sexuality in the U.S., 1961–1972. Journal of the History of Sexuality, 20.<\/td>\n<td>Historical / Peer-Reviewed<\/td>\n<td><strong>L1<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>CDC (2015)<\/strong><\/td>\n<td>QuickStats: Average Age at Death from HIV Disease. MMWR.<\/td>\n<td>Public Health Data<\/td>\n<td><strong>L2<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>CDC (1995)<\/strong><\/td>\n<td>Suicide Among Children, Adolescents, and Young Adults — U.S., 1980–1992. MMWR.<\/td>\n<td>Public Health Data<\/td>\n<td><strong>L2, L3<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"social-media-videos-and-online-discussions-for-course-use\">Social Media Videos and Online Discussions for Course Use<\/h3>\n<p>The following video resources are recommended for classroom screening, discussion forum analysis, or independent student review. They are organized by lesson. YouTube and podcast links should be verified before use as content may be updated. Search by title and creator name.<\/p>\n<p><em>NOTE: Students completing the Lesson 4 Social Media Analysis Assignment should choose 2–3 videos from this list or identify comparable current videos. The analysis should apply Walker's theological framework and integrated counseling theory to evaluate content critically, not simply accept or reject it.<\/em><\/p>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Title / Creator<\/strong><\/th>\n<th><strong>Platform &amp; Description<\/strong><\/th>\n<th><strong>Lesson<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>The Coming Demonic Invasion — John MacArthur (Jun 2024)<\/strong><\/td>\n<td>YouTube / Grace to You. MacArthur's exposition of Isaiah 5:20 and the cultural inversion of good and evil. Walker cites this directly. Use for Lesson 3 theological grounding. Search: 'MacArthur Coming Demonic Invasion 2024'<\/td>\n<td><strong>L3<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Generation X — The Forgotten Generation | Full Documentary<\/strong><\/td>\n<td>YouTube. Multiple documentary-style overviews of Gen X cultural history available. Select one covering 1965–2000 social history. Useful for Lesson 1 introduction. Search: 'Generation X Forgotten Generation documentary'<\/td>\n<td><strong>L1<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Why Millennials Are Leaving the Church — Various Creators<\/strong><\/td>\n<td>YouTube / TikTok. Multiple recent (2022–2025) vlogs and documentary clips of Millennials explaining church departure. Use for Lesson 4 social media analysis exercise. Search: 'why I left the church Millennial TikTok 2024'<\/td>\n<td><strong>L4<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Religious Trauma Syndrome Explained — Dr. Marlene Winell<\/strong><\/td>\n<td>YouTube. Winell's interviews explaining RTS, its symptoms, and counseling approaches. Foundational for Lesson 5 clinical content. Search: 'Marlene Winell religious trauma syndrome'<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The Shepherding Movement: Church History's Cautionary Tale<\/strong><\/td>\n<td>YouTube. Multiple church history educators have covered the Fort Lauderdale Five controversy. Select a theologically balanced presentation. Search: 'Shepherding Movement charismatic history controversy'<\/td>\n<td><strong>L2<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Gen Z and Religion — Pew Research Findings (2023)<\/strong><\/td>\n<td>YouTube / Pew Research official channel. Short-form explainer on Gen Z religious disaffiliation data. Pair with Pew Research 2023 PDF. Search: 'Pew Research Gen Z religion 2023'<\/td>\n<td><strong>L4<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Hip Hop and the Gospel: Then and Now — Various Christian Educators<\/strong><\/td>\n<td>YouTube. Several Christian educators and pastors have explored Gospel music's influence vs. secular Hip Hop. Search: 'Hip Hop Gospel Christianity 1980s culture Gen X'<\/td>\n<td><strong>L3<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Deconstruction TikTok: Inside the Faith Crisis of Gen Z<\/strong><\/td>\n<td>TikTok / YouTube documentary compilations. Multiple journalists and researchers have documented the #Deconstruction movement online. Use for Lesson 4 analysis. Search: 'deconstruction TikTok Gen Z faith YouTube 2023 2024'<\/td>\n<td><strong>L4<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Spiritual Abuse in the Church — Clinical and Pastoral Perspectives<\/strong><\/td>\n<td>YouTube / podcast platforms (e.g., The Place We Find Ourselves, Reclaiming My Theology). Multiple clinical psychologists and theologians address spiritual abuse. Search: 'spiritual abuse church counseling podcast 2023'<\/td>\n<td><strong>L5<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>What Happened to Black Church Attendance — Panel Discussions<\/strong><\/td>\n<td>YouTube. Multiple Black Christian educators, pastors, and sociologists have addressed the decline of Black church attendance post-Gen X. Search: 'Black church decline attendance 2020 2024 panel'<\/td>\n<td><strong>L2, L4<\/strong><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>The War on Drugs and the Black Family — Historical Explainers<\/strong><\/td>\n<td>YouTube. Documentaries and academic explainers on the War on Drugs, mass incarceration, and family disintegration. Search: 'War on Drugs Black family incarceration documentary'<\/td>\n<td><strong>L1, L2<\/strong><\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Pastoral Care for the 'Nones' — Counseling the Unaffiliated<\/strong><\/td>\n<td>YouTube / Seminary channels (Fuller, Asbury, Gordon-Conwell). Faculty lectures and panel discussions on counseling religiously unaffiliated clients. Search: 'counseling nones unaffiliated spiritually wounded seminary'<\/td>\n<td><strong>L5, L6<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"discussion-forum-prompts\">Discussion Forum Prompts<\/h3>\n<p>The following prompts are designed for the phase's asynchronous online discussion forums. Students should post an initial response of 250–350 words and respond substantively to at least two peers.<\/p>\n<p><strong>Lesson 3 Forum: Principalities, Pop Culture, and Spiritual Warfare<\/strong><\/p>\n<p><strong>Forum Prompt 1:<\/strong> Walker argues that hip-hop, heavy metal, internet pornography, and horror movies function as what Ephesians 6:12 calls 'principalities' and 'spiritual hosts of wickedness in the heavenly places.' Do you agree with this analysis? Where does this theological framework strengthen or complicate your clinical practice with clients who consume this media?<\/p>\n<p><strong>Forum Prompt 2:<\/strong> How would you counsel a Gen X client who says, 'I don't go to church anymore, but I'm spiritual. I watch YouTube sermons sometimes and I feel connected to God.' Is this a therapeutic concern, a healthy adaptation, or something in between? Use at least one biblical text and one clinical framework in your response.<\/p>\n<p><strong>Lesson 4 Forum: Severed Roots and Generational Responsibility<\/strong><\/p>\n<p><strong>Forum Prompt 1:<\/strong> Walker states: 'We dropped the ball on our children, the Millennials; we did not teach them the importance of attending church, learning about God, who Jesus is, and how to read and study the Bible.' As an integrated Christian counselor, how would you approach this sense of guilt and grief with a Gen X client who recognizes this failure in their own family?<\/p>\n<p><strong>Forum Prompt 2:<\/strong> Judges 2:10 describes 'another generation who did not know the LORD.' In your view, what is the counselor's role — if any — in the spiritual (re)formation of Millennial and Gen Z clients who have no religious background whatsoever? What are the ethical boundaries of that role?<\/p>\n<p><strong>A Word to the Counselor-Student<\/strong><\/p>\n<p>This phase asks more of you than information retention. Thomas Walker's manuscript is not an academic abstraction — it is a prophetic lament written by a Generation X pastor, counselor, and educator who has watched the spiritual inheritance of his generation dissolve before his eyes. He writes as a witness, and we study it as practitioners who are called to stand in the gap.<\/p>\n<p>As you move through these six lessons, you may encounter your own church wounds, your own grief about the Church's failures, your own questions about faith and institution. Bring those into your reflective journals. Let them inform your empathy. The most effective integrated Christian counselor is one who has wrestled with the very questions their clients carry.<\/p>\n<p><em>\"And we know that all things work together for good to those who love God, to those who are the called according to His purpose.\"<\/em> <strong>— Romans 8:28 NKJV<\/strong><\/p>\n<p>Generation X left the Church. But they did not leave God. And the generations that follow are not beyond reach. This is the counselor's calling — to help each person find their way back to the One who never left.<\/p>\n<p><em>\"Then you will call upon Me and go and pray to Me, and I will listen to you. And you will seek Me and find Me, when you search for Me with all your heart.\"<\/em><\/p>\n<p><strong>— Jeremiah 29:12–13 NKJV<\/strong><\/p>\n", "track": false}}, "nav": [{  11 · Remediation", "track": true, "ext": null}, {"id": "p2-u12", "nav": "Unit 12 · Family, Friendship, and Breaking Generational Curses", "track": true, "ext": null}, {"id": "p2-appendix", "nav": "Key Scriptures & Resources", "track": false, "ext": null}]}, {"id": "p3", "name": "Phase III · Professional Formation", "sub": "ICC Training Program", "items": [{"id": "p3-overview", "nav": "Program Overview", "track": false, "ext": null}, {"id": "p3-assessment", "nav": "Assessment & Grading", "track": false, "ext": null}, {"id": "p3-m1", "nav": "Module 01 · Foundations of Integrated Christian Counseling", "track": true, "ext": null}, {"id": "p3-m2", "nav": "Module 02 · Psychological Theory Through a Biblical Lens", "track": true, "ext": null}, {"id": "p3-m3", "nav": "Module 03 · Spiritual Formation and the Therapeutic Process", "track": true, "ext": null}, {"id": "p3-m4", "nav": "Module 04 · Trauma, Grief, and Redemptive Suffering", "track": true, "ext": null}, {"id": "p3-m5", "nav": "Module 05 · Specialized Populations and Practicum Integration", "track": true, "ext": null}, {"id": "p3-reading", "nav": "Reading List & Requirements", "track": false, "ext": null}]}, {"id": "p4", "name": "Phase IV · Now Is the Time to Believe", "sub": "Inspirational Faith Formation", "items": [{"id": "p4-intro", "nav": "Phase IV Introduction", "track": false, "ext": null}, {"id": "p4-u1", "nav": "Unit 1 · Now Is the Acceptable Time", "track": true, "ext": null}, {"id": "p4-u2", "nav": "Unit 2 · I Lift My Hands", "track": true, "ext": null}, {"id": "p4-u3", "nav": "Unit 3 · I Surrender All", "track": true, "ext": null}, {"id": "p4-u4", "nav": "Unit 4 · Jesus Breaks Every Chain", "track": true, "ext": null}, {"id": "p4-u5", "nav": "Unit 5 · Speak to My Heart, Lord", "track": true, "ext": null}, {"id": "p4-u6", "nav": "Unit 6 · God, Give Me Strength", "track": true, "ext": null}, {"id": "p4-u7", "nav": "Unit 7 · Love Lifted Me", "track": true, "ext": null}, {"id": "p4-u8", "nav": "Unit 8 · So Glad I Made It", "track": true, "ext": null}, {"id": "p4-u9", "nav": "Unit 9 · Love Is the Reason", "track": true, "ext": null}, {"id": "p4-u10", "nav": "Unit 10 · Leading Once You Are Called", "track": true, "ext": null}, {"id": "p4-u11", "nav": "Unit 11 · Standing the Pull", "track": true, "ext": null}, {"id": "p4-u12", "nav": "Unit 12 · Not a Religion, but a Relationship", "track": true, "ext": null}, {"id": "p4-salvation", "nav": "The Salvation Invitation", "track": false, "ext": null}]}, {"id": "p5", "name": "Phase V · The Saga Continues", "sub": "Church Discernment & Holiness", "items": [{"id": "p5-intro", "nav": "Phase V Introduction", "track": false, "ext": null}, {"id": "p5-u1", "nav": "Unit 1 · Denominationalism", "track": true, "ext": null}, {"id": "p5-u2", "nav": "Unit 2 · False Teachings", "track": true, "ext": null}, {"id": "p5-u3", "nav": "Unit 3 · Ungodliness & Paganistic Character", "track": true, "ext": null}, {"id": "p5-u4", "nav": "Unit 4 · Complacency vs. Contentment", "track": true, "ext": null}, {"id": "p5-u5", "nav": "Unit 5 · Entitlement to Sin", "track": true, "ext": null}, {"id": "p5-u6", "nav": "Unit 6 · Self-Pride", "track": true, "ext": null}, {"id": "p5-u7", "nav": "Unit 7 · The Spirit of Witchcraft", "track": true, "ext": null}, {"id": "p5-u8", "nav": "Unit 8 · Fear That Hurts the Church", "track": true, "ext": null}, {"id": "p5-u9", "nav": "Unit 9 · Fear That Fails to Reverence the Spirit", "track": true, "ext": null}, {"id": "p5-final", "nav": "Final Charge · The Church Within", "track": true, "ext": null}]}, {"id": "p6", "name": "Phase VI · Generation X & the Church", "sub": "Generation X Left the Church", "items": [{"id": "p6-intro", "nav": "Phase VI Overview", "track": false, "ext": null}, {"id": "p6-l1", "nav": "Lesson 1 · The Forgotten Generation", "track": true, "ext": null}, {"id": "p6-l2", "nav": "Lesson 2 · The Shifting", "track": true, "ext": null}, {"id": "p6-l3", "nav": "Lesson 3 · Spirits Turned Loose", "track": true, <script type="application/json" id="awdb-data">{"corpora": [{"id": "biblical", "name": "Biblical Canon (KJV & Vulgate)", "trad": "Christian", "dates": "c. 405 CE (Vulgate) · 1611 CE (KJV)", "langs": "English, Latin", "desc": "The canonical Christian Bible in its two most influential historic versions: Jerome's Latin Vulgate and the King James Version.", "texts": [{"n": "King James Version (1611)", "d": "The Authorized Version — the most influential English Bible translation in history."}, {"n": "Latin Vulgate (c. 405 CE)", "d": "Jerome's Latin translation, the Western church's standard text for over a millennium."}]}, {"id": "dss", "name": "Dead Sea Scrolls", "trad": "Jewish (Essene)", "dates": "c. 250 BCE – 68 CE", "langs": "Hebrew, Aramaic", "desc": "Manuscripts discovered at Qumran (1947–1956): the oldest known biblical texts plus the sectarian library of a Jewish community awaiting the Messiah.", "texts": [{"n": "Community Rule (1QS)", "d": "The constitution of the Qumran community — covenant entry, the Two Spirits, and communal discipline."}, {"n": "War Scroll (1QM)", "d": "The eschatological war of the Sons of Light against the Sons of Darkness, with Michael as heavenly champion."}, {"n": "Melchizedek Scroll (11Q13)", "d": "Presents Melchizedek as a heavenly deliverer who proclaims the Jubilee and executes God's judgment — striking background to Hebrews 7."}]}, {"id": "ethiopian", "name": "Ethiopian Orthodox Bible (Broader Canon)", "trad": "Ethiopian Orthodox", "dates": "c. 4th–6th c. CE compilation", "langs": "Ge'ez", "desc": "The Ethiopian Orthodox Tewahedo canon preserves books absent from most canons — most famously 1 Enoch and Jubilees, both also found among the Dead Sea Scrolls.", "texts": [{"n": "1 Enoch (Book of Enoch)", "d": "The Watchers, the Son of Man Similitudes, and heavenly journeys; quoted verbatim in Jude 14–15."}]}, {"id": "gnostic", "name": "Gnostic & Nag Hammadi Texts", "trad": "Gnostic Christian", "dates": "c. 2nd–4th c. CE", "langs": "Coptic, Greek", "desc": "Thirteen codices found at Nag Hammadi, Egypt (1945) — alternative gospels and treatises reflecting Gnostic cosmology of Sophia, the Demiurge, and secret knowledge.", "texts": [{"n": "Gospel of Thomas", "d": "114 sayings attributed to Jesus, roughly half with canonical parallels — the most studied non-canonical gospel."}]}, {"id": "josephus", "name": "Josephus & Hellenistic Jewish Literature", "trad": "Jewish (Hellenistic)", "dates": "c. 75–100 CE", "langs": "Greek", "desc": "Flavius Josephus, the first-century Romano-Jewish historian whose works independently document figures and events of the New Testament era.", "texts": [{"n": "Antiquities of the Jews", "d": "Twenty-book history from creation to the Jewish War — includes references to Jesus (the disputed Testimonium Flavianum), John the Baptist, and James."}]}, {"id": "apocrypha", "name": "New Testament Apocrypha", "trad": "Early Christian", "dates": "c. 2nd–4th c. CE", "langs": "Greek, Coptic, Latin", "desc": "Early Christian writings outside the canon — gospels, acts, and apocalypses that shaped popular piety and preserve early traditions and legends.", "texts": [{"n": "Protoevangelium of James", "d": "The early life of Mary and the nativity — source of much later Marian tradition."}, {"n": "Gospel of Peter", "d": "A passion-resurrection narrative fragment with a dramatized emergence from the tomb."}, {"n": "Acts of Paul and Thecla", "d": "The celebrated story of Thecla, a female disciple of Paul — hugely popular in the early church."}, {"n": "Apocalypse of Peter", "d": "The earliest Christian tour of heaven and hell — once read in some churches."}, {"n": "Gospel of Nicodemus (Acts of Pilate)", "d": "Pilate's trial records and the Harrowing of Hell — Christ's descent to liberate the righteous dead."}]}, {"id": "mesopotamian", "name": "Sumerian & Akkadian Scriptures", "trad": "Mesopotamian", "dates": "c. 2100–600 BCE", "langs": "Sumerian, Akkadian", "desc": "The religious literature of Sumer, Akkad, Assyria, and Babylonia — creation epics, flood narratives, and divine myths that form the ancient Near Eastern background of Genesis.", "texts": [{"n": "Enuma Elish", "d": "The Babylonian creation epic — Marduk defeats Tiamat and orders the cosmos; the classic comparison text for Genesis 1."}, {"n": "Epic of Gilgamesh", "d": "The king of Uruk's quest for immortality; Tablet XI preserves Utnapishtim's flood story, the closest parallel to Noah."}, {"n": "Atrahasis Epic", "d": "Creation of humanity from clay and divine breath, human 'noise,' and the flood — an older flood tradition behind Gilgamesh XI."}]}], "characters": [{"n": "Noah", "trad": "Biblical", "refs": "Genesis 6–9; Matthew 24:37–39; Hebrews 11:7", "d": "Righteous man commanded to build the ark; covenant of the rainbow after the flood.", "par": [{"n": "Utnapishtim", "src": "Epic of Gilgamesh XI", "rel": "flood hero parallel — divine warning, boat, birds sent out, sacrifice after landing", "conf": "High"}, {"n": "Atrahasis", "src": "Atrahasis Epic", "rel": "earlier Akkadian flood hero warned by the god Ea", "conf": "High"}, {"n": "Ziusudra", "src": "Sumerian Flood Story (Eridu Genesis)", "rel": "oldest known flood hero, king of Shuruppak", "conf": "High"}]}, {"n": "Adam", "trad": "Biblical · Mesopotamian echo", "refs": "Genesis 1–3; Romans 5:12–19; 1 Corinthians 15:45", "d": "First man, formed from dust and divine breath; his fall frames the Bible's redemption arc.", "par": [{"n": "Adapa", "src": "Akkadian Adapa Myth", "rel": "first-man figure who forfeits immortality through a food/drink test — inverted echo of Eden", "conf": "Medium"}, {"n": "Humanity from clay", "src": "Atrahasis Epic", "rel": "mankind fashioned from clay mixed with divine element — creation-material parallel to Genesis 2:7", "conf": "High"}]}, {"n": "Enoch", "trad": "Biblical · Ethiopian canon · DSS", "refs": "Genesis 5:21–24; Jude 14–15; 1 Enoch", "d": "Seventh from Adam who 'walked with God, and was not' — the towering figure of the Ethiopian canon's Enochic literature.", "par": [{"n": "Enmeduranki", "src": "Sumerian King List tradition", "rel": "seventh antediluvian king, taken into the divine assembly and taught heavenly secrets", "conf": "Medium"}, {"n": "Son of Man visions", "src": "1 Enoch (Similitudes)", "rel": "Enoch beholds the pre-existent Son of Man — background to Daniel 7 and the Gospels' title", "conf": "High"}]}, {"n": "Melchizedek", "trad": "Biblical · DSS", "refs": "Genesis 14:18–20; Psalm 110:4; Hebrews 7; 11Q13", "d": "King of Salem and priest of God Most High who blesses Abraham; Hebrews presents Christ as priest 'after the order of Melchizedek.'", "par": [{"n": "Heavenly Melchizedek", "src": "Melchizedek Scroll (11Q13)", "rel": "Qumran casts him as a heavenly redeemer proclaiming the Jubilee of Isaiah 61 — the very text Jesus reads in Luke 4", "conf": "High"}]}, {"n": "Michael the Archangel", "trad": "Biblical · DSS · Enochic", "refs": "Daniel 10:13, 12:1; Jude 9; Revelation 12:7", "d": "Israel's angelic prince and heavenly warrior.", "par": [{"n": "Prince of Light", "src": "War Scroll (1QM)", "rel": "leads the Sons of Light in the final battle — Qumran's Michael figure", "conf": "High"}, {"n": "Chief of the holy angels", "src": "1 Enoch 20; 24", "rel": "one of the archangels who intercedes and binds the fallen Watchers", "conf": "High"}]}, {"n": "The Watchers / Sons of God", "trad": "Biblical · Enochic · DSS · Mesopotamian echo", "refs": "Genesis 6:1–4; 1 Enoch 6–16; 2 Peter 2:4; Jude 6", "d": "Heavenly beings whose transgression with humanity precedes the flood; expanded dramatically in 1 Enoch's Watchers narrative.", "par": [{"n": "Apkallu sages", "src": "Mesopotamian tradition", "rel": "seven antediluvian semi-divine sages who bring heavenly knowledge — inverse image of the Watchers' forbidden teaching", "conf": "Medium"}, {"n": "Book of Giants", "src": "Dead Sea Scrolls (4Q203 etc.)", "rel": "Qumran expansion naming the giants — including Gilgamesh — among the Watchers' offspring", "conf": "High"}]}, {"n": "Azazel", "trad": "Biblical · Enochic", "refs": "Leviticus 16:8–10; 1 Enoch 8–10", "d": "The wilderness figure of the Day of Atonement scapegoat rite; in 1 Enoch, the Watcher who taught forbidden arts and bears the sins of the fallen.", "par": [{"n": "Asael/Azazel the Watcher", "src": "1 Enoch 8–10", "rel": "'To Azazel ascribe all sin' — atonement imagery converging with Leviticus 16", "conf": "High"}]}, {"n": "Jesus of Nazareth", "trad": "Biblical · Josephus · Gnostic · Apocryphal", "refs": "Four Gospels; Antiquities 18.63–64; 20.200", "d": "The Christ, the Son of the living God — the center of the canon and the figure every other corpus must reckon with.", "par": [{"n": "Testimonium Flavianum", "src": "Josephus, Antiquities 18", "rel": "first-century non-Christian reference to Jesus, his execution under Pilate, and his followers", "conf": "High (core), disputed wording"}, {"n": "The living Jesus of the sayings", "src": "Gospel of Thomas", "rel": "sayings-form portrait, about half paralleling the Synoptics", "conf": "High textual overlap"}, {"n": "Harrowing of Hell", "src": "Gospel of Nicodemus", "rel": "Christ descends and liberates Adam and the righteous dead — echoing 1 Peter 3:19", "conf": "Traditional"}]}, {"n": "John the Baptist", "trad": "Biblical · Josephus", "refs": "Matthew 3; Antiquities 18.116–119", "d": "Forerunner of the Messiah, baptizing in the Jordan.", "par": [{"n": "John called the Baptist", "src": "Josephus, Antiquities 18", "rel": "independent account of John's ministry, popularity, and execution by Herod Antipas", "conf": "High"}]}, {"n": "James the brother of Jesus", "trad": "Biblical · Josephus", "refs": "Galatians 1:19; Acts 15; Antiquities 20.200", "d": "Leader of the Jerusalem church.", "par": [{"n": "James, brother of Jesus who is called Christ", "src": "Josephus, Antiquities 20", "rel": "Josephus records his death by stoning c. 62 CE — a key external corroboration", "conf": "High"}]}, {"n": "Mary, mother of Jesus", "trad": "Biblical · Apocryphal", "refs": "Luke 1–2; Protoevangelium of James", "d": "The virgin who bears the Messiah.", "par": [{"n": "Mary's birth and childhood", "src": "Protoevangelium of James", "rel": "her parents Joachim and Anna, temple upbringing — the fountainhead of Marian tradition", "conf": "Traditional"}]}, {"n": "Pontius Pilate", "trad": "Biblical · Josephus · Apocryphal", "refs": "Gospels; Antiquities 18; Gospel of Nicodemus", "d": "Roman prefect of Judea who sentenced Jesus.", "par": [{"n": "Pilate in Josephus", "src": "Antiquities 18 / Jewish War", "rel": "documented governorship, provocations, and removal — plus the 1961 Pilate Stone inscription", "conf": "High"}, {"n": "Acts of Pilate", "src": "Gospel of Nicodemus", "rel": "legendary trial records elaborating the passion narrative", "conf": "Legendary"}]}, {"n": "Sophia (Wisdom)", "trad": "Gnostic · Biblical wisdom echo", "refs": "Proverbs 8; Nag Hammadi treatises", "d": "Personified Wisdom of Proverbs; in Gnostic myth, the aeon whose fall produces the Demiurge.", "par": [{"n": "Sophia's fall", "src": "Nag Hammadi (Apocryphon of John)", "rel": "Gnostic transformation of the biblical Wisdom figure into a cosmological drama", "conf": "High (as reinterpretation)"}]}, {"n": "The Demiurge (Yaldabaoth)", "trad": "Gnostic", "refs": "Apocryphon of John; Against Heresies I", "d": "The Gnostic creator-ruler, a polemical inversion of the biblical Creator — rejected by orthodox Christianity.", "par": [{"n": "Creator inverted", "src": "Nag Hammadi texts", "rel": "illustrates how Gnostic cosmology rewrote Genesis — essential for Phase V discernment studies", "conf": "High (as contrast)"}]}, {"n": "Seth", "trad": "Biblical · Gnostic", "refs": "Genesis 4:25–5:8; Nag Hammadi 'Sethian' corpus", "d": "Third son of Adam, 'appointed' in Abel's place; Gnostic Sethians claimed him as the ancestor of the enlightened race.", "par": [{"n": "Great Seth", "src": "Nag Hammadi (Gospel of the Egyptians)", "rel": "Seth exalted as heavenly redeemer figure in Sethian Gnosticism", "conf": "High (as reinterpretation)"}]}, {"n": "Belial", "trad": "DSS · Biblical", "refs": "2 Corinthians 6:15; Community Rule; War Scroll", "d": "The name of the adversary throughout the Qumran scrolls — the prince of the Sons of Darkness.", "par": [{"n": "Belial's dominion", "src": "Community Rule / War Scroll", "rel": "the present evil age as 'the dominion of Belial' — background to Paul's lone use of the name", "conf": "High"}]}, {"n": "Teacher of Righteousness", "trad": "DSS", "refs": "Damascus Document; Habakkuk Pesher (1QpHab)", "d": "The revered founder-figure of the Qumran community, persecuted by the 'Wicked Priest.'", "par": [{"n": "Righteous sufferer pattern", "src": "Habakkuk Pesher", "rel": "a persecuted righteous teacher interpreting prophecy of the last days — instructive parallel and contrast to Jesus", "conf": "Medium"}]}, {"n": "Utnapishtim", "trad": "Mesopotamian", "refs": "Epic of Gilgamesh, Tablet XI", "d": "The Babylonian flood survivor granted immortality, whom Gilgamesh seeks.", "par": [{"n": "Noah", "src": "Genesis 6–9", "rel": "boat, animals, birds released, sacrifice, divine blessing — the classic cross-tradition flood pairing", "conf": "High"}]}, {"n": "Gilgamesh", "trad": "Mesopotamian · DSS mention", "refs": "Epic of Gilgamesh; Book of Giants (4Q531)", "d": "Legendary king of Uruk, two-thirds divine, seeker of eternal life.", "par": [{"n": "Gilgamesh among the giants", "src": "Book of Giants (DSS)", "rel": "the Qumran Book of Giants names Gilgamesh as one of the Watchers' giant offspring — a stunning cross-corpus appearance", "conf": "High"}]}, {"n": "Marduk", "trad": "Mesopotamian", "refs": "Enuma Elish", "d": "Patron god of Babylon who defeats Tiamat and creates the ordered world from her body.", "par": [{"n": "Creation by divine word and division", "src": "Genesis 1", "rel": "separation of waters, ordering of cosmos — comparison highlights Genesis' polemical monotheism", "conf": "High (as contrast)"}]}, {"n": "Inanna / Ishtar", "trad": "Mesopotamian", "refs": "Descent of Inanna; Gilgamesh VI", "d": "Goddess of love and war whose descent to the underworld is a signature Mesopotamian myth.", "par": [{"n": "Tammuz weeping", "src": "Ezekiel 8:14", "rel": "Ezekiel sees women weeping for Tammuz (Dumuzi, Inanna's consort) at the temple — the Bible directly references this cult", "conf": "High"}]}, {"n": "Enki / Ea", "trad": "Mesopotamian", "refs": "Atrahasis; Adapa; Gilgamesh XI", "d": "God of wisdom and waters who warns the flood hero and shapes humanity from clay.", "par": [{"n": "Divine warning before the flood", "src": "Genesis 6:13", "rel": "the warning motif parallels God's word to Noah — with the theological contrast of one sovereign God versus a divided pantheon", "conf": "High"}]}, {"n": "Thomas the Apostle", "trad": "Biblical · Gnostic", "refs": "John 20:24–29; Gospel of Thomas (attrib.)", "d": "The apostle of the confession 'My Lord and my God.'", "par": [{"n": "Didymos Judas Thomas", "src": "Gospel of Thomas", "rel": "the sayings gospel circulating under his name in Syriac Christianity", "conf": "Traditional attribution"}]}, {"n": "Abraham", "trad": "Biblical · Josephus", "refs": "Genesis 12–25; Antiquities 1", "d": "Father of faith; his covenant anchors Phases I and II of this program's Galatians studies.", "par": [{"n": "Abraham in Josephus", "src": "Antiquities 1", "rel": "retold with Hellenistic apologetic emphasis — Abraham as teacher of the nations", "conf": "High"}]}, {"n": "Moses", "trad": "Biblical · DSS · Josephus", "refs": "Exodus–Deuteronomy; 4QReworked Pentateuch; Antiquities 2–4", "d": "Lawgiver and prophet; Deuteronomy 18:15's 'prophet like me' became a messianic expectation.", "par": [{"n": "Prophet like Moses at Qumran", "src": "4QTestimonia (4Q175)", "rel": "Qumran's messianic proof-text chain opens with Deuteronomy 18:15 — the expectation Acts 3:22 applies to Jesus", "conf": "High"}]}, {"n": "Daniel", "trad": "Biblical · DSS", "refs": "Book of Daniel; 4QPrayer of Nabonidus", "d": "Prophet of the exile whose visions frame apocalyptic hope.", "par": [{"n": "Prayer of Nabonidus", "src": "Dead Sea Scrolls (4Q242)", "rel": "a Babylonian king healed after a Jewish exile's counsel — striking background to Daniel 4's madness narrative", "conf": "Medium"}]}, {"n": "Adam & Eve's Fall Retold", "trad": "Gnostic", "refs": "Apocryphon of John; Hypostasis of the Archons", "d": "Gnostic rewritings of Eden invert the serpent and the Creator.", "par": [{"n": "Eden inverted", "src": "Nag Hammadi", "rel": "case study in how alternative cosmologies rewrite Genesis — Phase V's false-teachings unit in ancient form", "conf": "High (as contrast)"}]}, {"n": "The Son of Man", "trad": "Biblical · Enochic", "refs": "Daniel 7:13–14; 1 Enoch 46–48; Mark 14:62", "d": "The heavenly figure who receives everlasting dominion — Jesus' own favored self-designation.", "par": [{"n": "Enoch's Son of Man", "src": "1 Enoch Similitudes", "rel": "pre-existent, enthroned judge named before creation — the closest Jewish background to the Gospels' usage", "conf": "High"}]}, {"n": "Enoch's Scribe Role", "trad": "Enochic · Mesopotamian echo", "refs": "1 Enoch 12–15; Jubilees 4", "d": "Enoch as 'scribe of righteousness' interceding between heaven and the Watchers.", "par": [{"n": "Scribe of the gods motif", "src": "Mesopotamian Nabu tradition", "rel": "heavenly scribe imagery shared across the ancient Near East", "conf": "Medium"}]}], "prophecies": [{"ref": "Genesis 3:15", "t": "The Seed of the Woman", "cat": "Messianic", "given": "Eden narrative", "p": "The woman's seed will crush the serpent's head while being struck in the heel.", "f": "Understood by the church as the first gospel (protoevangelium) — fulfilled in Christ's victory through suffering at the cross (Romans 16:20; Galatians 4:4).", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Deuteronomy 18:15–19", "t": "A Prophet Like Moses", "cat": "Messianic", "given": "Moses, c. 15th–13th c. BCE", "p": "God will raise up a prophet like Moses; Israel must hear him.", "f": "Applied to Jesus in Acts 3:22–26 and John 6:14. Qumran's 4QTestimonia opens its messianic proof-texts with this passage, showing the expectation was alive before Christ.", "src": "Biblical Canon · Dead Sea Scrolls (4Q175)", "status": "Fulfilled"}, {"ref": "Isaiah 7:14", "t": "The Virgin Shall Conceive", "cat": "Messianic", "given": "Isaiah, c. 735 BCE", "p": "A virgin shall conceive and bear a son, and shall call his name Immanuel.", "f": "Matthew 1:22–23 cites its fulfillment in the virgin birth of Jesus. The Great Isaiah Scroll (1QIsaᵃ) from Qumran preserves the verse a millennium before the medieval Hebrew manuscripts.", "src": "Biblical Canon · Dead Sea Scrolls (1QIsaᵃ)", "status": "Fulfilled"}, {"ref": "Isaiah 9:6–7", "t": "Unto Us a Child Is Born", "cat": "Messianic", "given": "Isaiah, c. 730 BCE", "p": "A child bearing divine titles will reign on David's throne forever.", "f": "Fulfilled in Christ's birth and eternal kingdom (Luke 1:32–33).", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Isaiah 53", "t": "The Suffering Servant", "cat": "Messianic", "given": "Isaiah, c. 700 BCE", "p": "The Servant is despised, pierced for our transgressions, buried with the rich, and justifies many by bearing their iniquities.", "f": "The passion narratives track the chapter point by point; Acts 8:32–35 applies it directly to Jesus. Fully preserved in the Great Isaiah Scroll, dated c. 125 BCE — the prophecy demonstrably predates its fulfillment.", "src": "Biblical Canon · Dead Sea Scrolls (1QIsaᵃ)", "status": "Fulfilled"}, {"ref": "Isaiah 61:1–2", "t": "The Anointed Proclaims Liberty", "cat": "Messianic", "given": "Isaiah", "p": "The Spirit-anointed one preaches good tidings, binds the brokenhearted, proclaims liberty — the acceptable year of the Lord.", "f": "Jesus reads this in Nazareth and declares 'this day is this scripture fulfilled' (Luke 4:16–21). Qumran's Melchizedek Scroll (11Q13) had already tied this passage to a heavenly deliverer and the Jubilee.", "src": "Biblical Canon · Dead Sea Scrolls (11Q13)", "status": "Fulfilled"}, {"ref": "Micah 5:2", "t": "Ruler from Bethlehem", "cat": "Messianic", "given": "Micah, c. 700 BCE", "p": "From Bethlehem Ephratah comes forth the ruler whose goings forth are from everlasting.", "f": "Cited by the chief priests to Herod (Matthew 2:4–6); fulfilled in Jesus' Bethlehem birth.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Zechariah 9:9", "t": "The King on a Donkey", "cat": "Messianic", "given": "Zechariah, c. 520 BCE", "p": "Zion's king comes lowly, riding on a donkey's colt.", "f": "Fulfilled at the triumphal entry (Matthew 21:1–11) — the anchor text of Phase I, Module 1, Session 3.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Zechariah 11:12–13", "t": "Thirty Pieces of Silver", "cat": "Messianic", "given": "Zechariah", "p": "The shepherd's price — thirty pieces of silver — is cast to the potter in the house of the Lord.", "f": "Judas' betrayal price and the potter's field purchase (Matthew 26:15; 27:3–10).", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Zechariah 12:10", "t": "They Shall Look on Him Whom They Pierced", "cat": "Messianic", "given": "Zechariah", "p": "They shall look upon me whom they have pierced, and mourn.", "f": "Applied to the crucifixion in John 19:37 and to the second coming in Revelation 1:7.", "src": "Biblical Canon", "status": "Fulfilled / Awaiting consummation"}, {"ref": "Psalm 22", "t": "The Psalm of the Cross", "cat": "Messianic", "given": "David, c. 1000 BCE", "p": "Mocking crowds, pierced hands and feet, garments divided by lot, yet ending in worldwide praise.", "f": "Jesus quotes its opening cry from the cross (Matthew 27:46); the soldiers' lots (John 19:23–24) fulfill v. 18.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Psalm 16:10", "t": "Not Abandoned to the Grave", "cat": "Messianic", "given": "David", "p": "You will not leave my soul in Sheol, nor suffer your Holy One to see corruption.", "f": "Peter's Pentecost sermon (Acts 2:25–32) declares it fulfilled in the resurrection.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Psalm 110:1, 4", "t": "Lord and Priest Forever", "cat": "Messianic", "given": "David", "p": "'The LORD said unto my Lord, Sit at my right hand' — a priest forever after the order of Melchizedek.", "f": "The New Testament's most-quoted psalm; Hebrews 5–7 builds Christ's priesthood on v. 4, with Qumran's 11Q13 showing Melchizedek speculation already flourishing.", "src": "Biblical Canon · Dead Sea Scrolls (11Q13)", "status": "Fulfilled"}, {"ref": "Daniel 7:13–14", "t": "The Son of Man Receives the Kingdom", "cat": "Messianic / Apocalyptic", "given": "Daniel, exile era", "p": "One like a son of man comes with the clouds and receives everlasting dominion.", "f": "Jesus claims this scene at his trial (Mark 14:62). 1 Enoch's Similitudes independently develop the enthroned Son of Man — the two witnesses of the title's Jewish currency.", "src": "Biblical Canon · Ethiopian canon (1 Enoch 46–48)", "status": "Fulfilled / Awaiting consummation"}, {"ref": "Daniel 9:24–27", "t": "The Seventy Weeks", "cat": "Messianic / Chronological", "given": "Daniel, c. 538 BCE", "p": "Seventy weeks are determined to finish transgression and anoint the Most Holy; Messiah is 'cut off' after the sixty-ninth week; the city and sanctuary are destroyed.", "f": "Messiah cut off — the crucifixion c. 30/33 CE; city and sanctuary destroyed — Jerusalem and the temple in 70 CE, documented in devastating detail by Josephus (The Jewish War).", "src": "Biblical Canon · Josephus", "status": "Fulfilled (interpretive frameworks vary)"}, {"ref": "Hosea 11:1", "t": "Out of Egypt", "cat": "Messianic typology", "given": "Hosea, 8th c. BCE", "p": "'Out of Egypt have I called my son.'", "f": "Matthew 2:15 applies Israel's exodus pattern typologically to the child Jesus' return from Egypt.", "src": "Biblical Canon", "status": "Fulfilled (typological)"}, {"ref": "Isaiah 44:28–45:1", "t": "Cyrus Named Before His Birth", "cat": "Historical", "given": "Isaiah, 8th c. BCE", "p": "Cyrus, called by name, will rebuild Jerusalem and free the exiles.", "f": "Cyrus the Great of Persia conquered Babylon (539 BCE) and decreed the return (Ezra 1:1–4); the Cyrus Cylinder documents his repatriation policy.", "src": "Biblical Canon · archaeology (Cyrus Cylinder)", "status": "Fulfilled"}, {"ref": "Jeremiah 25:11–12; 29:10", "t": "Seventy Years of Exile", "cat": "Historical", "given": "Jeremiah, c. 605 BCE", "p": "Judah will serve Babylon seventy years; then Babylon will be punished and the exiles returned.", "f": "From the first deportation (605 BCE) to the temple's rebuilding era, the seventy-year horizon closed as Persia toppled Babylon and Judah returned.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Ezekiel 26", "t": "The Fall of Tyre", "cat": "Historical", "given": "Ezekiel, c. 587 BCE", "p": "Many nations against Tyre; her stones and timber cast into the sea; a bare rock for spreading nets.", "f": "Nebuchadnezzar besieged the mainland city; Alexander (332 BCE) famously scraped its ruins into the sea to build his causeway to the island — the debris literally cast into the water.", "src": "Biblical Canon · classical historians", "status": "Fulfilled"}, {"ref": "Isaiah 13:19–22; Jeremiah 51", "t": "Babylon Shall Not Be Inhabited", "cat": "Historical", "given": "Isaiah; Jeremiah", "p": "Babylon, the glory of kingdoms, will become like Sodom — never inhabited again.", "f": "The city declined after Persia and Alexander, and by the early centuries CE lay abandoned — a mound of ruins into the modern era.", "src": "Biblical Canon", "status": "Fulfilled"}, {"ref": "Daniel 2 & 7", "t": "The Succession of Empires", "cat": "Apocalyptic / Historical", "given": "Daniel, exile era", "p": "Four kingdoms — gold to iron, lion to terrible beast — succeed one another before God's everlasting kingdom.", "f": "Read classically as Babylon, Medo-Persia, Greece, and Rome — with the stone 'cut without hands' as Christ's kingdom that grows to fill the earth.", "src": "Biblical Canon", "status": "Fulfilled / Kingdom growing"}, {"ref": "Matthew 24:1–2 (with Luke 19:41–44)", "t": "Not One Stone Upon Another", "cat": "Historical (spoken by Jesus)", "given": "Jesus, c. 30 CE", "p": "The temple will be torn down — not one stone left upon another; Jerusalem encircled and leveled.", "f": "Fulfilled in 70 CE when Titus destroyed city and temple. Josephus, an eyewitness, chronicles the siege in The Jewish War — one corpus recording the fulfillment of another's prophecy.", "src": "Biblical Canon · Josephus (The Jewish War)", "status": "Fulfilled"}, {"ref": "1 Enoch 1:9 → Jude 14–15", "t": "Enoch's Prophecy Quoted in Scripture", "cat": "Cross-corpus", "given": "1 Enoch, c. 3rd c. BCE", "p": "'Behold, the Lord comes with ten thousands of his saints, to execute judgment upon all.'", "f": "Jude quotes the passage verbatim — the New Testament directly citing the Ethiopian canon's signature book, whose Aramaic fragments were found at Qumran.", "src": "Ethiopian canon · Dead Sea Scrolls · Biblical Canon", "status": "Awaiting (second coming); citation itself is a documented cross-corpus link"}, {"ref": "Joel 2:28–32", "t": "The Spirit on All Flesh", "cat": "New-covenant", "given": "Joel", "p": "God will pour out his Spirit on all flesh; whosoever calls on the name of the LORD shall be saved.", "f": "Peter declares Pentecost its fulfillment (Acts 2:16–21) — and its 'whosoever' anchors the Salvation Invitation of Phase IV.", "src": "Biblical Canon", "status": "Fulfilled / continuing"}, {"ref": "Jeremiah 31:31–34", "t": "The New Covenant", "cat": "New-covenant", "given": "Jeremiah", "p": "A new covenant — law written on hearts, sins remembered no more.", "f": "Instituted at the Last Supper ('the new testament
