<style>
:root{
  --ink:#0E1630; --ink2:#13203F; --navy:#1F3864; --slate:#4A6FA5;
  --gold:#C9A24B; --gold-l:#E3C87E; --gold-dim:#8a7238;
  --paper:#FAF7F0; --paper2:#F1EBDD; --line:#E3DBC8;
  --text:#26251F; --muted:#6B675C;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:Georgia,'Times New Roman',serif;
  --ui:'Inter',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;background:var(--paper);color:var(--text);font-family:var(--body);font-size:16.5px;line-height:1.65}
button{font-family:var(--ui)}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- sidebar ---------- */
#sidebar{width:312px;min-width:312px;background:linear-gradient(180deg,#101A38 0%,var(--ink) 100%);color:#C7CFE2;display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
#brand{padding:1.35rem 1.3rem 1.05rem;border-bottom:1px solid rgba(201,162,75,.28);display:flex;gap:.8rem;align-items:center;cursor:pointer}
#brand svg{width:46px;height:42px;flex:none}
#brand .b1{font-family:var(--ui);font-size:.66rem;letter-spacing:.22em;color:var(--gold-l);text-transform:uppercase}
#brand .b2{font-family:var(--serif);font-size:1.24rem;font-weight:600;color:#F2ECDD;line-height:1.15}
#searchwrap{padding: .9rem 1.3rem .4rem}
#search{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,162,75,.3);color:#EDE8DA;border-radius:7px;padding:.5rem .75rem;font-family:var(--ui);font-size:.83rem}
#search::placeholder{color:#8B95AF}
#navscroll{overflow-y:auto;flex:1;padding:.4rem .65rem 1.4rem;scrollbar-width:thin;scrollbar-color:rgba(201,162,75,.4) transparent}
.navgroup{margin-top:.55rem}
.navgroup>summary{list-style:none;cursor:pointer;padding:.5rem .65rem;border-radius:7px;display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.navgroup>summary::-webkit-details-marker{display:none}
.navgroup>summary:hover{background:rgba(255,255,255,.05)}
.gname{font-family:var(--ui);font-size:.76rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--gold-l)}
.gpct{font-family:var(--ui);font-size:.68rem;color:#7E88A4}
.gbar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin:.15rem .65rem .3rem;overflow:hidden}
.gbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:width .4s}
/* pathway rail */
.rail{position:relative;margin-left:.55rem;padding-left:1.05rem}
.rail::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:rgba(201,162,75,.35)}
.navitem{display:flex;align-items:center;gap:.55rem;position:relative;padding:.34rem .55rem .34rem .2rem;border-radius:6px;color:#B9C2D8;font-family:var(--ui);font-size:.82rem;line-height:1.3;cursor:pointer;text-decoration:none}
.navitem:hover{background:rgba(255,255,255,.06);color:#EDE8DA}
.navitem.active{background:rgba(201,162,75,.16);color:#F5EFDF}
.node{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold-dim);background:var(--ink);flex:none;margin-left:-1.35rem;position:relative;z-index:1}
.navitem.active .node{border-color:var(--gold-l)}
.navitem.done .node{background:var(--gold);border-color:var(--gold-l)}
.navitem .check{margin-left:auto;color:var(--gold);font-size:.72rem;display:none}
.navitem.done .check{display:inline}
.navitem .lockicon{margin-left:auto;font-size:.65rem;opacity:.75;display:none}
.navitem.locked .lockicon{display:inline}
.navitem.locked{opacity:.75}
#sideftr{padding:.85rem 1.3rem;border-top:1px solid rgba(201,162,75,.25);font-family:var(--ui);font-size:.68rem;color:#7E88A4}

/* ---------- main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
#topbar{position:sticky;top:0;z-index:5;background:rgba(250,247,240,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.7rem 2.2rem;display:flex;align-items:center;gap:1rem}
#menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:.35rem .6rem;font-size:1rem;cursor:pointer;color:var(--navy)}
#crumb{font-family:var(--ui);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#markbtn{margin-left:auto;background:var(--navy);color:#F5EFDF;border:1px solid var(--navy);border-radius:7px;padding:.48rem .95rem;font-size:.8rem;font-weight:600;cursor:pointer;display:none}
#markbtn:hover{background:#28477c}
#markbtn.done{background:transparent;color:var(--gold-dim);border-color:var(--gold)}
#page{flex:1;padding:2.4rem 2.2rem 3rem}
.content{max-width:840px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:2.8rem 3.2rem 3rem;box-shadow:0 1px 0 rgba(31,56,100,.04),0 12px 34px -22px rgba(31,56,100,.25)}
.content h1.pagetitle{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:2.15rem;line-height:1.12;margin:0 0 .4rem;letter-spacing:.005em}
.eyebrow{font-family:var(--ui);font-size:.7rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:.55rem}
.titlebar{border-bottom:2px solid var(--gold);padding-bottom:1.05rem;margin-bottom:1.5rem}
.content h2{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:1.55rem;margin:2rem 0 .6rem}
.content h3{font-family:var(--serif);font-weight:700;color:var(--gold-dim);font-size:1.28rem;margin:1.8rem 0 .5rem}
.content h4{font-family:var(--ui);font-weight:600;color:var(--navy);font-size:.95rem;margin:1.3rem 0 .35rem}
.content p{margin:.65rem 0}
.content p.lede{font-size:1.13rem;color:#3A382F;font-style:italic}
.content ul,.content ol{padding-left:1.35rem;margin:.6rem 0}
.content li{margin:.32rem 0}
.content li p{margin:.25rem 0}
.content blockquote{margin:1rem 0;padding:.6rem 1.1rem;border-left:3px solid var(--gold);background:var(--paper);color:#4A473C;font-style:italic}
.content table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.86rem;font-family:var(--ui);display:block;overflow-x:auto}
.content th{background:var(--navy);color:#F3EDDF;text-align:left;padding:.5rem .7rem;font-weight:600;white-space:nowrap}
.content td{border:1px solid var(--line);padding:.5rem .7rem;vertical-align:top;background:#fff}
.content tr:nth-child(even) td{background:var(--paper)}
.content a{color:var(--slate);text-decoration-color:var(--gold)}
.content img{max-width:100%}
#pagenav{max-width:840px;margin:1.4rem auto 0;display:flex;gap:1rem;justify-content:space-between}
.pn{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:.8rem 1rem;cursor:pointer;text-align:left;font-family:var(--ui)}
.pn:hover{border-color:var(--gold)}
.pn small{display:block;font-size:.66rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.2rem}
.pn span{font-size:.86rem;color:var(--navy);font-weight:600}
.pn.next{text-align:right}
.pn[disabled]{visibility:hidden}


/* ---------- class discussion ---------- */
#discussion{max-width:840px;margin:1.2rem auto 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1.4rem 1.8rem}
#discussion h3{font-family:var(--serif);color:var(--navy);font-size:1.25rem;margin:.1rem 0 .2rem}
#discussion .dnote{font-family:var(--ui);font-size:.78rem;color:var(--muted);margin-bottom:.8rem}
#discussion .dpending{background:var(--paper);border:1px dashed var(--gold);border-radius:9px;padding:.9rem 1rem;font-family:var(--ui);font-size:.85rem;color:#4A473C}
/* ---------- enrollment ---------- */
.enroll{display:flex;flex-direction:column;gap:.85rem;max-width:520px;margin-top:1rem}
.enroll label{font-family:var(--ui);font-size:.78rem;font-weight:600;color:var(--navy);display:flex;flex-direction:column;gap:.3rem}
.enroll input,.enroll select,.enroll textarea{border:1.5px solid var(--line);border-radius:8px;padding:.55rem .75rem;font-family:var(--ui);font-size:.9rem;background:#fff}
.enroll input:focus,.enroll select:focus,.enroll textarea:focus{border-color:var(--gold);outline:none}
#enroll-status{font-family:var(--ui);font-size:.85rem;color:#2E7D32;font-weight:600}
/* ---------- resource database ---------- */
.rdb-bar{display:flex;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .6rem}
#rdb-q{flex:1;min-width:220px;border:1.5px solid var(--gold);border-radius:8px;padding:.6rem .85rem;font-family:var(--ui);font-size:.9rem;background:#fff}
.rdb-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:.55rem .9rem;font-size:.8rem;font-weight:600;color:var(--navy);cursor:pointer;font-family:var(--ui)}
.rdb-btn:hover{border-color:var(--gold)}
.rdb-btn.gold{background:linear-gradient(180deg,#E3C87E,#C9A24B);border-color:#B58F3E;color:#3D2145}
.rdb-filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.35rem 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:.28rem .8rem;font-size:.72rem;font-family:var(--ui);font-weight:600;color:var(--muted);cursor:pointer;background:#fff}
.chip.on{background:var(--navy);border-color:var(--navy);color:#F3EDDF}
#rdb-meta{font-family:var(--ui);font-size:.74rem;color:var(--muted);margin:.5rem 0 .8rem}
.rcard{border:1px solid var(--line);border-left:4px solid var(--rc,#C9A24B);border-radius:10px;background:#fff;padding:.85rem 1rem;margin:.6rem 0}
.rcard h4{margin:.1rem 0 .2rem;font-family:var(--serif);font-size:1.08rem;color:var(--navy);font-weight:700}
.rcard .rmeta{font-family:var(--ui);font-size:.7rem;color:var(--muted);margin-bottom:.3rem}
.rcard p{font-size:.85rem;margin:.25rem 0 .45rem}
.rbadge{display:inline-block;font-family:var(--ui);font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--rc,#C9A24B);border-radius:4px;padding:.14rem .45rem;margin-right:.4rem}
.racts{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.ract{font-family:var(--ui);font-size:.72rem;font-weight:600;color:var(--slate);border:1px solid var(--line);border-radius:6px;padding:.28rem .6rem;text-decoration:none;background:#fff;cursor:pointer}
.ract:hover{border-color:var(--gold)}
.rsel{margin-left:auto;font-family:var(--ui);font-size:.72rem;display:flex;align-items:center;gap:.3rem;color:var(--navy)}
/* ---------- home hero ---------- */
#home{max-width:930px;margin:0 auto}
.hero{background:
  radial-gradient(ellipse 120% 90% at 50% 24%, #FFFEF6 0%, #FEF3CF 26%, #FBE0A4 46%, #F3C08B 64%, #EBA48C 74%, #C67F9F 88%, #9A5E97 100%);
  border-radius:16px;padding:3.2rem 2.5rem 2.7rem;text-align:center;color:#3D2145;position:relative;overflow:hidden;
  box-shadow:0 26px 60px -28px rgba(120,70,110,.45)}
.hero::after{content:"";position:absolute;inset:12px;border:1.5px solid rgba(201,162,75,.75);border-radius:11px;pointer-events:none;z-index:4}
/* radiant light beams */
.rays{position:absolute;left:50%;top:26%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);z-index:0;opacity:.5;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.85) 0deg 4deg,rgba(255,255,255,0) 4deg 13deg);
  -webkit-mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 30%,transparent 62%);
  mask-image:radial-gradient(circle,rgba(0,0,0,.9) 0%,rgba(0,0,0,.35) 30%,transparent 62%);
  animation:rayspin 140s linear infinite}
@keyframes rayspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rays{animation:none}}
/* sun glow behind plaque */
.glow{position:absolute;left:50%;top:24%;width:640px;height:640px;transform:translate(-50%,-50%);z-index:0;pointer-events:none;
  background:radial-gradient(circle,rgba(255,252,235,.95) 0%,rgba(255,238,190,.55) 38%,transparent 70%)}
/* doves */
.dove{position:absolute;z-index:2;fill:#FFFFFF;stroke:#B98B3E;stroke-width:1.1;stroke-linejoin:round;paint-order:stroke;filter:drop-shadow(0 5px 9px rgba(140,85,45,.45));pointer-events:none}
.dove path.wing{fill:#F5EDDB}
.d1{width:92px;left:7%;top:12%;transform:rotate(-8deg)}
.d2{width:64px;right:9%;top:9%;transform:scaleX(-1) rotate(-4deg)}
.d3{width:46px;right:20%;top:34%;transform:scaleX(-1) rotate(6deg);opacity:.9}
.d4{width:40px;left:16%;top:40%;transform:rotate(4deg);opacity:.85}
@keyframes drift{0%,100%{translate:0 0}50%{translate:0 -9px}}
.dove{animation:drift 7s ease-in-out infinite}
.d2{animation-delay:1.6s}.d3{animation-delay:3.1s}.d4{animation-delay:4.4s}
@media (prefers-reduced-motion:reduce){.dove{animation:none}}
/* soft clouds along the base */
.cloud{position:absolute;bottom:-46px;height:150px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(26px);z-index:1;pointer-events:none}
.cl1{left:-6%;width:46%}.cl2{left:30%;width:52%;bottom:-64px;background:rgba(255,252,242,.85)}.cl3{right:-8%;width:44%}
.hero .logoplaque,.hero .h-min,.hero h1,.hero .h-sub,.hero .h-verse,.hero .h-author,.hero .begin{position:relative;z-index:3}
.logoplaque{background:rgba(255,255,255,.92);border:1px solid var(--gold);border-radius:14px;padding:1.05rem 1.6rem;max-width:480px;margin:0 auto 1rem;
  box-shadow:0 0 70px 8px rgba(255,224,150,.85),0 12px 26px -14px rgba(120,70,40,.35)}
.logoplaque img{width:100%;display:block}
.hero .h-min{font-family:var(--ui);font-size:.74rem;letter-spacing:.36em;color:#8A5A2E;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.3rem,4.6vw,3.5rem);margin:.5rem 0 .3rem;color:#4A2450;letter-spacing:.02em;line-height:1.06;
  text-shadow:0 1px 0 rgba(255,255,255,.75),0 8px 26px rgba(180,110,80,.25)}
.hero .h-sub{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:#A0455E}
.hero .h-verse{font-size:.85rem;color:#6E4A2A;font-style:italic;max-width:560px;margin:1.1rem auto 0}
.hero .h-author{font-family:var(--ui);font-size:.74rem;letter-spacing:.22em;color:#5A3A55;margin-top:1rem;text-transform:uppercase}
.begin{margin-top:1.45rem;background:linear-gradient(180deg,#E3C87E,#C9A24B);color:#3D2145;border:1px solid #B58F3E;border-radius:9px;
  padding:.74rem 1.8rem;font-weight:600;font-size:.92rem;cursor:pointer;letter-spacing:.05em;box-shadow:0 6px 16px -8px rgba(140,90,30,.6)}
.begin:hover{background:linear-gradient(180deg,#EDD79A,#D4AF5C)}
.phasecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem;margin-top:1.6rem}
.pcard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:11px;padding:1.25rem 1.3rem 1.15rem;cursor:pointer;text-align:left;font-family:var(--ui)}
.pcard:hover{box-shadow:0 10px 26px -16px rgba(31,56,100,.4);transform:translateY(-2px);transition:all .18s}
.pcard .tag{font-size:.66rem;font-weight:600;letter-spacing:.2em;color:var(--pc);text-transform:uppercase}
.pcard h3{font-family:var(--serif);color:var(--navy);font-size:1.28rem;margin:.35rem 0 .3rem;font-weight:700}
.pcard p{font-size:.8rem;color:var(--muted);margin:.2rem 0 .75rem;line-height:1.5}
.pcard .meter{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden}
.pcard .meter i{display:block;height:100%;width:0%;background:var(--pc);transition:width .4s}
.pcard .pct{font-size:.68rem;color:var(--muted);margin-top:.35rem;display:block}
@media(max-width:1080px){.phasecards{grid-template-columns:1fr}}
@media(max-width:860px){
  #sidebar{position:fixed;left:-320px;z-index:20;transition:left .25s;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  #sidebar.open{left:0}
  #menu-btn{display:block}
  #page{padding:1.4rem 1rem 2.4rem}
  .content{padding:1.7rem 1.35rem 2rem}
}
</style>
</head>

ng, Phase III Professional Formation\" style=\"width:100%;border:1px solid #e3dbc8;border-radius:10px;margin:1.2rem 0;\">\n<h3>The progressive logic of the six phases<\/h3>\n<p><strong>Phase I — Biblical Foundations &amp; Discipleship<\/strong> (Bible Study Training Curriculum, 5 modules, ~23 sessions). Before anyone can counsel others, they must know Christ, the gospel of grace, repentance and obedience, personal relationship with God, and the holiness of the church. Phase I builds the <em>disciple<\/em>.<\/p>\n<p><strong>Phase II — Applied Ministry &amp; Healing: The Vacuum Effect<\/strong> (12 units). With the biblical foundation laid, the student turns to the wounds people actually carry — emotional, relational, and spiritual voids, generational trauma, and the residue of life's trials — studied through the dual lenses of Pastoral Counseling and Biblical Integrated Psychology, using Thomas E. Walker's book <em>The Vacuum Effect: Surviving the Shift When It Happens<\/em>. Phase II builds the <em>minister of healing<\/em>.<\/p>\n<p><strong>Phase III — Professional Formation: Integrated Christian Counseling Training<\/strong> (5 modules, 30 lessons, 15 weeks). The final phase professionalizes the calling: integration models, therapeutic frameworks through a biblical lens, spiritual formation in session, trauma and grief care, specialized populations, and a supervised capstone. Phase III builds the <em>integrated Christian counselor<\/em>.<\/p>\n<p><strong>Phase IV — Now Is the Time to Believe<\/strong> (12 units + the Salvation Invitation). Built on Thomas E. Walker's book <em>Now Is the Time to Believe<\/em> (2015), this inspirational phase moves through four movements — HOPE, FAITH, PEACE, and GRACE — from \"now is the acceptable time,\" through surrender, strength, and calling, to the great distinction that closes the book: it's not about a religion, it's about a relationship. Phase IV builds the <em>believing witness<\/em>.<\/p>\n<p><strong>Phase V — It Shouldn't Be in the Church: The Saga Continues<\/strong> (orientation + 9 discernment units + closing charge). Built on the 2020 sequel, this advanced phase traces the saga from the Pharisees to the present and confronts the nine \"ITs\" — denominationalism, false teachings, ungodliness, complacency, entitlement, self-pride, the spirit of witchcraft, and the twin spirits of fear — closing with \"The Church Within.\" Phase V builds the <em>watchful shepherd<\/em>.<\/p><p><strong>Phase VI — Generation X &amp; the Church: Now All Hell Broke Loose<\/strong> (6 lessons, ~3 weeks). Built on Thomas E. Walker's book <em>Generation X Left the Church, Now All Hell Broke Loose: The Last Connection to the Old-Time Way<\/em> (2025), this capstone phase examines how Generation X — the last generational bridge to the old-time way — departed institutional church life, what spiritual crisis cascaded through Millennials, Gen Z, and Alpha as a result, and how counselors and churches minister to the church-hurt and religiously disaffiliated. Phase VI builds the <em>generational restorer<\/em>.<\/p>\n<h3>How to use this portal<\/h3>\n<p><strong>1. Choose your track.<\/strong> Church discipleship groups may use Phase I alone; ministry training programs may run Phases I–II; counselor-training students complete Phases I–III in order; Phase IV serves the whole congregation as an inspirational track, and Phase V is the advanced discernment track for maturing leaders.<\/p>\n<p><strong>2. Work through each lesson page.<\/strong> Phase I modules include homework and facilitator answer keys. Phase II units include Pastoral Counseling and Biblical Integrated Psychology perspectives plus discussion threads. Phase III lessons include formats, durations, learning outcomes, and graded assessments.<\/p>\n<p><strong>3. Mark lessons complete.<\/strong> Use the <em>Mark complete<\/em> button on each module or unit page — your progress appears in the sidebar and on the home page. Progress is saved on this device when your browser allows it.<\/p>\n<p><strong>4. Use the Resource Library.<\/strong> The library consolidates all recommended reading — peer-reviewed journals, open-access articles, books, and digital resources — organized to serve every phase.<\/p>\n<p><strong>Recommended full-program timeline:<\/strong> approximately 18–20 months of weekly meetings (Phase I ≈ 6 months; Phase II ≈ 12 weeks; Phase III = 15 weeks; Phase IV ≈ 13 weeks; Phase V ≈ 11 weeks; Phase VI ≈ 3 weeks), though each phase — and each module or unit within it — also stands alone.<\/p>\n", "track": false}, "enroll": {"title": "Enroll in the Training Program", "group": "top", "html": "\n<p class=\"lede\">Enrollment is by suggested donation, which supports the ministry and keeps this training available: <b>$50.00 for Full Access<\/b> (all six phases), or <b>$10.00 per individual phase<\/b>. No one is turned away for lack of funds — note it in the message box and enroll anyway.<\/p>\n<form id=\"enroll-form\" class=\"enroll\">\n  <label>Full name<input name=\"name\" required autocomplete=\"name\"><\/label>\n  <label>Email<input name=\"email\" type=\"email\" required autocomplete=\"email\"><\/label>\n  <label>Phone (optional)<input name=\"phone\" autocomplete=\"tel\"><\/label>\n  <label>Which enrollment are you choosing?\n    <select name=\"track\" id=\"enroll-track\">\n      <option data-amt=\"50\">Full Access — All Six Phases ($50.00 donation)<\/option>\n      <option data-amt=\"10\">Phase I — Biblical Foundations ($10.00 donation)<\/option>\n      <option data-amt=\"10\">Phase II — The Vacuum Effect ($10.00 donation)<\/option>\n      <option data-amt=\"10\">Phase III — Christian Counseling Training ($10.00 donation)<\/option>\n      <option data-amt=\"10\">Phase IV — Now Is the Time to Believe ($10.00 donation)<\/option>\n      <option data-amt=\"10\">Phase V — The Saga Continues ($10.00 donation)<\/option>\n      <option data-amt=\"10\">Phase VI — Generation X &amp; the Church ($10.00 donation)<\/option>\n    <\/select><\/label>\n  <div id=\"enroll-donation\" style=\"font-family:var(--ui);background:var(--paper);border:1px solid var(--gold);border-radius:9px;padding:.8rem 1rem;font-size:.9rem\">\n    Suggested enrollment donation: <b id=\"enroll-amt\">$50.00<\/b>\n    <div style=\"font-size:.78rem;color:var(--muted);margin-top:.3rem\" id=\"enroll-give-note\">After you submit, the ministry will send giving instructions with your welcome email.<\/div>\n  <\/div>\n  <label>How did you hear about the portal? (optional)<input name=\"heard\"><\/label>\n  <label>Anything you’d like us to know or pray about? (optional)<textarea name=\"message\" rows=\"3\"><\/textarea><\/label>\n  <input type=\"hidden\" name=\"donation\" id=\"enroll-donation-field\" value=\"$50.00 (Full Access)\">\n  <p style=\"display:none\"><label>Leave blank<input name=\"bot-field\"><\/label><\/p>\n  <button type=\"submit\" class=\"rdb-btn gold\" style=\"font-size:.95rem;padding:.7rem 1.6rem\">Submit Enrollment<\/button>\n  <span id=\"enroll-status\" role=\"status\"><\/span>\n<\/form>\n", "track": false}, "p1-overview": {"title": "Phase I Overview — How to Use These Modules", "group": "p1", "html": "<p>This curriculum organizes the ministry’s Bible study library into five stand-alone training modules. Each module is a complete training plan: a detailed introduction, a session-by-session schedule, the major scripture readings, suggested books for deeper study, main discussion thread topics for group conversation (in person or online), written homework assignments, and a facilitator’s answer key.<\/p>\n<p>Recommended sequence: Module 1 (Getting to Know Jesus) lays the Christological foundation; Module 2 (Galatians) establishes the doctrine of justification by faith; Module 3 (Josiah / If My People) applies repentance, obedience, and revival; Module 4 (Relationship with Christ) deepens personal discipleship; and Module 5 (It Shouldn’t Be in the Church) addresses the corporate life and holiness of the assembly. The full track runs approximately 23 sessions (about six months of weekly meetings), though each module also stands on its own.<\/p>\n<p>How to use each module: (1) The facilitator reads the introduction aloud or summarizes it to open Session 1. (2) Assign the scripture readings and homework a week ahead of each session. (3) Use the discussion threads to drive the meeting — they work equally well as in-person questions or as posted threads in an online group. (4) Collect written homework and review with the answer key; the key is for leaders and lists acceptable answers, not scripts. (5) Suggested books are optional enrichment — one per module is plenty for most groups.<\/p>\n", "track": false}, "p1-m1": {"title": "Module 1 — Getting to Know Jesus: Who Do You Say That I Am?", "group": "p1", "html": "<p><strong>Format:<\/strong> 5 sessions (weekly, 60–90 minutes each) — foundational Christology track<\/p>\n<p><strong>Source material:<\/strong> “Getting to Know Jesus Series” (January 2014), “Who is Jesus?”, “Where does Christianity’s true origin begin?”, and the Matthew 21 triumphal-entry study.<\/p>\n<h3 id=\"module-introduction\">Module Introduction<\/h3>\n<p>When we think of Christ, who do we think He is? Across nations and cultures, Jesus has been placed in many categories — a prophet, a great teacher, a resistance leader, merely a man. But the question Jesus asked His own disciples at Caesarea Philippi remains the most important question any person will ever answer: “But whom say ye that I am?” (Matthew 16:15). Peter’s Spirit-revealed confession — “Thou art the Christ, the Son of the living God” — is the rock on which the Church is built.<\/p>\n<p>This module walks trainees through who Christ is according to Scripture: His identity confessed in the Gospels, His person foretold in Old Testament prophecy, His kingship revealed at the triumphal entry, and the historical roots of the Christian faith from Abraham’s monotheism to the disciples first being called “Christians” at Antioch (Acts 11:26). The module closes with the believer’s ambassadorship: attending a local church and carrying the title “Christian” does not guarantee knowledge of Christ. A personal relationship with Him — and the ability to defend the faith in a way that draws others to Him — is the goal.<\/p>\n<p>By the end of this module, each trainee should be able to (1) articulate Peter’s confession and its significance, (2) cite key Old Testament prophecies fulfilled in Jesus, (3) explain the meaning of “Hosanna” and the triumphal entry, (4) trace the origins of Christianity from Abraham to Antioch, and (5) describe the cost and calling of discipleship in Matthew 16:24–25.<\/p>\n<h3 id=\"training-plan--session-by-session\">Training Plan — Session by Session<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Session<\/strong><\/th>\n<th><strong>Title &amp; Focus<\/strong><\/th>\n<th><strong>Primary Scripture Readings<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Session 1<\/td>\n<td>Whom Do Men Say That I Am? — Popular opinion vs. personal confession; Peter’s revelation from the Father.<\/td>\n<td>Matthew 16:13–28<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 2<\/td>\n<td>Christ in the Old Testament — Prophecies of the Messiah; the promised Savior foretold.<\/td>\n<td>Isaiah 7:14; Isaiah 53; Isaiah 61:1–2; Micah 5:2; Psalm 22<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 3<\/td>\n<td>Jesus Comes to Jerusalem as King — The triumphal entry, “Hosanna,” and cleansing the temple.<\/td>\n<td>Matthew 21:1–17; Zechariah 9:9; Psalm 118:25–26; Psalm 8:1–4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 4<\/td>\n<td>Origins of the Faith — From Abram’s monotheism to the church at Antioch; “Before Abraham was, I AM.”<\/td>\n<td>Genesis 12; Joshua 24; Acts 11:19–26; John 1:1–14; John 8:58; John 14:6<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 5<\/td>\n<td>Ambassadors of Christ — Taking up the cross; knowing Christ personally and defending the faith.<\/td>\n<td>Matthew 16:24–25; 2 Corinthians 5:18–20; 1 Peter 3:15; 2 Peter 3:9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"major-scripture-readings-for-the-module\">Major Scripture Readings for the Module<\/h3>\n<ul>\n<li><p>Matthew 16:13–28 — Peter’s confession; the keys of the kingdom; the cost of discipleship<\/p><\/li>\n<li><p>Matthew 21:1–17 — The triumphal entry and the cleansing of the temple<\/p><\/li>\n<li><p>Isaiah 7:14; 53; 61:1–2 — Messianic prophecy of the virgin birth, suffering servant, and anointed deliverer<\/p><\/li>\n<li><p>Zechariah 9:9 and Psalm 118:25–26 — The King on a donkey; “Hosanna” (“please save us”)<\/p><\/li>\n<li><p>John 1:1–14; John 8:58; John 14:6 — The Word made flesh; the great I AM; the way, the truth, and the life<\/p><\/li>\n<li><p>Genesis 12:1–3; Joshua 24 — Abram and the call to serve the one true God<\/p><\/li>\n<li><p>Acts 11:26 — Disciples first called Christians at Antioch<\/p><\/li>\n<li><p>2 Peter 3:9 — God’s patience, “not willing that any should perish”<\/p><\/li>\n<\/ul>\n<h3 id=\"suggested-books--study-resources\">Suggested Books &amp; Study Resources<\/h3>\n<ul>\n<li><p><strong>More Than a Carpenter —<\/strong> Josh McDowell — a concise, accessible defense of who Jesus claimed to be; ideal for new believers.<\/p><\/li>\n<li><p><strong>The Case for Christ —<\/strong> Lee Strobel — an investigative-journalism approach to the evidence for Jesus’ identity and resurrection.<\/p><\/li>\n<li><p><strong>Basic Christianity —<\/strong> John Stott — a classic walk through the person, claims, and work of Christ.<\/p><\/li>\n<li><p><strong>Knowing God —<\/strong> J. I. Packer — moves the student from knowing about God to knowing Him personally.<\/p><\/li>\n<li><p><strong>Called to Worship: The Biblical Foundations of Our Response to God’s Call —<\/strong> Vernon M. Whaley — cited in your source study; connects knowing Christ with rightly worshiping Him.<\/p><\/li>\n<\/ul>\n<h3 id=\"main-discussion-thread-topics\">Main Discussion Thread Topics<\/h3>\n<h3 id=\"homework-assignments\">Homework Assignments<\/h3>\n<p><em>Complete before the final session. Written answers should cite at least one scripture per question.<\/em><\/p>\n<h3 id=\"facilitators-answer-key\">Facilitator's Answer Key<\/h3>\n<p><em>For leaders only. Answers are keyed to the homework questions above; accept reasonable variations expressed in the student's own words.<\/em><\/p>\n", "track": true}, "p1-m2": {"title": "Module 2 — Freely Justified in Christ: The Book of Galatians", "group": "p1", "html": "<p><strong>Format:<\/strong> 6 sessions (one per chapter, weekly, 75–90 minutes each) — doctrine of justification by faith<\/p>\n<p><strong>Source material:<\/strong> Galatians Discussion Studies (July–September 2014): “Connected by Faith,” “Faith vs Legalism,” “What Have You Done Wrong!,” “Old Bondage vs. New Liberty,” “Christian Love and Purity,” “Your Love is a Supernatural Thing,” plus the commentary “Letting the Main Thing Be the Main Thing.”<\/p>\n<h3 id=\"module-introduction\">Module Introduction<\/h3>\n<p>The apostle Paul founded the Galatian churches around A.D. 45–48 and wrote this letter around A.D. 51–53 with a burning purpose: certain teachers — the Judaizers — were telling Gentile converts that faith in Christ was not enough, that circumcision and observance of the Law of Moses were required to be truly saved. Paul answers with the thunderclap of the gospel: “For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: not of works, lest any man should boast” (Ephesians 2:8–9).<\/p>\n<p>This module moves chapter by chapter through Galatians. Trainees will see Paul defend his apostleship (chapter 1), confront legalism even in Peter (chapter 2), expose the impossibility of law-keeping as a path to righteousness (chapter 3), contrast the old bondage with new liberty through the allegory of Hagar and Sarah and the unconditional Abrahamic Covenant (chapter 4), learn to walk in the Spirit and bear its fruit rather than the works of the flesh (chapter 5), and finally practice supernatural love — bearing one another’s burdens and sowing to the Spirit (chapter 6).<\/p>\n<p>The heartbeat of the whole letter is this: we are justified freely by faith through grace, not by works — and that freedom is not a license for the flesh but the power to love. Trainees should finish the module able to explain justification by faith, identify modern forms of legalism, distinguish the works of the flesh from the fruit of the Spirit, and describe what “your love is a supernatural thing” means in the life of the church.<\/p>\n<h3 id=\"training-plan--session-by-session\">Training Plan — Session by Session<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Session<\/strong><\/th>\n<th><strong>Title &amp; Focus<\/strong><\/th>\n<th><strong>Primary Scripture Readings<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Session 1<\/td>\n<td>Connected by Faith (Galatians 1) — Paul’s apostleship “not of men”; grace as unmerited favor; no other gospel.<\/td>\n<td>Galatians 1; 1 Samuel 16:7; Hebrews 11:1, 6; Romans 10:8–17; Ephesians 2:8–9<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 2<\/td>\n<td>Faith vs. Legalism (Galatians 2) — The Jerusalem Council; Paul confronts Peter; justified by faith, not works of the law.<\/td>\n<td>Galatians 2; Acts 15:1–11; Acts 13:1–3; Romans 8:30; Genesis 15:1–6; Deuteronomy 27:26<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 3<\/td>\n<td>What Have You Done Wrong! (Galatians 3) — “O foolish Galatians!”; the 613 laws no one could keep; the law as schoolmaster to Christ.<\/td>\n<td>Galatians 3; Romans 3:23; Matthew 5:17; James 2:10; Leviticus 18; Deuteronomy 22; Ephesians 6:10–18<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 4<\/td>\n<td>Old Bondage vs. New Liberty (Galatians 4) — Hagar and Sarah: two covenants; the unconditional Abrahamic Covenant; sons, not slaves.<\/td>\n<td>Galatians 4; Genesis 12:1–3; Genesis 15:18–21; 2 Corinthians 3:6, 17; Jeremiah 31:31–34; Hebrews 8:7–13; Romans 8:1–39<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 5<\/td>\n<td>Christian Love and Purity (Galatians 5) — Liberty is not license; works of the flesh vs. fruit of the Spirit; walking in sanctification.<\/td>\n<td>Galatians 5; Mark 12:29–31; James 3:2–8; James 4:6; Matthew 5:3–11; 1 Thessalonians 4:1–12<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 6<\/td>\n<td>Your Love Is a Supernatural Thing (Galatians 6) — Bearing one another’s burdens; sowing and reaping; doing good to the household of faith.<\/td>\n<td>Galatians 6; 1 Corinthians 13:4–13; Romans 15:1–7; Matthew 5:9; 7:12; Ephesians 4:32; 1 Peter 4:10; 3:8; Zechariah 7:10<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"major-scripture-readings-for-the-module\">Major Scripture Readings for the Module<\/h3>\n<ul>\n<li><p>Galatians 1–6 — the complete letter, read one chapter per session<\/p><\/li>\n<li><p>Ephesians 2:8–9 — salvation by grace through faith, not of works<\/p><\/li>\n<li><p>Galatians 5:19–21 — the works of the flesh<\/p><\/li>\n<li><p>Galatians 5:22–26 — the fruit of the Spirit<\/p><\/li>\n<li><p>Genesis 12:1–3 and 15:18–21 — the Abrahamic Covenant<\/p><\/li>\n<li><p>Romans 3:23 and 10:8–17 — all have sinned; faith comes by hearing<\/p><\/li>\n<li><p>2 Corinthians 3:17 — “where the Spirit of the Lord is, there is liberty”<\/p><\/li>\n<li><p>Galatians 6:7–10 — sowing and reaping; not growing weary in doing good<\/p><\/li>\n<li><p>Luke 23:34 — Christ’s supernatural, forgiving love from the cross<\/p><\/li>\n<\/ul>\n<h3 id=\"suggested-books--study-resources\">Suggested Books &amp; Study Resources<\/h3>\n<ul>\n<li><p><strong>Commentary on Galatians —<\/strong> Martin Luther — the classic Reformation exposition of justification by faith; Luther called Galatians his “Katie von Bora.”<\/p><\/li>\n<li><p><strong>The Message of Galatians (The Bible Speaks Today) —<\/strong> John Stott — clear, pastoral, verse-by-verse guidance ideal for group leaders.<\/p><\/li>\n<li><p><strong>Galatians For You —<\/strong> Timothy Keller — devotional-level commentary connecting the gospel of grace to daily life and modern legalism.<\/p><\/li>\n<li><p><strong>Be Free (Galatians) —<\/strong> Warren W. Wiersbe — an approachable study workbook well suited to small groups.<\/p><\/li>\n<li><p><strong>The Moody Handbook of Theology —<\/strong> Paul Enns — for facilitators wanting deeper background on law, grace, and covenant theology.<\/p><\/li>\n<\/ul>\n<h3 id=\"main-discussion-thread-topics\">Main Discussion Thread Topics<\/h3>\n<h3 id=\"homework-assignments\">Homework Assignments<\/h3>\n<p><em>One assignment per chapter; complete each before its session. Cite chapter and verse in every answer.<\/em><\/p>\n<h3 id=\"facilitators-answer-key\">Facilitator's Answer Key<\/h3>\n<p><em>For leaders only. Answers are keyed to the homework questions above; accept reasonable variations expressed in the student's own words.<\/em><\/p>\n", "track": true}, "p1-m3": {"title": "Module 3 — If My People Who Are Called: Josiah, Revival, Repentance & Obedience", "group": "p1", "html": "<p><strong>Format:<\/strong> 4 sessions (weekly, 60–75 minutes each) — Reflections of Grace revival track<\/p>\n<p><strong>Source material:<\/strong> “Josiah and the Revival,” “Clearing a Path for the Lord” (Parts 1–2), “Obedience Is Better” (Part 3), and “Preparing Your Heart and Mind for God’s Love and Grace” from the “If My People Who Are Called” series (June 2014).<\/p>\n<h3 id=\"module-introduction\">Module Introduction<\/h3>\n<p>Josiah became king of Judah at eight years old, and in his day God used him to lead one of the greatest revivals in Israel’s history. The nation had drifted so far into idolatry that the very Book of the Law lay forgotten in the temple walls. When it was found during the temple’s restoration and read to the king, Josiah tore his clothes in repentance, sought the word of the Lord through the prophetess Huldah, and led the people to renew covenant with God — cleansing the temple, destroying the idols, and restoring the Passover (2 Chronicles 34–35).<\/p>\n<p>This module uses Josiah’s story as a template for personal and corporate revival built on 2 Chronicles 7:14: “If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.” Trainees will walk the same path Josiah walked: hearing the Word, genuine repentance, clearing a path for the Lord in the heart, and obedience — with Deuteronomy 28 laying out the blessings of obedience and the curses of disobedience.<\/p>\n<p>The module closes devotionally, equipping each trainee with a pattern of daily prayer (Psalm 51), affirmation (Romans 8 and 12), and promise (2 Peter 3:9; Acts 2:38; Romans 10:9–13) — preparing the heart and mind for God’s love and grace. The aim is not information but revival: a revived worshiper, a revived home, and a revived church that worships God in spirit and in truth.<\/p>\n<h3 id=\"training-plan--session-by-session\">Training Plan — Session by Session<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Session<\/strong><\/th>\n<th><strong>Title &amp; Focus<\/strong><\/th>\n<th><strong>Primary Scripture Readings<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Session 1<\/td>\n<td>Josiah and the Revival — The boy king; finding the Book of the Law; Huldah’s word; national repentance and the restored Passover.<\/td>\n<td>2 Chronicles 34; 34:29–33; 35:1–19; 1 Kings 13:2–3; Deuteronomy 28:15–68<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 2<\/td>\n<td>Clearing a Path for the Lord — Repentance that prepares the heart; “Speak to my heart, Lord”; worship in spirit and truth.<\/td>\n<td>Psalm 100:2–3; Psalm 51; 2 Chronicles 7:14; 2 Peter 3:9; Romans 3:23–26; 12:1–3; Matthew 3:1–12; 11:28–29; Acts 2:36–39<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 3<\/td>\n<td>Obedience Is Better — The blessings of obedience and curses of disobedience; trusting God’s plan over our own understanding.<\/td>\n<td>Deuteronomy 28:1–15 (blessings); Deuteronomy 28:15–68 (curses); 2 Chronicles 7:14; John 3:16<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 4<\/td>\n<td>Preparing Your Heart and Mind — A daily pattern: prayer of cleansing, affirmation of no condemnation, and standing on the promise.<\/td>\n<td>Psalm 51:1–3, 10–11; Psalm 119:10–12; Psalm 41:4; Romans 8:1, 5–8; Romans 12:1–2; 2 Peter 3:9; Acts 2:38; Romans 10:9–13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"major-scripture-readings-for-the-module\">Major Scripture Readings for the Module<\/h3>\n<ul>\n<li><p>2 Chronicles 34–35 — Josiah’s reforms, the found Book of the Law, and the great Passover<\/p><\/li>\n<li><p>2 Chronicles 7:14 — the classic revival promise: humble, pray, seek, turn<\/p><\/li>\n<li><p>Deuteronomy 28 — blessings of obedience (vv. 1–14) and curses of disobedience (vv. 15–68)<\/p><\/li>\n<li><p>Psalm 51 — David’s prayer of repentance: “Create in me a clean heart, O God”<\/p><\/li>\n<li><p>Psalm 100:2–3 — serving the Lord with gladness; coming before His presence with singing<\/p><\/li>\n<li><p>Romans 12:1–2 — living sacrifices; transformed by the renewing of the mind<\/p><\/li>\n<li><p>Romans 8:1, 5–8 — no condemnation; the carnal mind vs. the spiritual mind<\/p><\/li>\n<li><p>2 Peter 3:9 and Acts 2:38 — God’s patience toward repentance; repent and be baptized<\/p><\/li>\n<li><p>Romans 10:9–13 — confess and believe; “whosoever shall call upon the name of the Lord shall be saved”<\/p><\/li>\n<\/ul>\n<h3 id=\"suggested-books--study-resources\">Suggested Books &amp; Study Resources<\/h3>\n<ul>\n<li><p><strong>Revival —<\/strong> Richard Owen Roberts — a sobering classic on what genuine, God-sent revival is and what it costs.<\/p><\/li>\n<li><p><strong>Fresh Wind, Fresh Fire —<\/strong> Jim Cymbala — the story of prayer-driven revival at Brooklyn Tabernacle; pairs well with the “clearing a path” sessions.<\/p><\/li>\n<li><p><strong>Brokenness: The Heart God Revives —<\/strong> Nancy DeMoss Wolgemuth — on humility and repentance as the doorway to revival.<\/p><\/li>\n<li><p><strong>The Pursuit of God —<\/strong> A. W. Tozer — cultivating a heart that hungers for God’s presence.<\/p><\/li>\n<li><p><strong>Experiencing God —<\/strong> Henry Blackaby &amp; Claude King — knowing and obeying God’s will; excellent companion for the obedience session.<\/p><\/li>\n<\/ul>\n<h3 id=\"main-discussion-thread-topics\">Main Discussion Thread Topics<\/h3>\n<h3 id=\"homework-assignments\">Homework Assignments<\/h3>\n<p><em>Sessions 1–3 have written homework; Session 4’s assignment is devotional practice with a written reflection.<\/em><\/p>\n<h3 id=\"facilitators-answer-key\">Facilitator's Answer Key<\/h3>\n<p><em>For leaders only. Answers are keyed to the homework questions above; accept reasonable variations expressed in the student's own words.<\/em><\/p>\n", "track": true}, "p1-m4": {"title": "Module 4 — Understanding Your Relationship with Christ", "group": "p1", "html": "<p><strong>Format:<\/strong> 4 sessions (weekly, 60 minutes each) — discipleship and identity track<\/p>\n<p><strong>Source material:<\/strong> “Understanding Your Relationship with Christ” Bible Study (ROGOM, February 2013), including the relationship definition study, adoption and heirship scriptures, the Paul–Timothy example, and the communion passages.<\/p>\n<h3 id=\"module-introduction\">Module Introduction<\/h3>\n<p>God created us to worship Him and to keep an everlasting relationship with Him — and in return we would forever have dominion over His creation. But through the deception of Eve and the complicity of Adam, that relationship was broken. Thanks be to God, who had mercy on us and sent His Son Jesus to give us grace: now we have the opportunity to be reconciled to Him and to rebuild the relationship we were made for.<\/p>\n<p>This module defines what a relationship with Christ actually is — not church attendance, not a title, but connection and kinship: “the condition or fact of being related; connection by blood.” Scripture describes believers as predestined unto adoption (Ephesians 1:5), God’s own workmanship created for good works (Ephesians 2:10), and joint-heirs with Christ (Romans 8:17). Trainees will study a model discipling relationship in Paul and Timothy — “as a son with the father, he hath served with me in the gospel” — and then move to the blood of Jesus that makes kinship possible: the new covenant in His blood, cleansing from all sin, remembered together at the communion table.<\/p>\n<p>The goal of this module is that every trainee moves from knowing about Christ to abiding in Him: “If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you” (John 15:7). Sessions build from creation and fall, to adoption and heirship, to the blood and the covenant meal, to daily abiding through the Word, worship, and praise.<\/p>\n<h3 id=\"training-plan--session-by-session\">Training Plan — Session by Session<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Session<\/strong><\/th>\n<th><strong>Title &amp; Focus<\/strong><\/th>\n<th><strong>Primary Scripture Readings<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Session 1<\/td>\n<td>Created for Relationship — Made to worship; the fall through deception and complicity; mercy and grace open the way back.<\/td>\n<td>Genesis 1–3 (overview); Ephesians 1:5; Ephesians 2:10<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 2<\/td>\n<td>Adopted Sons &amp; Joint-Heirs — What adoption means; heirs of God; suffering with Him to be glorified with Him; Paul and Timothy as a discipling model.<\/td>\n<td>Ephesians 1:5; Romans 8:17; Philippians 2:19–30 (Timothy &amp; Epaphroditus)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 3<\/td>\n<td>The Blood and the Covenant — Remission of sins; cleansing and fellowship in the light; the communal declaration at the Lord’s table.<\/td>\n<td>Matthew 26:28; 1 John 1:7; 1 Corinthians 11:23–25<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 4<\/td>\n<td>Abiding in Christ — The Word written on hearts; asking in His name; a lifestyle of worship, praise, and the Spirit’s infilling.<\/td>\n<td>John 15:1–11 (esp. v. 7); Hebrews 10:16; Matthew 6:9–13; James 4:8–10; Philippians 4:6–8<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"major-scripture-readings-for-the-module\">Major Scripture Readings for the Module<\/h3>\n<ul>\n<li><p>Ephesians 1:5 — predestined unto the adoption of children by Jesus Christ<\/p><\/li>\n<li><p>Ephesians 2:10 — His workmanship, created in Christ Jesus unto good works<\/p><\/li>\n<li><p>Romans 8:17 — heirs of God, and joint-heirs with Christ<\/p><\/li>\n<li><p>Philippians 2:19–30 — Paul, Timothy, and Epaphroditus: relationship in gospel service<\/p><\/li>\n<li><p>Matthew 26:28 — “my blood of the new testament, shed for many for the remission of sins”<\/p><\/li>\n<li><p>1 John 1:7 — walking in the light; the blood of Jesus cleanses from all sin<\/p><\/li>\n<li><p>1 Corinthians 11:23–25 — the Lord’s Supper: “this do in remembrance of me”<\/p><\/li>\n<li><p>John 15:7 — abiding in Christ and His words abiding in us<\/p><\/li>\n<li><p>Hebrews 10:16 — God’s laws written on hearts and minds<\/p><\/li>\n<li><p>Philippians 4:6–8 and James 4:8–10 — prayer, peace, and drawing near to God<\/p><\/li>\n<\/ul>\n<h3 id=\"suggested-books--study-resources\">Suggested Books &amp; Study Resources<\/h3>\n<ul>\n<li><p><strong>Abide in Christ —<\/strong> Andrew Murray — thirty-one daily readings on John 15; the classic on living in union with Christ.<\/p><\/li>\n<li><p><strong>Knowing God —<\/strong> J. I. Packer — the difference between knowing about God and being known by Him as Father.<\/p><\/li>\n<li><p><strong>My Heart—Christ’s Home —<\/strong> Robert Boyd Munger — a short, powerful picture of giving Christ every room of your life; ideal group read.<\/p><\/li>\n<li><p><strong>The Practice of the Presence of God —<\/strong> Brother Lawrence — cultivating continual fellowship with God in ordinary life.<\/p><\/li>\n<li><p><strong>Spiritual Disciplines for the Christian Life —<\/strong> Donald S. Whitney — practical habits (Word, prayer, worship) that deepen relationship.<\/p><\/li>\n<\/ul>\n<h3 id=\"main-discussion-thread-topics\">Main Discussion Thread Topics<\/h3>\n<h3 id=\"homework-assignments\">Homework Assignments<\/h3>\n<p><em>Complete one assignment per session; the memory work is checked at the following meeting.<\/em><\/p>\n<h3 id=\"facilitators-answer-key\">Facilitator's Answer Key<\/h3>\n<p><em>For leaders only. Answers are keyed to the homework questions above; accept reasonable variations expressed in the student's own words.<\/em><\/p>\n", "track": true}, "p1-m5": {"title": "Module 5 — It Shouldn’t Be in the Church: Ecclesiology & Holiness in God’s House", "group": "p1", "html": "<p><strong>Format:<\/strong> 4 sessions (weekly, 75 minutes each) — doctrine of the church and corporate holiness track<\/p>\n<p><strong>Source material:<\/strong> “It Shouldn’t Be in the Church” study notes: the ekklesia word study, the Middle Ages church analysis (Paul Enns), the Simon Bar-Jonah / Peter character study, and the sin-in-the-church scripture set.<\/p>\n<h3 id=\"module-introduction\">Module Introduction<\/h3>\n<p>What do we think about when we hear the word “church”? The New Testament word is ekklesia — from ek (“out of”) and kaleo (“to call”) — “those called out.” Scripture uses it two ways: the local congregation of believers who assemble regularly to praise and worship, and the universal body of Christ made up of all repentant, redeemed believers regardless of age or origin. The church was born of a confession: when Simon Bar-Jonah declared, “You are the Christ, the Son of the living God,” Jesus answered, “on this rock I will build My church, and the gates of Hades shall not prevail against it” (Matthew 16:16–18).<\/p>\n<p>This module first establishes sound ecclesiology — what the church is, whose it is, and what history did with it, including where the Middle Ages church misread Matthew 16 in claiming absolute papal succession to Peter. Trainees study who Simon Bar-Jonah actually was: his call, his courage, his confession, his impulsiveness, his self-confidence — and his restoration. The foundation of the church is Christ confessed, not a man enthroned.<\/p>\n<p>The module then turns to its burden: there are things that simply should not be in the church. Willful sin after receiving the knowledge of the truth (Hebrews 10:26), the works of the flesh (Galatians 5:19–21), branches that do not abide (John 15:6), and sin leading to death versus sin not leading to death (1 John 5:16–17) — all confront a called-out people who are living like the world inside God’s house. The goal is a church that is holy in doctrine, holy in conduct, and quick to repent, restore, and love — so that the world sees the called-out ones actually walking as called out.<\/p>\n<h3 id=\"training-plan--session-by-session\">Training Plan — Session by Session<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>Session<\/strong><\/th>\n<th><strong>Title &amp; Focus<\/strong><\/th>\n<th><strong>Primary Scripture Readings<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Session 1<\/td>\n<td>What Is the Church? — Ekklesia: the called-out ones; local congregation vs. universal body; the beginning of the spiritual age after the fall.<\/td>\n<td>Matthew 16:13–20; Acts 2:41–47; 1 Corinthians 12:12–27; Ephesians 1:22–23<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 2<\/td>\n<td>Upon This Rock — Peter’s confession; the keys, binding and loosing; where the Middle Ages church went wrong on succession and authority.<\/td>\n<td>Matthew 16:13–28; Matthew 10:2; Ephesians 2:19–22; 1 Peter 2:4–9<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Session 3<\/td>\n<td>The Man Simon Bar-Jonah — Peter’s call, courage, confession, impulsiveness, self-confidence, denial, and restoration; “Get behind Me, Satan.”<\/td>\n<td>Matthew 14:28–31; Matthew 16:15–23; John 18:10; Luke 22:31–34, 54–62; John 21:15–19<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Session 4<\/td>\n<td>It Shouldn’t Be in the Church — Willful sin, works of the flesh, and fruitless branches; sin unto death vs. not unto death; repentance and restoration in God’s house.<\/td>\n<td>Hebrews 10:26–31; Galatians 5:19–21; John 15:1–8 (esp. v. 6); 1 John 5:16–17; 1 Corinthians 5:1–13; Galatians 6:1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"major-scripture-readings-for-the-module\">Major Scripture Readings for the Module<\/h3>\n<ul>\n<li><p>Matthew 16:13–28 — Peter’s confession; “on this rock I will build My church”; keys of the kingdom; “Get behind Me, Satan”<\/p><\/li>\n<li><p>Hebrews 10:26 — no more sacrifice for willful sin after receiving knowledge of the truth<\/p><\/li>\n<li><p>1 John 5:16–17 — sin leading to death and sin not leading to death<\/p><\/li>\n<li><p>John 15:6 — the branch that does not abide is cast out and withered<\/p><\/li>\n<li><p>Galatians 5:19–21 — the works of the flesh have no place among the called-out<\/p><\/li>\n<li><p>Acts 2:41–47 — the pattern of the first assembly: doctrine, fellowship, breaking of bread, prayer<\/p><\/li>\n<li><p>1 Corinthians 5 and Galatians 6:1 — dealing with sin in the church and restoring the fallen in a spirit of meekness<\/p><\/li>\n<li><p>1 Peter 2:4–9 — living stones, a holy nation, a royal priesthood<\/p><\/li>\n<\/ul>\n<h3 id=\"suggested-books--study-resources\">Suggested Books &amp; Study Resources<\/h3>\n<ul>\n<li><p><strong>The Moody Handbook of Theology —<\/strong> Paul Enns — quoted in your source notes; the ecclesiology chapters ground the ekklesia study and the historical analysis.<\/p><\/li>\n<li><p><strong>Nine Marks of a Healthy Church —<\/strong> Mark Dever — what a biblically ordered, holy congregation actually looks like.<\/p><\/li>\n<li><p><strong>Systematic Theology (chapters on the Church) —<\/strong> Wayne Grudem — accessible doctrinal depth on the nature, marks, and purity of the church.<\/p><\/li>\n<li><p><strong>The Pursuit of Holiness —<\/strong> Jerry Bridges — personal holiness as the believer’s responsibility empowered by grace.<\/p><\/li>\n<li><p><strong>Life Together —<\/strong> Dietrich Bonhoeffer — community, confession, and restoration among the called-out ones.<\/p><\/li>\n<\/ul>\n<h3 id=\"main-discussion-thread-topics\">Main Discussion Thread Topics<\/h3>\n<h3 id=\"homework-assignments\">Homework Assignments<\/h3>\n<p><em>Assignments 1–5 are written; assignment 6 is a group exercise completed in pairs before the final session.<\/em><\/p>\n<h3 id=\"facilitators-answer-key\">Facilitator's Answer Key<\/h3>\n<p><em>For leaders only. Answers are keyed to the homework questions above; accept reasonable variations expressed in the student's own words.<\/em><\/p>\n", "track": true}, "p2-intro": {"title": "Introduction & How to Use This Curriculum", "group": "p2", "html": "<p>This teaching curriculum is drawn from Thomas E. Walker's book The Vacuum Effect: Surviving the Shift When It Happens. It is designed for use in pastoral care settings, seminary classes, support groups, counseling training, and church-based educational programs.<\/p>\n<p>Each unit in this curriculum covers a key theme from the book, presenting it first from a Pastoral Counseling perspective, then from a Biblical Integrated Psychology perspective. Each unit concludes with Discussion Thread Questions suitable for online courses, small group discussions, or reflective journaling.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>About the Book<\/strong><\/p>\n<p>The Vacuum Effect explores how emotional, relational, and spiritual voids created by absent parents, family trauma, and unresolved pain shape human behavior across generations. Drawing from personal testimony, Scripture, and psychological research, Thomas Walker weaves together a framework for understanding — and breaking free from — these generational vacuums.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>About the Author<\/strong><\/p>\n<p>Thomas E. Walker holds a Master of Arts in Christian Ministry and a Master of Divinity in Pastoral Counseling from Liberty University John W. Rawlings School of Divinity. He is a Certified Mental Health Coach, a retired disabled Army Veteran, and the Pastor of Reflections of Grace Outreach Ministries in Moreno Valley, California.<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"curriculum-structure\">Curriculum Structure<\/h3>\n<p>Each unit follows a consistent three-part format:<\/p>\n<ul>\n<li><p>Pastoral Counseling Perspective — How a pastor or Christian counselor approaches this theme in ministry and care<\/p><\/li>\n<li><p>Biblical Integrated Psychology Perspective — How this theme is understood through the lens of psychology integrated with Biblical truth<\/p><\/li>\n<li><p>Discussion Thread Questions — Prompts for online or in-person discussion, reflection, and engagement<\/p><\/li>\n<\/ul>\n<h3 id=\"units-at-a-glance\">Units at a Glance<\/h3>\n<ol type=\"1\">\n<li><p>Unit 1: Understanding the Vacuum Effect — The Residue of Life’s Trials (Introduction)<\/p><\/li>\n<li><p>Unit 2: Surviving the Bad Situation (Chapter 1)<\/p><\/li>\n<li><p>Unit 3: The Deceitful Heart — Masks, Wounds, and Healing (Chapter 2)<\/p><\/li>\n<li><p>Unit 4: The Vacuum of Identity (Chapter 3)<\/p><\/li>\n<li><p>Unit 5: The Vacuum of Love (Chapter 4)<\/p><\/li>\n<li><p>Unit 6: The Vacuum of Joy (Chapter 5)<\/p><\/li>\n<li><p>Unit 7: The Vacuum of Purpose (Chapter 6)<\/p><\/li>\n<li><p>Unit 8: Swaddling, Security, and Early Attachment (Chapter 7)<\/p><\/li>\n<li><p>Unit 9: Time, Healing, and the Process of Recovery (Chapter 8)<\/p><\/li>\n<li><p>Unit 10: Spiritual Vacuum — Faith in the Midst of Emptiness (Chapter 9)<\/p><\/li>\n<li><p>Unit 11: Remediation — Healing Pathways for Men, Women, and Children<\/p><\/li>\n<li><p>Unit 12: Family, Friendship, and Breaking Generational Curses<\/p><\/li>\n<\/ol>\n", "track": false}, "p2-u1": {"title": "Unit 1: Understanding the Vacuum Effect", "group": "p2", "html": "<p><em>The Residue of Life’s Trials — Introduction &amp; Free Space<\/em><\/p>\n<p>Thomas Walker introduces the Vacuum Effect through both scientific analogy and personal narrative. A vacuum in animal populations — where removal of creatures creates a temporary dip quickly filled by others — mirrors the emotional and relational voids left in human lives when a parent, caregiver, or anchor figure is absent. He introduces key concepts: free space, residue, generational curses, and the danger of filling voids with negative substitutes.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>Vacuum Effect: A space devoid of essential relational matter, creating emotional instability<\/p>\n<p>Residue: The lasting emotional and behavioral traces left by trauma, loss, and absence<\/p>\n<p>Free Space: The void period offering both opportunity and vulnerability<\/p>\n<p>Generational Curse: Patterns of pain and dysfunction repeated across bloodlines<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>From a Pastoral Counseling standpoint, the Vacuum Effect calls the pastor-counselor to compassionate witness. The pastor must recognize that many people presenting for counsel are carrying invisible residue from childhood voids — absent fathers, overwhelmed single mothers, poverty, domestic violence — that now manifest as relational dysfunction, spiritual emptiness, and self-destructive patterns.<\/p>\n<p>Pastoral counselors are called to:<\/p>\n<ul>\n<li><p>Create safe, non-judgmental spaces where congregants can name their voids without shame<\/p><\/li>\n<li><p>Listen for the language of the vacuum: longing, abandonment, emptiness, searching<\/p><\/li>\n<li><p>Connect personal pain narratives to God’s redemptive story of restoration<\/p><\/li>\n<li><p>Introduce Scripture as a living word of hope without bypassing the real pain (Matthew 7:7-8: Ask, Seek, Knock)<\/p><\/li>\n<li><p>Recognize generational patterns and help families name and interrupt them<\/p><\/li>\n<\/ul>\n<p>Walker’s personal testimony — growing up fatherless on Chicago’s Westside — is a powerful case study for pastoral counselors in understanding how community vacuums are experienced at the individual level. The pastor walks alongside people not merely as a spiritual authority but as a fellow journeyer who understands that pain finds a way to show up when we least expect it.<\/p>\n<blockquote>\n<p><em>Key Scripture: “Ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you.” — Matthew 7:7-8<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>Biblical Integrated Psychology bridges psychological science with Biblical truth to understand the Vacuum Effect as both a developmental and spiritual phenomenon. Psychologically, the vacuum is understood through attachment theory, adverse childhood experiences (ACEs), and trauma-informed frameworks. Biblically, it is understood through the doctrines of creation, the fall, redemption, and sanctification.<\/p>\n<p>Integrated psychological principles at work in this unit:<\/p>\n<ul>\n<li><p>Attachment Theory (Collins, 2007): Children who experience parental absence show anxiety, emotional aloofness, and clinging behaviors in relationships throughout life<\/p><\/li>\n<li><p>Generational trauma: The cumulative effect of unresolved parental pain passed down through relational and behavioral patterns<\/p><\/li>\n<li><p>Cognitive impact: Residue shapes neural pathways, affecting how individuals process love, trust, and safety<\/p><\/li>\n<li><p>Biblical frame: Created in God’s image (Genesis 1:27), humans are wired for secure attachment; the Fall introduced disconnection; Christ’s redemption offers restoration of that original relational wholeness<\/p><\/li>\n<\/ul>\n<p>The therapist working from a Biblical Integrated Psychology model names the vacuum without pathologizing the person, helping clients understand that their responses to loss are normal reactions to abnormal experiences (Wright, 2011), while pointing to the spiritual resources available for filling those voids with truth, love, and identity in Christ.<\/p>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Thomas Walker uses both scientific and personal narrative to explain the Vacuum Effect. How does personal testimony strengthen or complicate pastoral counseling and teaching? Share a time when a personal story opened the door to deeper ministry.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>Walker describes ‘residue’ as something left behind by trauma that is more powerful than the vacuum itself. In your experience — personally or professionally — how does emotional residue show up in people’s lives? What does this look like in ministry settings?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>From a Biblical Integrated Psychology perspective, how do you understand generational curses theologically? How do you differentiate between spiritual bondage and psychological inheritance? How can both frameworks work together in counseling practice?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Walker says the vacuum can be positive if we allow it to be. What conditions must exist — spiritually, psychologically, and relationally — for a void to become an opportunity for growth rather than a pathway to destruction?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>How does Matthew 7:7-8 (‘Ask, Seek, Knock’) serve as both a pastoral invitation and a psychological directive? How would you apply this scripture in an actual counseling session without spiritually bypassing the real emotional work needed?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u2": {"title": "Unit 2: Surviving the Bad Situation", "group": "p2", "html": "<p><em>Chapter 1 — Bonding, Bondage, and Breaking Free<\/em><\/p>\n<p>Walker explores the critical difference between bonding and bondage. Healthy bonding — beginning with infant imprinting and mother-child attachment — forms the foundation of emotional security. When this is disrupted by trauma, crisis, or bad situations, individuals enter cycles of bondage: enslaved to the emotional patterns, people, and thought processes born from their pain.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>Imprinting: Konrad Lorenz’s theory of early bonding — the infant’s latching to the mother as emotional baseline<\/p>\n<p>Bonding vs. Bondage: Healthy connection vs. enslaving relational patterns driven by unresolved trauma<\/p>\n<p>Conduct Disorder: A pattern of violating others’ rights rooted in family history of antisocial behavior, abuse, and father absence<\/p>\n<p>Narcissistic Personality Disorder &amp; BPD: Vacuum-driven disorders presenting in relationships<\/p>\n<p>The Representative: The persona people project to hide their true wounded self in relationships<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor encountering someone in a bad situation must first become a safe harbor — a non-anxious presence. Walker’s insight about ‘the Representative’ — the polished persona people show in new relationships — has direct pastoral implications: people in the congregation may present one face publicly while carrying profound wounds privately.<\/p>\n<p>Pastoral counseling approaches for this unit:<\/p>\n<ul>\n<li><p>Practice active, patient listening that allows the person’s true story to emerge over time, not just the presenting issue<\/p><\/li>\n<li><p>Help congregants distinguish between crisis and trauma: crises are acute dangers; trauma is a lingering wound (Wright, 2011)<\/p><\/li>\n<li><p>Introduce the concept of emotional bondage using James 1:19-20 as a guide: be quick to hear, slow to speak, slow to anger<\/p><\/li>\n<li><p>Address the ‘insanity cycle’ (repeating the same relational patterns expecting different results) with grace and without judgment<\/p><\/li>\n<li><p>Use Matthew 5 (Sermon on the Mount) as a pastoral framework for surviving bad situations through spiritual formation<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “Let your light so shine before men, that they may see your good works and glorify your Father in heaven.” — Matthew 5:16<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>Biblical Integrated Psychology understands surviving bad situations through the lens of crisis response, trauma neuroscience, and spiritual resilience. Walker’s references to Conduct Disorder, Narcissistic Personality Disorder, and Borderline Personality Disorder point to diagnosable patterns rooted in childhood trauma and family dysfunction.<\/p>\n<p>Key psychological and biblical integrations:<\/p>\n<ul>\n<li><p>Crisis Theory: Each person has a different tolerance threshold; two people experiencing the same trauma respond differently (Wright, 2011). Biblical parallel: God gives each person sufficient grace for their unique burden (2 Corinthians 12:9)<\/p><\/li>\n<li><p>Trauma splitting: Children aged 3-4 years cope with overwhelming abuse by dissociating — creating a ‘split’ personality (Burland, 1994). Pastoral integration: This is not moral failure but a survival mechanism; healing requires safety before accountability<\/p><\/li>\n<li><p>Conduct Disorder and family systems: Johnson &amp; Johnson (2014) note that Conduct Disorder is more prevalent with marital conflict, divorce, and father absence — directly aligning with Walker’s Vacuum Effect framework<\/p><\/li>\n<li><p>BPD (1.4% of US adults; NAMI, 2017): Characterized by relational instability, identity disturbance, and fear of abandonment — all hallmarks of the vacuum. Biblical integrated therapy addresses the core wound of ‘I am not loved’ with the truth of Jeremiah 31:3<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker introduces ‘the Representative’ — the projected persona that conceals a person’s true wounded self. How does understanding this concept change how you approach initial pastoral meetings or intake counseling sessions? How can you create space for the real person to emerge?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>What is the difference between helping someone ‘survive’ a bad situation and truly healing from it? From both a pastoral and psychological standpoint, what are the risks of focusing only on survival without addressing the root trauma?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Walker distinguishes between bonding and bondage. Can you identify examples from Scripture or clinical experience where a person was bound by a relationship they mistook for a healthy bond? How does this show up in pastoral care settings?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>Conduct Disorder, Narcissistic Personality Disorder, and Borderline Personality Disorder are mentioned in this chapter. How should a pastoral counselor respond when someone they are counseling displays these patterns? What are the limits of pastoral care, and when should referral happen?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker ends Chapter 1 with: ‘Don’t Carry it. Bury it.’ What does ‘burying’ pain look like in a healthy, integrated biblical-psychological framework? How is this different from suppression or denial?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u3": {"title": "Unit 3: The Deceitful Heart", "group": "p2", "html": "<p><em>Chapter 2 — Masks, Hidden Wounds, and the Path to an Incorruptible Heart<\/em><\/p>\n<p>Drawing from 1 Peter 3:3-4, Walker explores how the Vacuum Effect teaches people to adorn their outer appearance while concealing the wounds within. The ‘deceitful heart’ is not malicious in intent but is the natural survival mechanism of a person who never received the affirmation, identity, and love they needed. The Middle Child Syndrome, nature vs. nurture, and the danger of parents projecting their own vacuum onto children are explored.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>The Mask: The outer adornment that hides the vacuum within — “cleaning the outside of the cup” (Matthew 23:25)<\/p>\n<p>Middle Child Syndrome: Feeling overlooked in a multi-child home, leading to over-achievement or emotional withdrawal<\/p>\n<p>Nature vs. Nurture: Edinburgh University findings that both genetics and environment equally shape development<\/p>\n<p>Incorruptible beauty: Peter’s vision of a heart healed beyond the wounds of the vacuum — the goal of pastoral and psychological work<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>The pastoral counselor’s role with the deceitful heart is not to expose or shame but to invite transparency through safety, grace, and consistent love. Pastors must be theologically equipped to address the heart’s deception without weaponizing Scripture. Walker’s use of Jeremiah 17:9 (‘The heart is deceitful above all things’) must be balanced with 1 Peter 3:3-4’s vision of a healed, incorruptible heart.<\/p>\n<p>Pastoral counseling strategies:<\/p>\n<ul>\n<li><p>Speak to the person’s inherent worth before addressing behavior; affirm identity before challenging patterns<\/p><\/li>\n<li><p>Help the person inventory their masks: What roles are they playing? What are they protecting?<\/p><\/li>\n<li><p>Use the Pharisee analogy (Matthew 23:25) gently: invite the person to consider the gap between the external presentation and their interior life<\/p><\/li>\n<li><p>Address the heart’s deception not as sinfulness but as a survival mechanism formed in response to unmet needs<\/p><\/li>\n<li><p>Affirm children in multi-child families individually, using Walker’s Middle Child Syndrome awareness as a pastoral alert<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “Let it be the hidden person of the heart, with the incorruptible beauty of a gentle and quiet spirit.” — 1 Peter 3:4<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The deceitful heart is understood through the psychological concept of cognitive distortion: the mind’s tendency to process reality through the filter of past wounds. The Vacuum Effect creates core beliefs such as ‘I am not loved,’ ‘I must perform to be accepted,’ and ‘I am invisible,’ which then manifest in relational patterns, emotional volatility, and self-sabotage.<\/p>\n<p>Integrated frameworks:<\/p>\n<ul>\n<li><p>Schema Therapy: Maladaptive schemas (deep-seated emotional patterns) formed in childhood to cope with unmet needs become the ‘deceitful heart’ — they feel true but distort reality<\/p><\/li>\n<li><p>Nature-Nurture Integration: The Edinburgh twin study confirms Walker’s point that each child in a family perceives love differently based on both genetics and relational experience. Biblical parallel: Each child is fearfully and wonderfully made with a unique heart (Psalm 139:14)<\/p><\/li>\n<li><p>Cognitive Behavioral integration: Identifying thought patterns (‘I am not enough’) and replacing them with truth-based affirmations (Jeremiah 29:11: ‘I know the plans I have for you’) is both CBT and biblical<\/p><\/li>\n<li><p>Emotional differentiation: Walker’s suggestion that parents ‘tell them: I see you, and I like you’ is clinically grounded in the importance of emotional validation for healthy self-concept development<\/p><\/li>\n<\/ul>\n<h3 id=\"discussion-thread-questions\">Discussion Thread Questions<\/h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th><strong>1<\/strong><\/th>\n<th>Walker says the heart’s deception is not always intentional — it is learned. How does this reframe how you approach ‘resistant’ or ‘defensive’ counseling clients? How should this understanding affect the pastoral response to someone who appears dishonest or hypocritical?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>2<\/strong><\/td>\n<td>The Pharisees in Matthew 23:25 are used as a metaphor for the masked self. However, Pharisees were also products of their religious culture. How might we avoid shaming people who are ‘performing’ their wellness while helping them access deeper healing?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>3<\/strong><\/td>\n<td>Middle Child Syndrome illustrates that children in the same home experience love differently. What responsibility does this place on pastoral counselors and parents? How can families implement Walker’s suggestion of individual affirmation?<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>4<\/strong><\/td>\n<td>From a Biblical Integrated Psychology standpoint, what is the relationship between the ‘deceitful heart’ (Jeremiah 17:9) and the ‘renewed mind’ (Romans 12:2)? How do these work together in the healing process?<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>5<\/strong><\/td>\n<td>Walker shares that for decades he concealed his vacuum. How does shame — the fear of being truly known — function as both a psychological barrier and a spiritual obstacle to healing? What does the pastoral counselor’s role look like in dismantling shame?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n", "track": true}, "p2-u4": {"title": "Unit 4: The Vacuum of Identity", "group": "p2", "html": "<p><em>Chapter 3 — Who Am I When No One Showed Me?<\/em><\/p>\n<p>Identity — defined by the APA as a continuous sense of self built from physical, psychological, and interpersonal characteristics — is profoundly shaped by parental relationship. Walker explores how the absence of a father leaves sons without a genetic mirror and daughters without a template for healthy love. Arrested Development, stinking thinking, and the spiritual battle over identity are examined through both psychological and Biblical lenses.<\/p>\n<table>\n<colgroup>\n<col style=\"width: 100%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><p><strong>Key Concepts<\/strong><\/p>\n<p>APA Definition of Identity: A continuous sense of self shaped by physical, psychological, and interpersonal characteristics (APA, 2020)<\/p>\n<p>Arrested Development: The stoppage of emotional, mental, or physical development due to childhood trauma (Psychology Today)<\/p>\n<p>Stinking Thinking: Thought patterns that sabotage the ability to see the world clearly and take accountability<\/p>\n<p>Biblical identity: Created by God for purpose (Jeremiah 29:11); redeemed through Christ (Romans 12:1-2)<\/p><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n\n<h3 id=\"pastoral-counseling-perspective\">Pastoral Counseling Perspective<\/h3>\n<p>One of the most sacred roles of the pastoral counselor is to speak identity into people who have never been told who they truly are. When the Vacuum Effect robs a person of their father’s voice, their mother’s affirmation, or their family’s blessing, the pastoral counselor may become the first consistent voice of truth and affirmation in that person’s life.<\/p>\n<p>Pastoral approaches to the vacuum of identity:<\/p>\n<ul>\n<li><p>Use biblically grounded affirmations to speak life into the person’s sense of self: ‘You are fearfully and wonderfully made’ (Psalm 139:14); ‘You are chosen’ (1 Peter 2:9)<\/p><\/li>\n<li><p>Help people identify the lies their vacuum planted: ‘I am invisible,’ ‘I don’t belong,’ ‘I am a burden’<\/p><\/li>\n<li><p>Recognize Arrested Development patterns: adults with childlike emotional responses are not weak — they are injured<\/p><\/li>\n<li><p>Offer the story of Scripture as an identity narrative: God’s covenant family includes the orphan, the widow, and the fatherless (Psalm 68:5)<\/p><\/li>\n<li><p>Address the spiritual dimension of identity battles: 2 Corinthians 10:3-5 teaches taking every thought captive to the obedience of Christ<\/p><\/li>\n<\/ul>\n<blockquote>\n<p><em>Key Scripture: “Therefore I urge you to present your bodies as a living sacrifice... be transformed by the renewing of your mind.” — Romans 12:1-2<\/em><\/p>\n<\/blockquote>\n<h3 id=\"biblical-integrated-psychology-perspective\">Biblical Integrated Psychology Perspective<\/h3>\n<p>The vacuum of identity is understood psychologically through Erikson’s stages of psychosocial development, object relations theory, and the neuroscience of self-concept formation. When parental bonds are severed or never established, the developing self lacks the secure base from which identity can be safely explored and consolidated.<\/p>\n<p>Integrated approaches:<\/p>\n<ul>\n<li><p>Arrested Development (Psychology Today): Clinically identifiable through traits such as pro
